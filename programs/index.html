    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif !important;
            font-weight: 600;
            user-select: none;
        }
        html, body {
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            touch-action: none;
        }
        body { background-color: #89b3f9; display: flex; justify-content: center; align-items: center; }

        .app-scaler { position: relative; display: flex; justify-content: center; align-items: center; transform-origin: center center; }
        .game-window { position: relative; display: inline-block; overflow: visible; }
        .menu-bg { display: block; width: auto; height: auto; filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.35)); }

        /* logo */
        .pr-logo {
            position: absolute; left: -36px; top: -69px; width: 360px; height: 112px;
            background: url("/images/programs-logo.png") no-repeat center center; background-size: 100% 100%;
            z-index: 998; pointer-events: none;
        }

        .close-btn {
            position: absolute; left: 1044px; top: -30px; width: 72px; height: 73px;
            background: url("/images/X.png") no-repeat center center; background-size: 100% 100%;
            cursor: pointer; z-index: 999;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.35));
            transition: all 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .close-btn:hover:not(:active) { left: 1042px; top: -34px; width: 76px; height: 77px; }
        .close-btn:active { background-image: url("/images/X-clicked.png"); left: 1047px; top: -29px; width: 66px; height: 67px; }

        /* ---------- posuvná oblast = celé okno jako na Overlays/Compare (scrollbar /scrollbar.js na stejném místě) ---------- */
        .pr-scroll {
            position: absolute; left: 8px; top: 7px; width: 1096px; height: 556px;
            overflow-y: auto; overflow-x: hidden; z-index: 900; border-radius: 16px;
            touch-action: pan-y pinch-zoom !important; overscroll-behavior: contain !important;
        }
        .pr-list { position: relative; width: 1096px; padding: 52px 34px 22px 14px; display: flex; flex-direction: column; gap: 10px; }
        .pr-tagline {
            position: absolute; right: 92px; top: 14px;
            font-size: 18px; color: #8E9099; font-weight: 700 !important; white-space: nowrap;
        }

        /* ---------- řádek programu (styl řádku klanu z Top Clans) ---------- */
        .prog {
            position: relative; flex-shrink: 0; height: 120px;
            background: #F7FFFF; border: 4px solid #000; border-radius: 14px;
            box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.05);
        }
        /* náhled programu: dlaždice s obrázkem uprostřed (obrys je zapečený v PNG) */
        .prog-shot {
            position: absolute; left: 8px; top: 8px; width: 178px; height: 96px; padding: 7px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #E4F3FF 0%, #C9E3FB 100%);
            border: 3px solid #000; border-radius: 11px; overflow: hidden; pointer-events: none;
        }
        .prog-shot img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
        .prog-name {
            position: absolute; left: 202px; top: 7px;
            font-size: 35px; line-height: 1.15; color: #FEFEFE; white-space: nowrap;
            -webkit-text-stroke: 8px #000; stroke-linejoin: round; -webkit-stroke-linejoin: round;
            paint-order: stroke fill; font-weight: 800 !important;
        }
        .prog-desc {
            position: absolute; left: 204px; top: 60px; width: 540px;
            font-size: 17px; line-height: 1.15; color: #2B2B2B; font-weight: 700 !important; font-style: italic;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .prog-meta, .prog-count {
            position: absolute; right: 258px; text-align: right;
            font-size: 15px; font-weight: 700 !important; white-space: nowrap;
        }
        .prog-meta { top: 12px; color: #8E9099; }
        .prog-count { top: 32px; color: #2DA84B; }
        .prog-count:empty { display: none; }

        /* tlačítko Download – stejný efekt jako velká tlačítka na hlavní stránce:
           najetí = o kousek větší, stisk = zamáčknutý obrázek a menší (vše kolem stejného středu) */
        .prog-btn {
            position: absolute; right: 18px; top: 22px; width: 216px; height: 68px;
            background: url("/images/download-button.png") no-repeat center center; background-size: 100% 100%;
            cursor: pointer; z-index: 5; -webkit-tap-highlight-color: transparent;
            transition: all 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .prog-btn:hover:not(:active) { right: 15.5px; top: 20px; width: 221px; height: 72px; z-index: 6; }
        .prog-btn:active { background-image: url("/images/download-button-clicked.png"); right: 22px; top: 24.5px; width: 208px; height: 63px; }
        .prog-btn.no-link { cursor: default; }

        /* návrh programu (šedé tlačítko z webu + text) */
        .prog.suggest { background: rgba(255, 255, 255, 0.6); border: 4px dashed #9A9EA8; box-shadow: none; }
        .prog.suggest .prog-shot { background: transparent; border: 3px dashed #9A9EA8; }
        .prog.suggest .prog-shot span {
            font-size: 64px; line-height: 1; color: #FFF; -webkit-text-stroke: 9px #9A9EA8; paint-order: stroke fill; font-weight: 800 !important;
        }
        .prog.suggest .prog-name { -webkit-text-stroke-color: #6E727C; }
        .prog.suggest .prog-desc { color: #6E727C; }
        .prog.suggest .prog-btn {
            background-image: url("/images/grey.png"); display: flex; align-items: center; justify-content: center; padding-bottom: 5px;
            font-size: 28px; color: #FFF; -webkit-text-stroke: 6px #000; paint-order: stroke fill; font-weight: 800 !important; text-decoration: none;
        }
        .prog.suggest .prog-btn:active { background-image: url("/images/grey-clicked.png"); padding-bottom: 1px; font-size: 26px; }

        /* upozornění dole */
        .disclaimer {
            display: flex; align-items: center; gap: 14px; margin-top: 2px; padding: 12px 18px;
            background: #FFF8DC; border: 4px solid #000; border-radius: 14px;
            font-size: 15px; line-height: 1.3; color: #5A5D66; font-weight: 600 !important;
        }
        .disclaimer i {
            flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #000;
            background: linear-gradient(#FFE873, #FFB21E); display: flex; align-items: center; justify-content: center;
            font-style: normal; font-size: 22px; color: #FFF; -webkit-text-stroke: 5px #000; paint-order: stroke fill; font-weight: 800 !important;
        }
        .disclaimer b { color: #1C2130; font-weight: 800 !important; }

        /* ---------- FEEDBACK / Privacy ---------- */
        .ps99-feedback-btn {
            position: fixed; top: 14px; right: 14px; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            padding: 5px 13px; background: #FFFFFF; border: 2.5px solid #000000; border-radius: 9px;
            color: #000000; font-size: 13.5px; font-weight: 600 !important; font-family: 'Fredoka', sans-serif !important;
            text-decoration: none; box-shadow: 0 3px 0 #000000, 0 5px 10px rgba(0, 0, 0, 0.2); cursor: pointer;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1),
                        box-shadow 0.044s cubic-bezier(0.1, 0.9, 0.2, 1),
                        background-color 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
            user-select: none;
        }
        .ps99-feedback-btn:hover:not(:active) { background-color: #F0F4FF; transform: translateY(-1.5px) scale(1.02); box-shadow: 0 4.5px 0 #000000, 0 7px 12px rgba(0, 0, 0, 0.25); }
        .ps99-feedback-btn:active { transform: translateY(2px) scale(0.96); box-shadow: 0 1px 0 #000000, 0 2px 4px rgba(0, 0, 0, 0.2); background-color: #E2E8F0; }

        .privacy-link {
            position: fixed; bottom: 14px; right: 14px; z-index: 99999;
            color: #FFFFFF; font-size: 13px; font-weight: 700 !important; text-decoration: underline;
            -webkit-text-stroke: 2.5px #000000; paint-order: stroke fill; cursor: pointer;
            opacity: 0.8; transition: opacity 0.2s ease;
        }
        .privacy-link:hover { opacity: 1; }
    </style>

<body>

    <div class="app-scaler" id="appScaler">
        <div class="game-window">
            <img class="menu-bg" src="/images/compare-bg.png" draggable="false" alt="">
            <div class="pr-logo"></div>

            <div class="pr-scroll" id="prScroll">
                <div class="pr-list" id="progList"></div>
            </div>

            <a class="close-btn" href="/" aria-label="Close" draggable="false"></a>
        </div>
    </div>

    <script>
        // ===================== PROGRAMY =====================
        // Nový program = jeden řádek.
        // id   – krátké jméno pro počítadlo stažení (malá písmena, čísla, pomlčka). NIKDY ho neměň, jinak se počet vynuluje.
        // name, desc (max 2 řádky), meta (šedě vpravo nahoře, volitelné), url (odkaz ke stažení)
        // shot = screenshot programu (images/programs/, max 368x188, s obrysem), nebo icon = čtvercová ikonka ~100x100
        const PROGRAMS = [
            { id: "roblox-account-manager", name: "Roblox Account Manager",
              desc: "Manage multiple Roblox accounts, switch between them in one click and run several accounts at once.",
              meta: "Windows · Free", shot: "/images/programs/ram.png",
              url: "https://github.com/ic3w0lf22/Roblox-Account-Manager/releases/tag/3.7.2" },
            { id: "op-auto-clicker", name: "OP Auto Clicker",
              desc: "Simple auto clicker – set the click speed, pick a hotkey and let it click for you.",
              meta: "Windows · Free", shot: "/images/programs/opautoclicker.png",
              url: "https://www.opautoclicker.com/" },
            { id: "tinytask", name: "TinyTask",
              desc: "Tiny macro recorder – record your mouse and keyboard once and replay it as many times as you want.",
              meta: "Windows · Free", shot: "/images/programs/tinytask.png",
              url: "https://tinytask.net/" },
        ];
        const SUGGEST_URL = "https://forms.gle/2DWB7Hzcv2XZ1PVCA";
        const COUNT_API = "https://rough-pine-d90f.dan13el.workers.dev/api/downloads";   // počítadlo stažení (worker + D1)
        // ====================================================

        (function () {
            const esc = (t) => String(t || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            const list = document.getElementById("progList");
            list.innerHTML = `<span class="pr-tagline">Free tools PS99 players actually use</span>` + PROGRAMS.map((p) => `
                <div class="prog" data-id="${esc(p.id)}">
                    <span class="prog-shot"><img src="${esc(p.shot || p.icon)}" alt="${esc(p.name)}" draggable="false"></span>
                    <span class="prog-name">${esc(p.name)}</span>
                    <span class="prog-desc">${esc(p.desc)}</span>
                    ${p.meta ? `<span class="prog-meta">${esc(p.meta)}</span>` : ""}
                    <span class="prog-count"></span>
                    <a class="prog-btn${p.url ? "" : " no-link"}" href="${esc(p.url || "#")}"${p.url ? ' target="_blank" rel="noopener"' : ""} aria-label="Download ${esc(p.name)}" draggable="false"></a>
                </div>`).join("") + `
                <div class="prog suggest">
                    <span class="prog-shot"><span>+</span></span>
                    <span class="prog-name">Suggest a program</span>
                    <span class="prog-desc">Know a program every PS99 player should have? Tell us and we will add it.</span>
                    <a class="prog-btn" href="${SUGGEST_URL}" target="_blank" rel="noopener" draggable="false">Suggest</a>
                </div>
                <div class="disclaimer"><i>!</i><span><b>Disclaimer:</b> PS99 Clans did not make these programs and is not responsible for any stolen, lost or banned accounts. Download only from the links above and never share your password or Roblox cookie with anyone.</span></div>`;

            // ---------- počítadlo stažení ----------
            // Ukáže se jen když worker odpoví. Jeden prohlížeč = jedno stažení na program (localStorage),
            // worker navíc počítá každou IP jen jednou, takže opakované klikání nic nepřidá.
            const counts = {};
            const show = (id) => {
                const row = list.querySelector(`.prog[data-id="${id}"] .prog-count`);
                if (row && counts[id] > 0) row.textContent = counts[id].toLocaleString("en-US") + (counts[id] === 1 ? " download" : " downloads");
            };
            let countsOk = false;
            fetch(COUNT_API).then((r) => r.json()).then((j) => {
                if (!j || j.status !== "ok" || !j.counts) return;
                countsOk = true;
                Object.assign(counts, j.counts);
                PROGRAMS.forEach((p) => show(p.id));
            }).catch(() => {});

            let done = {};
            try { done = JSON.parse(localStorage.getItem("ps99Downloads") || "{}") || {}; } catch (e) {}
            list.addEventListener("click", (e) => {
                const btn = e.target.closest(".prog-btn");
                if (!btn) return;
                if (btn.classList.contains("no-link")) { e.preventDefault(); return; }
                const row = btn.closest(".prog[data-id]");
                const id = row && row.dataset.id;
                if (!id || done[id]) return;
                done[id] = 1;
                try { localStorage.setItem("ps99Downloads", JSON.stringify(done)); } catch (x) {}
                try { fetch(COUNT_API + "/hit", { method: "POST", body: id, keepalive: true, headers: { "Content-Type": "text/plain" } }).catch(() => {}); } catch (x) {}
                if (countsOk) { counts[id] = (counts[id] || 0) + 1; show(id); }
            });
        })();

        function autoFitScreen() {
            if (window.visualViewport && window.visualViewport.scale > 1.01) return;   // uživatel zoomuje -> nic neměnit
            const scaler = document.getElementById("appScaler");
            if (!scaler) return;
            const winW = document.documentElement.clientWidth, winH = document.documentElement.clientHeight;
            if (winW >= 1150) { document.body.classList.remove("is-mobile"); scaler.style.transform = winH < 840 ? `scale(${(winH / 840).toFixed(4)})` : "none"; return; }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 650) * 0.92})`;
        }
        window.autoFitScreen = autoFitScreen;
        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);
        autoFitScreen();
    </script>

    <a href="https://forms.gle/2DWB7Hzcv2XZ1PVCA" target="_blank" class="ps99-feedback-btn">
        FEEDBACK
    </a>

    <a href="/privacy/" class="privacy-link">Privacy Policy</a>
    <script src="/scrollbar.js"></script>
    <script src="/hotbar.js?v=9"></script>
</body>
