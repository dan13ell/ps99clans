    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif !important;
            font-weight: 600;
            user-select: none;
        }
        html, body {
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            touch-action: none;
        }
        body { background-color: #89b3f9; display: flex; justify-content: center; align-items: center; }

        .app-scaler { position: relative; display: flex; justify-content: center; align-items: center; transform-origin: center center; }
        .game-window { position: relative; display: inline-block; overflow: visible; }
        .menu-bg { display: block; width: auto; height: auto; filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.35)); }

        /* logo */
        .pr-logo {
            position: absolute; left: -36px; top: -69px; width: 360px; height: 112px;
            background: url("/images/programs-logo.png") no-repeat center center; background-size: 100% 100%;
            z-index: 998; pointer-events: none;
        }

        .close-btn {
            position: absolute; left: 1044px; top: -30px; width: 72px; height: 73px;
            background: url("/images/X.png") no-repeat center center; background-size: 100% 100%;
            cursor: pointer; z-index: 999;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.35));
            transition: all 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .close-btn:hover:not(:active) { left: 1042px; top: -34px; width: 76px; height: 77px; }
        .close-btn:active { background-image: url("/images/X-clicked.png"); left: 1047px; top: -29px; width: 66px; height: 67px; }

        /* ---------- posuvná oblast v okně (scrollbar = /scrollbar.js, jezdec scroller.png) ---------- */
        .pr-scroll {
            position: absolute; left: 14px; top: 50px; width: 1072px; height: 508px;
            overflow-y: auto; overflow-x: hidden; z-index: 900;
            touch-action: pan-y pinch-zoom !important; overscroll-behavior: contain !important;
        }
        .pr-list { width: 1072px; padding: 4px 30px 12px 10px; display: flex; flex-direction: column; gap: 8px; }

        /* ---------- řádek programu (jako řádek klanu na Top Clans) ---------- */
        .prog {
            position: relative; display: block; flex-shrink: 0; height: 112px;
            background: #F7FFFF; border: 4px solid #000; border-radius: 12px;
            text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .prog:hover:not(:active) { transform: scale(1.012); z-index: 10; }
        .prog:active { transform: scale(0.97); }

        .prog-ic { position: absolute; left: 10px; top: 8px; width: 88px; height: 88px; object-fit: contain; pointer-events: none; }
        .prog-name {
            position: absolute; left: 114px; top: 4px; max-width: 610px; overflow: hidden; text-overflow: ellipsis;
            font-size: 35px; color: #FEFEFE; white-space: nowrap;
            -webkit-text-stroke: 8px #000; stroke-linejoin: round; -webkit-stroke-linejoin: round;
            paint-order: stroke fill; font-weight: 800 !important;
        }
        .prog-desc {
            position: absolute; left: 116px; top: 55px; width: 620px;
            font-size: 17px; line-height: 1.12; color: #2B2B2B; font-weight: 700 !important; font-style: italic;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .prog-meta {
            position: absolute; right: 232px; top: 10px;
            font-size: 15px; color: #8E9099; font-weight: 700 !important; white-space: nowrap;
        }

        /* tlačítko = obrázek tlačítka z webu + text */
        .prog-btn {
            position: absolute; right: 16px; top: 22px; width: 198px; height: 60px;
            background: url("/images/region-button.png") no-repeat center bottom; background-size: 100% 100%;
            display: flex; align-items: center; justify-content: center; padding-bottom: 4px;
            font-size: 27px; color: #FFF; -webkit-text-stroke: 6px #000; paint-order: stroke fill; font-weight: 800 !important;
            pointer-events: none;
        }
        .prog:active .prog-btn { background-image: url("/images/region-button-clicked.png"); top: 24px; height: 58px; padding-bottom: 2px; }

        /* poslední řádek – návrh programu */
        .prog.suggest { background: rgba(255, 255, 255, 0.55); border: 4px dashed #9A9EA8; }
        .prog.suggest .prog-ic { display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 4px dashed #9A9EA8;
            font-size: 56px; line-height: 1; color: #FFF; -webkit-text-stroke: 8px #9A9EA8; paint-order: stroke fill; font-weight: 800 !important; }
        .prog.suggest .prog-name { -webkit-text-stroke-color: #6E727C; }
        .prog.suggest .prog-desc { color: #6E727C; }
        .prog.suggest .prog-btn { background-image: url("/images/grey.png"); }
        .prog.suggest:active .prog-btn { background-image: url("/images/grey-clicked.png"); }

        /* ---------- FEEDBACK / Privacy ---------- */
        .ps99-feedback-btn {
            position: fixed; top: 14px; right: 14px; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            padding: 5px 13px; background: #FFFFFF; border: 2.5px solid #000000; border-radius: 9px;
            color: #000000; font-size: 13.5px; font-weight: 600 !important; font-family: 'Fredoka', sans-serif !important;
            text-decoration: none; box-shadow: 0 3px 0 #000000, 0 5px 10px rgba(0, 0, 0, 0.2); cursor: pointer;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1),
                        box-shadow 0.044s cubic-bezier(0.1, 0.9, 0.2, 1),
                        background-color 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
            user-select: none;
        }
        .ps99-feedback-btn:hover:not(:active) { background-color: #F0F4FF; transform: translateY(-1.5px) scale(1.02); box-shadow: 0 4.5px 0 #000000, 0 7px 12px rgba(0, 0, 0, 0.25); }
        .ps99-feedback-btn:active { transform: translateY(2px) scale(0.96); box-shadow: 0 1px 0 #000000, 0 2px 4px rgba(0, 0, 0, 0.2); background-color: #E2E8F0; }

        .privacy-link {
            position: fixed; bottom: 14px; right: 14px; z-index: 99999;
            color: #FFFFFF; font-size: 13px; font-weight: 700 !important; text-decoration: underline;
            -webkit-text-stroke: 2.5px #000000; paint-order: stroke fill; cursor: pointer;
            opacity: 0.8; transition: opacity 0.2s ease;
        }
        .privacy-link:hover { opacity: 1; }
    </style>

<body>

    <div class="app-scaler" id="appScaler">
        <div class="game-window">
            <img class="menu-bg" src="/images/compare-bg.png" draggable="false" alt="">
            <div class="pr-logo"></div>

            <div class="pr-scroll" id="prScroll">
                <div class="pr-list" id="progList"></div>
            </div>

            <a class="close-btn" href="/" aria-label="Close" draggable="false"></a>
        </div>
    </div>

    <script>
        // ===================== PROGRAMY =====================
        // Nový program = jeden řádek. name, desc (max 2 řádky), meta (vpravo nahoře, volitelné),
        // icon (PNG ~100x100), url (kam vede tlačítko), btn (text tlačítka, výchozí "Download")
        const PROGRAMS = [
            { name: "Program Name", desc: "Short description of the program and why it is useful for Pet Simulator 99 players.", meta: "Windows · Free", icon: "/images/hotbar/programs.png", url: "" },
            { name: "Program Name", desc: "Short description of the program and why it is useful for Pet Simulator 99 players.", meta: "Windows · Free", icon: "/images/hotbar/programs.png", url: "" },
            { name: "Program Name", desc: "Short description of the program and why it is useful for Pet Simulator 99 players.", meta: "Windows · Mac", icon: "/images/hotbar/programs.png", url: "" },
            { name: "Program Name", desc: "Short description of the program and why it is useful for Pet Simulator 99 players.", meta: "Browser", icon: "/images/hotbar/programs.png", url: "", btn: "Open" },
            { name: "Program Name", desc: "Short description of the program and why it is useful for Pet Simulator 99 players.", meta: "Android · iOS", icon: "/images/hotbar/programs.png", url: "" },
        ];
        const SUGGEST_URL = "https://forms.gle/2DWB7Hzcv2XZ1PVCA";
        // ====================================================

        (function () {
            const esc = (t) => String(t || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            const row = (p, extra) => `
                <a class="prog${extra || ""}" href="${esc(p.url || "#")}"${p.url ? ' target="_blank" rel="noopener"' : ""} draggable="false">
                    ${p.icon ? `<img class="prog-ic" src="${esc(p.icon)}" alt="" draggable="false">` : `<span class="prog-ic">+</span>`}
                    <span class="prog-name">${esc(p.name)}</span>
                    <span class="prog-desc">${esc(p.desc)}</span>
                    ${p.meta ? `<span class="prog-meta">${esc(p.meta)}</span>` : ""}
                    <span class="prog-btn">${esc(p.btn || "Download")}</span>
                </a>`;
            const list = document.getElementById("progList");
            list.innerHTML = PROGRAMS.map((p) => row(p)).join("") + row({
                name: "Suggest a program", desc: "Know a program every PS99 player should have? Tell us and we will add it.",
                url: SUGGEST_URL, btn: "Suggest"
            }, " suggest");
            list.addEventListener("click", (e) => { const a = e.target.closest("a.prog"); if (a && a.getAttribute("href") === "#") e.preventDefault(); });
        })();

        function autoFitScreen() {
            if (window.visualViewport && window.visualViewport.scale > 1.01) return;   // uživatel zoomuje -> nic neměnit
            const scaler = document.getElementById("appScaler");
            if (!scaler) return;
            const winW = document.documentElement.clientWidth, winH = document.documentElement.clientHeight;
            if (winW >= 1150) { document.body.classList.remove("is-mobile"); scaler.style.transform = winH < 840 ? `scale(${(winH / 840).toFixed(4)})` : "none"; return; }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 650) * 0.92})`;
        }
        window.autoFitScreen = autoFitScreen;
        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);
        autoFitScreen();
    </script>

    <a href="https://forms.gle/2DWB7Hzcv2XZ1PVCA" target="_blank" class="ps99-feedback-btn">
        FEEDBACK
    </a>
