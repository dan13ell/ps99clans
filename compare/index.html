    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif !important;
            font-weight: 600;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overscroll-behavior: none !important;
            touch-action: none;
        }

        body {
            background-color: #89b3f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-scaler {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
        }

        .game-window {
            position: relative;
            display: inline-block;
            overflow: visible;
        }

        .menu-bg {
            display: block;
            width: auto;
            height: auto;
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.35));
        }

        .clans-logo {
            position: absolute;
            left: -36px;
            top: -69px;
            width: 315px;
            height: 117px;
            background: url("/images/clans-logo.png") no-repeat center center;
            background-size: 100% 100%;
            z-index: 998;
        }

        .close-btn {
            position: absolute;
            left: 1044px;
            top: -30px;
            width: 72px;
            height: 73px;
            background: url("/images/X.png") no-repeat center center;
            background-size: 100% 100%;
            cursor: pointer;
            z-index: 999;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.35));
            transition: all 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .close-btn:hover:not(:active) { left: 1042px; top: -34px; width: 76px; height: 77px; }
        .close-btn:active { background-image: url("/images/X-clicked.png"); left: 1047px; top: -29px; width: 66px; height: 67px; }

        /* ---------- text ---------- */
        .stroke {
            color: #FEFEFE;
            -webkit-text-stroke: 6px #000000;
            stroke-linejoin: round;
            -webkit-stroke-linejoin: round;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
        }
        .grad {
            position: relative;
            color: #000000;
            -webkit-text-stroke: 6px #000000;
            stroke-linejoin: round;
            -webkit-stroke-linejoin: round;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
        }
        .grad::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            -webkit-text-stroke: 0px transparent;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grad-a::after  { background-image: linear-gradient(to bottom, #7CF6FA, #48D2F7); }
        .grad-b::after  { background-image: linear-gradient(to bottom, #FFA3C1, #FF4F86); }
        .grad-vs::after { background-image: linear-gradient(to bottom, #FFE873, #FFB21E); }

        .stage {
            position: absolute;
            left: 0;
            top: 0;
            width: 1100px;
            height: 570px;
            z-index: 900;
        }

        /* ---------- hledání ---------- */
        .search {
            position: absolute;
            top: 58px;
            width: 330px;
            height: 52px;
            background: url("/images/topclans-leaderboard-search.png") no-repeat center center;
            background-size: 100% 100%;
        }
        .search.a { left: 72px; }
        .search.b { left: 698px; }
        .search::before {
            content: "";
            position: absolute;
            left: 14px;
            top: 50%;
            width: 20px;
            height: 20px;
            margin-top: -10px;
            border-radius: 50%;
            border: 3px solid #000;
        }
        .search.a::before { background: #48D2F7; }
        .search.b::before { background: #FF4F86; }
        .search input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 0 20px 0 46px;
            color: #000;
            font-size: 30px;
            font-weight: 800 !important;
            text-align: center;
            text-transform: uppercase;
            user-select: text;
        }
        .search input::placeholder { color: #B1B1B1; font-weight: 600; text-transform: none; }

        .vs {
            position: absolute;
            left: 0;
            width: 1100px;
            top: 50px;
            text-align: center;
            font-size: 54px;
            line-height: 1;
            pointer-events: none;
        }

        /* ---------- prázdný stav ---------- */
        .empty {
            position: absolute;
            left: 0;
            top: 130px;
            width: 1100px;
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
        }
        .empty img { width: 140px; height: auto; }
        .empty .e-title { font-size: 46px; }
        .empty .e-sub { font-size: 22px; color: #9E9E9E; font-weight: 700 !important; }
        .empty .e-sub.err { color: #FF5555; }

        .result { display: none; }

        /* ---------- karty klanů ---------- */
        .clan-card {
            position: absolute;
            top: 128px;
            width: 506px;
            height: 186px;
            background: #FFFFFF;
            border: 4px solid #000;
            border-radius: 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 22px;
            cursor: pointer;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .clan-card:hover:not(:active) { transform: scale(1.01); }
        .clan-card:active { transform: scale(0.99); }
        .clan-card.a { left: 30px; box-shadow: inset 0 -6px 0 #48D2F7; }
        .clan-card.b { left: 564px; flex-direction: row-reverse; text-align: right; box-shadow: inset 0 -6px 0 #FF4F86; }

        .c-icon {
            width: 110px;
            height: 110px;
            border-radius: 18px;
            border: 4px solid #000;
            background: #FFF;
            object-fit: contain;
            flex: 0 0 auto;
        }
        .c-info { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
        .clan-card.b .c-info { align-items: flex-end; }
        .c-name { font-size: 44px; line-height: 1.05; }
        .c-meta { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
        .clan-card.b .c-meta { flex-direction: row-reverse; }
        .c-flag { width: 29px; height: 22px; border-radius: 3px; object-fit: cover; }
        .c-members { display: inline-flex; align-items: center; gap: 4px; font-size: 17px; color: #696A6E; font-weight: 700 !important; white-space: nowrap; }
        .c-members::before { content: ""; width: 19px; height: 19px; background: url("/images/people.png") no-repeat center / contain; }
        .rank-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 11px;
            border-radius: 13px;
            border: 3px solid #000;
            background: #FFF;
            font-size: 18px;
            font-weight: 800 !important;
            color: #262C2D;
            white-space: nowrap;
        }
        .rank-pill.gold   { background: linear-gradient(#FFE873, #FFB21E); }
        .rank-pill.silver { background: linear-gradient(#F4F6FA, #BFC6D4); }
        .rank-pill.bronze { background: linear-gradient(#FFC48A, #E4893A); }

        .c-points-row { position: relative; display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .clan-card.b .c-points-row { flex-direction: row-reverse; }
        .c-points-row img { width: 40px; height: 33px; object-fit: contain; }
        .c-points { font-size: 34px; }

        .gain {
            position: absolute;
            top: -6px;
            padding: 1px 10px;
            border-radius: 20px;
            border: 3px solid #000;
            background: #6BF06B;
            font-size: 17px;
            font-weight: 800 !important;
            color: #FEFEFE;
            -webkit-text-stroke: 4px #000;
            paint-order: stroke fill;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
        }
        .clan-card.a .gain { right: 0; }
        .clan-card.b .gain { left: 0; }
        .gain.go { animation: gain 2.4s ease-out forwards; }
        @keyframes gain {
            0%   { opacity: 0; transform: translateY(6px) scale(0.6); }
            12%  { opacity: 1; transform: translateY(-4px) scale(1.06); }
            22%  { transform: translateY(-6px) scale(1); }
            80%  { opacity: 1; transform: translateY(-22px); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        /* ---------- poměr bodů ---------- */
        .tug {
            position: absolute;
            left: 30px;
            top: 330px;
            width: 1040px;
            height: 46px;
            border: 4px solid #000;
            border-radius: 23px;
            overflow: hidden;
            background: linear-gradient(to bottom, #FFA3C1, #FF4F86);
        }
        .tug-a {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 50%;
            background: linear-gradient(to bottom, #8FF8FB, #48D2F7);
            border-right: 4px solid #000;
            transition: width 1.2s cubic-bezier(0.2, 0.9, 0.2, 1);
        }
        .tug-shine { position: absolute; left: 12px; right: 12px; top: 4px; height: 9px; border-radius: 6px; background: rgba(255,255,255,0.35); }
        .tug-label { position: absolute; top: 50%; transform: translateY(-50%); font-size: 22px; -webkit-text-stroke: 5px #000; }
        .tug-label.a { left: 16px; }
        .tug-label.b { right: 16px; }

        /* ---------- spodní řada ---------- */
        .mini {
            position: absolute;
            top: 392px;
            width: 280px;
            height: 156px;
            background: #FFFFFF;
            border: 4px solid #000;
            border-radius: 20px;
            padding: 10px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .mini.a { left: 30px; }
        .mini.b { left: 790px; }
        .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .mini-label { font-size: 15px; color: #9E9E9E; font-weight: 700 !important; letter-spacing: 0.4px; white-space: nowrap; }
        .mini-val { display: flex; align-items: center; gap: 5px; font-size: 25px; }
        .mini-val img { width: 28px; height: 24px; object-fit: contain; }
        .mini-val.win { color: #7CFF5B; }

        .diff {
            position: absolute;
            left: 326px;
            top: 392px;
            width: 448px;
            height: 156px;
            background: #FFFFFF;
            border: 4px solid #000;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.4s;
        }
        .diff.lead-a { box-shadow: inset 0 -6px 0 #48D2F7; }
        .diff.lead-b { box-shadow: inset 0 -6px 0 #FF4F86; }
        .diff-label { font-size: 15px; color: #9E9E9E; font-weight: 700 !important; letter-spacing: 0.6px; }
        .diff-value { font-size: 50px; }
        .diff-lead { font-size: 22px; -webkit-text-stroke: 5px #000; }
        .diff-sub { font-size: 15px; color: #696A6E; font-weight: 700 !important; margin-top: 1px; }

        /* ---------- odometer (rolující číslice) ---------- */
        .odo { display: inline-flex; align-items: flex-start; line-height: 1.1; height: 1.1em; }
        .odo-col {
            position: relative;
            display: inline-block;
            width: 0.6em;
            height: 1.1em;
            overflow: hidden;
            clip-path: inset(0 -0.1em);
            text-align: center;
            /* prolnutí nahoře a dole jako na počítadle */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 84%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 84%, transparent 100%);
        }
        .odo-sep { display: inline-block; width: 0.26em; text-align: center; }
        .odo-ribbon { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
        .odo-ribbon span { display: block; height: 1.1em; }
        .flash-up   { color: #7CFF5B !important; }
        .flash-down { color: #FF5C5C !important; }
        .fade { transition: color 1.6s ease-out; }

        /* ---------- FEEDBACK / Privacy ---------- */
        .ps99-feedback-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 13px;
            background: #FFFFFF;
            border: 2.5px solid #000000;
            border-radius: 9px;
            color: #000000;
            font-size: 13.5px;
            font-weight: 600 !important;
            font-family: 'Fredoka', sans-serif !important;
            text-decoration: none;
            box-shadow: 0 3px 0 #000000, 0 5px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1), 
                        box-shadow 0.044s cubic-bezier(0.1, 0.9, 0.2, 1), 
                        background-color 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
            user-select: none;
        }

        .ps99-feedback-btn:hover:not(:active) {
            background-color: #F0F4FF;
            transform: translateY(-1.5px) scale(1.02);
            box-shadow: 0 4.5px 0 #000000, 0 7px 12px rgba(0, 0, 0, 0.25);
        }

        .ps99-feedback-btn:active {
            transform: translateY(2px) scale(0.96);
            box-shadow: 0 1px 0 #000000, 0 2px 4px rgba(0, 0, 0, 0.2);
            background-color: #E2E8F0;
        }

        .privacy-link {
            position: fixed;
            bottom: 14px;
            right: 14px;
            z-index: 99999;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 700 !important;
            text-decoration: underline;
            -webkit-text-stroke: 2.5px #000000;
            paint-order: stroke fill;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .privacy-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="app-scaler" id="appScaler">

                <div class="result" id="result">

                            <div class="c-meta"><span class="rank-pill" id="rankB">#?</span><img class="c-flag" id="flagB" src="" alt=""><span class="c-members" id="membersB"></span></div>
                            <div class="c-points-row"><img src="/images/stars.png" alt=""><span class="c-points stroke" id="pointsB"></span><span class="gain" id="gainB"></span></div>

    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const UPDATE_MS = 10000;   // jak často se obnovují body
        const ODO_MS = 3500;       // délka rolování čísel
        const $ = (id) => document.getElementById(id);

        function autoFitScreen() {
            const scaler = $("appScaler");
            if (!scaler) return;
            const winW = window.innerWidth, winH = window.innerHeight;
            if (winW >= 1150) { document.body.classList.remove("is-mobile"); scaler.style.transform = "none"; return; }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 780) * 0.92})`;
        }
        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);

        // ---------- pomocné ----------
        function short(num) {
            if (!num) return "0";
            const suf = ["", "k", "m", "b", "t"];
            let i = 0, v = Math.abs(num);
            while (v >= 1000 && i < suf.length - 1) { v /= 1000; i++; }
            let f = v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
            if (f.includes(".")) f = f.replace(/\.?0+$/, "");
            return (num < 0 ? "-" : "") + f + suf[i];
        }
        function flagUrl(cc) {
            if (!cc || cc.length !== 2) return "";
            const cp = cc.toUpperCase().split("").map((c) => 0x1F1E6 + c.charCodeAt(0) - 65);
            return `https://twemoji.maxcdn.com/v/14.0.2/svg/${cp[0].toString(16)}-${cp[1].toString(16)}.svg`;
        }
        function iconUrl(icon) {
            const id = (icon || "").replace("rbxassetid://", "").trim();
            return id ? `https://ps99.biggamesapi.io/image/${id}` : "https://placehold.co/175x175/ffffff/000000?text=Clan";
        }
        function setGrad(el, t) { el.textContent = t; el.setAttribute("data-text", t); }
        function flash(el, up) {
            el.classList.remove("fade", "flash-up", "flash-down");
            el.classList.add(up ? "flash-up" : "flash-down");
            setTimeout(() => { el.classList.add("fade"); el.classList.remove("flash-up", "flash-down"); }, 60);
        }

        // ---------- odometer: každá číslice je páska, která se odroluje na nové číslo ----------
        class Odometer {
            constructor(el, ms) { this.el = el; this.ms = ms; this.value = null; this.token = 0; el.classList.add("odo"); }
            set(v, animate = true) {
                v = Math.max(0, Math.round(v || 0));
                const old = this.value;
                this.value = v;
                const t = ++this.token;
                if (old === null || !animate || old === v) return this.draw(v);
                this.roll(old, v);
                setTimeout(() => { if (t === this.token) this.draw(v); }, this.ms + 80);
            }
            put(cols) {
                const out = [];
                cols.forEach((c, i) => { if (i && i % 3 === 0) out.push(`<span class="odo-sep">,</span>`); out.push(c); });
                this.el.innerHTML = out.reverse().join("");
            }
            draw(v) {
                const s = String(v), cols = [];
                for (let i = s.length - 1; i >= 0; i--) cols.push(`<span class="odo-col"><span class="odo-ribbon"><span>${s[i]}</span></span></span>`);
                this.put(cols);
            }
            roll(old, v) {
                const len = String(Math.max(old, v)).length, up = v > old, cols = [];
                for (let i = 0; i < len; i++) {
                    const p = 10 ** i, t0 = Math.floor(old / p), t1 = Math.floor(v / p);
                    if (t0 === t1) { cols.push(`<span class="odo-col"><span class="odo-ribbon"><span>${t1 % 10}</span></span></span>`); continue; }
                    const steps = Math.abs(t1 - t0), seq = [];
                    if (steps <= 20) for (let k = 0; k <= steps; k++) seq.push(up ? t0 + k : t0 - k);
                    else { for (let k = 0; k < 6; k++) seq.push(up ? t0 + k : t0 - k); for (let k = 13; k >= 0; k--) seq.push(up ? t1 - k : t1 + k); }
                    const d = seq.map((t) => ((t % 10) + 10) % 10);
                    if (!up) d.reverse();
                    const n = d.length - 1;
                    cols.push(`<span class="odo-col"><span class="odo-ribbon" data-n="${n}" style="transform:translateY(${up ? 0 : -n * 1.1}em)">${d.map((x) => `<span>${x}</span>`).join("")}</span></span>`);
                }
                // u čísla, které se zkrátilo, zmizí přebytečné nuly vlevo až po dorolování
                this.put(cols);
                void this.el.offsetWidth;
                this.el.querySelectorAll(".odo-ribbon[data-n]").forEach((r) => {
                    const n = +r.dataset.n;
                    r.style.transition = `transform ${this.ms}ms cubic-bezier(0.15, 0.75, 0.15, 1)`;
                    r.style.transform = `translateY(${up ? -n * 1.1 : 0}em)`;
                });
            }
        }

        // ---------- data ----------
        let battleId = null;
        async function loadBattle() {
            try {
                const j = await (await fetch(`${WORKER_URL}/activeClanBattle`)).json();
                if (j && j.status === "ok" && j.data) battleId = j.data.configName || null;
            } catch (e) {}
        }

        async function fetchClan(tag) {
            const j = await (await fetch(`${WORKER_URL}/clan/${encodeURIComponent(tag)}`)).json();
            if (!j || j.status !== "ok" || !j.data) return null;
            const c = j.data;
            const battles = c.Battles || {};
            const list = Array.isArray(battles) ? battles : Object.values(battles);
            const active = battleId ? ((!Array.isArray(battles) && battles[battleId]) || list.find((b) => b.BattleID === battleId) || null) : null;
            const members = (c.Members || []).length + ((c.Members || []).some((m) => m.UserID === c.Owner) ? 0 : 1);
            const points = active ? (active.Points || 0) : 0;
            const contributors = active && Array.isArray(active.PointContributions) ? active.PointContributions.filter((x) => (x.Points || 0) > 0).length : 0;
            return {
                name: c.Name,
                icon: iconUrl(c.Icon),
                flag: flagUrl(c.CountryCode),
                members,
                capacity: c.MemberCapacity || 75,
                diamonds: c.DepositedDiamonds || 0,
                points,
                place: active && active.Place ? active.Place : null,
                contributors,
                avg: members ? points / members : 0
            };
        }

        // ---------- vykreslení ----------
        const odo = {};
        let tags = { a: "", b: "" }, prev = null, timer = null, token = 0;

        function showEmpty(text, isErr) {
            $("result").style.display = "none";
            $("empty").style.display = "flex";
            const s = $("emptySub");
            s.textContent = text;
            s.classList.toggle("err", !!isErr);
        }

        function gain(side, delta) {
            const el = $("gain" + side);
            el.classList.remove("go");
            void el.offsetWidth;
            el.textContent = (delta > 0 ? "+" : "-") + short(Math.abs(delta));
            el.style.background = delta > 0 ? "#6BF06B" : "#FF5C5C";
            el.classList.add("go");
        }

        function miniHtml(me, other) {
            const row = (label, a, b, text, icon) => {
                const win = a > b ? " win" : "";
                return `<div class="mini-row"><span class="mini-label">${label}</span><span class="mini-val stroke${win}">${icon ? `<img src="${icon}" alt="">` : ""}${text}</span></div>`;
            };
            return row("ACTIVE", me.contributors, other.contributors, `${me.contributors}/${me.members}`)
                 + row("AVG / MEMBER", me.avg, other.avg, short(me.avg), "/images/stars.png")
                 + row("DIAMONDS", me.diamonds, other.diamonds, short(me.diamonds), "/images/gems.png");
        }

        function render(A, B) {
            const animate = !!prev;
            $("empty").style.display = "none";
            $("result").style.display = "block";

            for (const [s, d, k] of [["A", A, "a"], ["B", B, "b"]]) {
                if (!animate) {
                    $("icon" + s).src = d.icon;
                    $("icon" + s).onerror = function () { this.src = "https://placehold.co/175x175/ffffff/000000?text=Clan"; };
                    const f = $("flag" + s);
                    f.style.display = d.flag ? "" : "none";
                    if (d.flag) f.src = d.flag;
                    f.onerror = function () { this.style.display = "none"; };
                    setGrad($("name" + s), `[${d.name}]`);
                    $("card" + s).onclick = () => { location.href = `/clan-detail/?name=${encodeURIComponent(d.name)}`; };
                }
                $("members" + s).textContent = `${d.members}/${d.capacity}`;
                const r = $("rank" + s);
                r.textContent = d.place ? `#${d.place}` : "#?";
                r.className = "rank-pill " + (d.place === 1 ? "gold" : d.place === 2 ? "silver" : d.place === 3 ? "bronze" : "");

                const before = prev ? prev[k] : null;
                odo[s].set(d.points, animate);
                if (animate && before !== d.points) { flash($("points" + s), d.points > before); gain(s, d.points - before); }
            }

            // poměr
            const total = A.points + B.points, pa = total ? A.points / total : 0.5;
            $("tugA").style.width = `${Math.max(2, Math.min(98, pa * 100)).toFixed(2)}%`;
            $("tugLabelA").textContent = `${(pa * 100).toFixed(1)}%`;
            $("tugLabelB").textContent = `${((1 - pa) * 100).toFixed(1)}%`;

            // rozdíl
            const diff = A.points - B.points, abs = Math.abs(diff);
            const prevAbs = prev ? Math.abs(prev.a - prev.b) : null;
            odo.D.set(abs, animate);
            if (animate && prevAbs !== abs) flash($("diffValue"), abs > prevAbs);
            const box = $("diffBox"), lead = $("diffLead"), sub = $("diffSub");
            box.className = "diff " + (diff > 0 ? "lead-a" : diff < 0 ? "lead-b" : "");
            if (!total) { lead.textContent = "No battle points yet"; lead.style.color = "#FEFEFE"; sub.textContent = ""; }
            else if (!diff) { lead.textContent = "It's a tie!"; lead.style.color = "#FFD34A"; sub.textContent = ""; }
            else {
                const L = diff > 0 ? A : B, T = diff > 0 ? B : A;
                lead.textContent = `[${L.name}] leads`;
                lead.style.color = diff > 0 ? "#48D2F7" : "#FF4F86";
                const ratio = T.points ? L.points / T.points : 0;
                sub.textContent = !T.points ? `[${T.name}] has 0 points`
                    : ratio < 1.1 ? `+${((ratio - 1) * 100).toFixed(2)}% ahead`
                    : `${ratio.toFixed(2)}× more points`;
            }

            $("miniA").innerHTML = miniHtml(A, B);
            $("miniB").innerHTML = miniHtml(B, A);

            prev = { a: A.points, b: B.points };
        }

        async function update(first) {
            const t = token;
            const [A, B] = await Promise.all([fetchClan(tags.a).catch(() => undefined), fetchClan(tags.b).catch(() => undefined)]);
            if (t !== token) return;
            if (!A || !B) {
                if (!first) return;             // výpadek při obnovení – zkusí se příště
                const bad = !A ? tags.a : tags.b;
                const missing = (!A ? A : B) === null;
                showEmpty(missing ? `Clan [${bad}] was not found!` : "Error loading clans, try again.", true);
                stop();
                return;
            }
            render(A, B);
        }

        function stop() { if (timer) clearInterval(timer); timer = null; }

        let lastKey = "";
        async function start() {
            const a = $("inputA").value.trim().toUpperCase(), b = $("inputB").value.trim().toUpperCase();
            const key = a + "|" + b;
            if (key === lastKey) return;
            lastKey = key;
            const q = new URLSearchParams();
            if (a) q.set("a", a);
            if (b) q.set("b", b);
            history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
            stop();
            token++;
            prev = null;
            if (!a || !b) { showEmpty("Type two clan tags above and press Enter!"); return; }
            tags = { a, b };
            showEmpty("Loading...");
            if (!battleId) await loadBattle();
            await update(true);
            if (prev) timer = setInterval(() => update(false), UPDATE_MS);
        }

        ["inputA", "inputB"].forEach((id) => {
            const el = $(id);
            el.addEventListener("input", () => { el.value = el.value.replace(/\s+/g, ""); });
            el.addEventListener("keydown", (e) => {
                if (e.key !== "Enter") return;
                e.preventDefault();
                if (id === "inputA" && !$("inputB").value.trim()) { $("inputB").focus(); return; }
                el.blur();
                start();
            });
            el.addEventListener("change", () => { if ($("inputA").value.trim() && $("inputB").value.trim()) start(); });
        });

        window.addEventListener("DOMContentLoaded", () => {
            autoFitScreen();
            odo.A = new Odometer($("pointsA"), ODO_MS);
            odo.B = new Odometer($("pointsB"), ODO_MS);
            odo.D = new Odometer($("diffValue"), ODO_MS);
            const p = new URLSearchParams(location.search);
            $("inputA").value = (p.get("a") || "").toUpperCase().slice(0, 4);
            $("inputB").value = (p.get("b") || "").toUpperCase().slice(0, 4);
            if ($("inputA").value && $("inputB").value) start();
        });
    </script>
