    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif !important;
            font-weight: 600;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overscroll-behavior: none !important;
            touch-action: none;
        }

        body {
            background-color: #89b3f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-scaler {
            position: relative;
            display: flex;
            justify-content: center;

            transform-origin: center center;
        }

        .game-window {
            position: relative;
            display: inline-block;
            overflow: visible;
        }

        .menu-bg {
            display: block;
            width: auto;
            height: auto;
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.35));
        }

        /* logo "Compare!" místo "Clans!" */
        .compare-logo {
            position: absolute;
            left: -36px;
            top: -69px;
            width: 359px;
            height: 117px;
            background: url("/images/compare-logo.png") no-repeat center center;
            background-size: 100% 100%;
            z-index: 998;
            pointer-events: none;
        }

        .close-btn {
            position: absolute;
            left: 1044px;
            top: -30px;
            width: 72px;
            height: 73px;
            background: url("/images/X.png") no-repeat center center;
            background-size: 100% 100%;
            cursor: pointer;
            z-index: 999;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.35));
            transition: all 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .close-btn:hover:not(:active) { left: 1042px; top: -34px; width: 76px; height: 77px; }
        .close-btn:active { background-image: url("/images/X-clicked.png"); left: 1047px; top: -29px; width: 66px; height: 67px; }

        .stage { position: absolute; left: 0; top: 0; width: 1100px; height: 570px; z-index: 900; }

        /* společné */
        .num {
            font-family: 'Roboto', sans-serif !important;
            font-weight: 600 !important;
            color: #1C2130;
            white-space: nowrap;
        }
        .card {
            position: absolute;
            background: #FFFFFF;
            border: 7px solid #2F3036;
            border-radius: 26px;
        }
        .label {
            font-size: 17px;

        /* ---------- karty klanů ---------- */
        .clan-card {
            top: 44px;
            width: 520px;
            height: 278px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
        }
        .clan-card.a { left: 24px; }
        .clan-card.b { left: 556px; }

        .clan-card > * { flex: 0 0 auto; }
        .icon-wrap { position: relative; width: 104px; height: 104px; flex: 0 0 auto; }
        .c-icon {
            width: 104px;

            border-radius: 50%;
            border: 6px solid #2F3036;
            background: #FFFFFF;

        .c-icon.placeholder { object-fit: contain; padding: 18px; opacity: 0.35; }
        .c-flag {

            right: -4px;

        /* název klanu = políčko na psaní */

        .chart svg { position: absolute; left: 6px; top: 4px; width: 1026px; height: 98px; overflow: visible; }

        /* ---------- odometer ---------- */
        .odo { display: inline-flex; align-items: flex-start; line-height: 1.15; height: 1.15em; overflow: hidden; }
        .odo-col { position: relative; display: inline-block; width: 0.56em; height: 1.15em; overflow: hidden; text-align: center; }
        .odo-sep { display: inline-block; width: 0.25em; text-align: center; }

        .odo-ribbon > span { display: block; height: 1.15em; }
        .odo-col.rolling { -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%); }

        /* ---------- FEEDBACK / Privacy ---------- */
        .ps99-feedback-btn {
            position: fixed;
            top: 14px;
            right: 14px;

            display: flex;
            align-items: center;

            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1),

        .ps99-feedback-btn:hover:not(:active) {
            background-color: #F0F4FF;

        .ps99-feedback-btn:active {

    </style>

                    </div>
                    <div class="name-row"><span class="br">[</span><input class="clan-input" id="inputB" maxlength="4" placeholder="CLAN" autocomplete="off" spellcheck="false"><span class="br">]</span></div>
                    <div class="c-points num" id="pointsB"></div>
                    <div class="c-points-label label"><img src="/images/hvezda.png" alt="">TOTAL POINTS</div>

    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";

        // ---------- NASTAVENÍ (stejný princip jako live stránka) ----------
        const POLL_MS = 10000;          // jak často se stahují klany
        const SMOOTH_MS = 15000;        // nový přírůstek bodů se rozdělí na 4 kroky po 15 s
        const SMOOTH_STEPS = 4;
        const ODO_MS = 2500;            // délka rolování čísel
        const BATTLE_MS = 300000;       // aktivní bitva se obnovuje jednou za 5 minut
        const CHART_MAX = 240;          // kolik bodů drží graf
        const CHART_HEARTBEAT = 15000;  // i bez změny se do grafu přidá bod jednou za 15 s

        const $ = (id) => document.getElementById(id);
        const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";

        function autoFitScreen() {
            const scaler = $("appScaler");
            if (!scaler) return;
            const winW = window.innerWidth, winH = window.innerHeight;
            if (winW >= 1150) { document.body.classList.remove("is-mobile"); scaler.style.transform = "none"; return; }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 780) * 0.92})`;
        }
        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);

        // ---------- pomocné ----------
        function short(v) {
            const a = Math.abs(v), f = (x, s) => parseFloat(x.toFixed(2)) + s;
            if (a >= 1e12) return f(v / 1e12, "t");
            if (a >= 1e9) return f(v / 1e9, "b");
            if (a >= 1e6) return f(v / 1e6, "m");
            if (a >= 1e3) return f(v / 1e3, "k");
            return String(Math.round(v));
        }
        function flagUrl(cc) {
            if (!cc || cc.length !== 2) return "";
            const cp = cc.toUpperCase().split("").map((c) => 0x1F1E6 + c.charCodeAt(0) - 65);
            return `https://twemoji.maxcdn.com/v/14.0.2/svg/${cp[0].toString(16)}-${cp[1].toString(16)}.svg`;
        }
        function iconUrl(icon) {
            const id = (icon || "").replace("rbxassetid://", "").trim();
            return id ? `https://ps99.biggamesapi.io/image/${id}` : "";
        }
        function agoLabel(t) {
            const s = Math.max(0, Math.round((Date.now() - t) / 1000));
            if (s < 5) return "now";
            if (s < 60) return `${Math.round(s / 5) * 5}s ago`;
            const m = Math.floor(s / 60);
            return m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ago`;
        }

        // ---------- ODOMETER: číslice jsou pásky, které se plynule odrolují ----------
        class Odometer {
            constructor(el) { this.el = el; this.value = null; this.timer = null; el.classList.add("odo"); }
            set(v, animate = true) {
                v = Math.max(0, Math.round(v || 0));
                const old = this.value;
                this.value = v;
                clearTimeout(this.timer);
                if (old === null || !animate || old === v) return this.draw(v);
                this.roll(old, v);
                this.timer = setTimeout(() => this.draw(v), ODO_MS + 60);
            }
            put(cols) {
                const out = [];
                cols.forEach((c, i) => { if (i && i % 3 === 0) out.push(`<span class="odo-sep">,</span>`); out.push(c); });
                this.el.innerHTML = out.reverse().join("");
            }
            draw(v) {
                const s = String(v), cols = [];
                for (let i = s.length - 1; i >= 0; i--) cols.push(`<span class="odo-col"><span class="odo-ribbon"><span>${s[i]}</span></span></span>`);
                this.put(cols);
            }
            roll(old, v) {
                const len = String(v).length, up = v > old, cols = [];
                for (let i = 0; i < len; i++) {
                    const p = 10 ** i, t0 = Math.floor(old / p), t1 = Math.floor(v / p);
                    if (t0 === t1) { cols.push(`<span class="odo-col"><span class="odo-ribbon"><span>${t1 % 10}</span></span></span>`); continue; }
                    // páska číslic od staré k nové hodnotě; u velkých skoků jen začátek + konec (max 12 číslic)
                    const steps = Math.abs(t1 - t0), seq = [];
                    if (steps <= 11) for (let k = 0; k <= steps; k++) seq.push(up ? t0 + k : t0 - k);
                    else { for (let k = 0; k < 3; k++) seq.push(up ? t0 + k : t0 - k); for (let k = 8; k >= 0; k--) seq.push(up ? t1 - k : t1 + k); }
                    let d = seq.map((t) => ((t % 10) + 10) % 10);
                    if (!up) d = d.reverse();
                    const n = d.length - 1;
                    cols.push(`<span class="odo-col rolling"><span class="odo-ribbon" data-n="${n}" style="transform:translate3d(0,${up ? 0 : -n * 1.15}em,0)">${d.map((x) => `<span>${x}</span>`).join("")}</span></span>`);
                }
                this.put(cols);
                void this.el.offsetWidth;
                requestAnimationFrame(() => {
                    this.el.querySelectorAll(".odo-ribbon[data-n]").forEach((r) => {
                        const n = +r.dataset.n;
                        r.style.transition = `transform ${ODO_MS}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
                        r.style.transform = `translate3d(0,${up ? -n * 1.15 : 0}em,0)`;
                    });
                });
            }
        }

        // ---------- stav ----------
        const side = {
            a: { key: "A", tag: "", data: null, current: 0, lastApi: null, smooth: null, loading: false },
            b: { key: "B", tag: "", data: null, current: 0, lastApi: null, smooth: null, loading: false }
        };
        const odo = {};
        let battleId = "", battleAt = 0;
        let history = [], lastChartAt = 0;

        async function loadBattle() {
            if (battleId && Date.now() - battleAt < BATTLE_MS) return;
            try {
                const j = await (await fetch(`${WORKER_URL}/activeClanBattle`)).json();
                if (j && j.status === "ok" && j.data) { battleId = j.data.configName || battleId; battleAt = Date.now(); }
            } catch (e) {}
        }

        async function fetchClan(tag) {
            const j = await (await fetch(`${WORKER_URL}/clan/${encodeURIComponent(tag)}`)).json();
            if (!j || j.status !== "ok" || !j.data) return null;
            const c = j.data;
            const battles = c.Battles || {};
            const list = Array.isArray(battles) ? battles : Object.values(battles);
            const active = battleId ? ((!Array.isArray(battles) && battles[battleId]) || list.find((b) => b.BattleID === battleId) || null) : null;
            const raw = Array.isArray(c.Members) ? c.Members.length : 0;
            return {
                name: c.Name,
                icon: iconUrl(c.Icon),
                flag: flagUrl(c.CountryCode),
                members: raw > 0 ? raw + 1 : 0,            // + vlastník (jako live stránka)
                gems: c.DepositedDiamonds || 0,
                points: active ? (active.Points || 0) : (c.Points || 0),
                place: active && active.Place ? active.Place : null
            };
        }

        // ---------- plynulé dopočítávání (4 kroky po 15 s) ----------
        function stopSmoothing(s) { if (s.smooth) { clearInterval(s.smooth.id); s.smooth = null; } }
        function startSmoothing(s, target) {
            stopSmoothing(s);
            const sm = { target, chunk: (target - s.current) / SMOOTH_STEPS, step: 0, id: null };
            s.smooth = sm;
            const step = () => {
                sm.step++;
                if (sm.step >= SMOOTH_STEPS) { s.current = sm.target; stopSmoothing(s); }
                else s.current = Math.round(s.current + sm.chunk);
                render();
            };
            step();
            if (s.smooth) sm.id = setInterval(step, SMOOTH_MS);
        }

        // ---------- vykreslení ----------
        function renderCard(s) {
            const K = s.key, d = s.data;
            const icon = $("icon" + K), flag = $("flag" + K), rank = $("rank" + K);
            if (!d) {
                icon.src = "/images/hotbar/clans.png"; icon.classList.add("placeholder"); icon.onclick = null; icon.style.cursor = "";
                flag.src = BLANK; flag.classList.add("empty");
                rank.className = "rank-pill hidden";
                return;
            }
            if (icon.dataset.src !== d.icon) {
                icon.dataset.src = d.icon;
                icon.classList.remove("placeholder");
                icon.src = d.icon || "https://placehold.co/150x150/ffffff/000000?text=Clan";
                icon.onerror = function () { this.onerror = null; this.src = "https://placehold.co/150x150/ffffff/000000?text=Clan"; };
            }
            icon.style.cursor = "pointer";
            icon.onclick = () => { location.href = `/clan-detail/?name=${encodeURIComponent(d.name)}`; };
            if (d.flag) { if (flag.dataset.src !== d.flag) { flag.dataset.src = d.flag; flag.src = d.flag; } flag.classList.remove("empty"); }
            else { flag.src = BLANK; flag.classList.add("empty"); }
            flag.onerror = function () { this.src = BLANK; this.classList.add("empty"); };
            rank.textContent = d.place ? `#${d.place}` : "";
            rank.className = "rank-pill " + (!d.place ? "hidden" : d.place === 1 ? "gold" : d.place === 2 ? "silver" : d.place === 3 ? "bronze" : "");
        }

        function renderStats(s) {
            const d = s.data, el = $("stats" + s.key);
            const avg = d && d.members ? Math.round(s.current / d.members) : 0;
            const item = (img, val, label) => `<div class="stat"><img src="${img}" alt=""><span class="num">${val}</span><span class="label">${label}</span></div>`;
            el.innerHTML = item("/images/gems.png", d ? short(d.gems) : "-", "DIAMONDS")
                         + item("/images/stars.png", d ? short(avg) : "-", "AVG / PERSON")
                         + item("/images/people.png", d ? String(d.members) : "-", "MEMBERS");
        }

        // velikost písma tak, aby se číslo vždy vešlo (0.56em číslice, 0.25em čárka)
        function fit(el, v, maxPx, maxW) {
            const n = String(Math.max(0, Math.round(v))).length, seps = Math.floor((n - 1) / 3);
            el.style.fontSize = Math.min(maxPx, maxW / (n * 0.56 + seps * 0.25)).toFixed(1) + "px";
        }

        let rendered = false;
        function render() {
            const A = side.a, B = side.b;
            fit($("pointsA"), A.current, 58, 470);
            fit($("pointsB"), B.current, 58, 470);
            odo.A.set(A.data ? A.current : 0, rendered);
            odo.B.set(B.data ? B.current : 0, rendered);
            renderCard(A); renderCard(B);
            renderStats(A); renderStats(B);

            const both = A.data && B.data;
            const diff = both ? A.current - B.current : 0;
            fit($("diffValue"), Math.abs(diff), 44, 400);
            odo.D.set(Math.abs(diff), rendered);
            const lead = $("diffLead");
            if (!both) lead.innerHTML = "&nbsp;";
            else if (!diff) lead.textContent = "It's a tie!";
            else {
                const L = diff > 0 ? A : B, T = diff > 0 ? B : A;
                const pct = T.current ? ((L.current / T.current - 1) * 100) : null;
                const extra = pct === null ? "" : pct >= 100 ? ` · ${(L.current / T.current).toFixed(2)}× more` : ` · +${pct.toFixed(2)}% ahead`;
                lead.innerHTML = `<b style="color:${diff > 0 ? "#2DB9E5" : "#FF4F86"}">[${L.data.name}]</b> leads${extra}`;
            }
            rendered = true;
            if (both) pushChart(diff, false);
        }

        // ---------- graf rozdílu (vlastní SVG, bez knihovny) ----------
        function pushChart(diff, heartbeat) {
            const now = Date.now(), last = history[history.length - 1];
            if (last && last.v === diff && (!heartbeat || now - lastChartAt < CHART_HEARTBEAT)) return;
            history.push({ t: now, v: diff });
            if (history.length > CHART_MAX) history.shift();
            lastChartAt = now;
            drawChart();
        }

        function drawChart() {
            const svg = $("chartSvg"), empty = $("chartEmpty");
            if (!history.length) { svg.innerHTML = ""; empty.style.display = "flex"; return; }
            empty.style.display = "none";
            const W = 1026, H = 98, L = 70, R = 12, T = 18, B = 16;
            const vals = history.map((h) => h.v);
            let min = Math.min(...vals), max = Math.max(...vals);
            if (min === max) { const pad = Math.max(1, Math.abs(min) * 0.02); min -= pad; max += pad; }
            const padY = (max - min) * 0.12; min -= padY; max += padY;
            const n = history.length;
            const x = (i) => n === 1 ? L + (W - L - R) / 2 : L + (i / (n - 1)) * (W - L - R);
            const y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
            const lastV = vals[n - 1];
            const col = lastV >= 0 ? "#2DB9E5" : "#FF4F86";

            let pts = history.map((h, i) => [x(i), y(h.v)]);
            if (n === 1) pts = [[L, pts[0][1]], [W - R, pts[0][1]]];
            const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
            const area = `${line} L ${pts[pts.length - 1][0].toFixed(1)} ${H - B} L ${pts[0][0].toFixed(1)} ${H - B} Z`;
            const zero = min < 0 && max > 0 ? `<line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="#2F3036" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.5"/>` : "";
            const grid = [0, 0.5, 1].map((f) => {
                const v = max - f * (max - min), yy = y(v);
                return `<line x1="${L}" x2="${W - R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#000" stroke-opacity="0.07"/>`
                     + `<text x="${L - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end" font-family="Roboto" font-weight="600" font-size="11" fill="#5A5D66">${v < 0 ? "-" : ""}${short(Math.abs(v))}</text>`;
            }).join("");
            const last = pts[pts.length - 1];
            const first = history[0];
            svg.innerHTML = `
                <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity="0.45"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
                <text x="10" y="11" font-family="Fredoka" font-weight="700" font-size="12" fill="#8E9099">DIFFERENCE HISTORY</text>
                ${grid}${zero}
                <path d="${area}" fill="url(#g)"/>
                <path d="${line}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
                <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="#fff" stroke="#2F3036" stroke-width="2.5"/>
                <text x="${L}" y="${H - 2}" font-family="Fredoka" font-weight="600" font-size="11" fill="#8E9099">${n > 1 ? agoLabel(first.t) : ""}</text>
                <text x="${W - R}" y="${H - 2}" text-anchor="end" font-family="Fredoka" font-weight="600" font-size="11" fill="#8E9099">now</text>`;
        }
        setInterval(() => { if (history.length && !document.hidden) drawChart(); }, 5000);

        // ---------- načítání ----------
        function setHint(s, text, err) {
            const h = $("hint" + s.key);
            h.textContent = text;
            h.classList.toggle("err", !!err);
        }

        async function loadSide(s, first) {
            if (!s.tag || s.loading) return;
            s.loading = true;
            const tag = s.tag;
            try {
                const d = await fetchClan(tag);
                if (tag !== s.tag) return;                       // mezitím se změnil klan
                if (!d) { if (first) { s.data = null; setHint(s, `Clan [${tag}] not found!`, true); render(); } return; }
                s.data = d;
                setHint(s, "");
                if (s.lastApi === null) { s.current = s.lastApi = d.points; rendered = false; render(); return; }   // první načtení bez rolování
                if (d.points !== s.lastApi) {
                    s.lastApi = d.points;
                    if (d.points > s.current) startSmoothing(s, d.points);
                    else { stopSmoothing(s); s.current = d.points; render(); }
                } else {
                    renderCard(s); renderStats(s);
                }
            } catch (e) {
                if (first && tag === s.tag) setHint(s, "Error loading clan, retrying...", true);
            } finally {
                s.loading = false;
            }
        }

        async function setTag(s, tag) {
            tag = (tag || "").trim().toUpperCase();
            if (tag === s.tag) return;
            s.tag = tag;
            stopSmoothing(s);
            s.data = null; s.current = 0; s.lastApi = null;
            history = []; lastChartAt = 0; drawChart();
            rendered = false;                                    // nový klan se ukáže hned, bez rolování
            setHint(s, tag ? "Loading..." : "Click the name to type a clan");
            updateUrl();
            render();
            if (!tag) return;
            await loadBattle();
            await loadSide(s, true);
        }

        function updateUrl() {
            const q = new URLSearchParams();
            if (side.a.tag) q.set("a", side.a.tag);
            if (side.b.tag) q.set("b", side.b.tag);
            history_replace(q.toString());
        }
        function history_replace(q) { window.history.replaceState(null, "", location.pathname + (q ? "?" + q : "")); }

        async function poll() {
            if (!document.hidden && (side.a.tag || side.b.tag)) {
                await loadBattle();
                await Promise.all([loadSide(side.a, false), loadSide(side.b, false)]);
                if (side.a.data && side.b.data) pushChart(side.a.current - side.b.current, true);
            }
            setTimeout(poll, POLL_MS);
        }

        [["inputA", side.a], ["inputB", side.b]].forEach(([id, s]) => {
            const el = $(id);
            el.addEventListener("input", () => { el.value = el.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase(); sizeInput(el); });
            el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });
            el.addEventListener("change", () => setTag(s, el.value));
            el.addEventListener("blur", () => setTag(s, el.value));
        });

        // šířka políčka podle textu, aby závorky seděly těsně kolem jména
        const measureCtx = document.createElement("canvas").getContext("2d");
        function sizeInput(el) {
            measureCtx.font = "700 38px Fredoka";
            const w = measureCtx.measureText(el.value || el.placeholder).width;
            el.style.width = Math.ceil(w + 8) + "px";
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sizeInput($("inputA")); sizeInput($("inputB")); });

        window.addEventListener("DOMContentLoaded", () => {
            autoFitScreen();
            odo.A = new Odometer($("pointsA"));
            odo.B = new Odometer($("pointsB"));
            odo.D = new Odometer($("diffValue"));
            render();
            drawChart();
            const p = new URLSearchParams(location.search);
            const a = (p.get("a") || "").toUpperCase().slice(0, 4), b = (p.get("b") || "").toUpperCase().slice(0, 4);
            $("inputA").value = a; $("inputB").value = b;
            sizeInput($("inputA")); sizeInput($("inputB"));
            Promise.all([setTag(side.a, a), setTag(side.b, b)]).then(() => setTimeout(poll, POLL_MS));
        });
    </script>
