<html lang="en">
<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif !important;
            font-weight: 600;
            user-select: none;
        }

        body {
            background-color: #89b3f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overscroll-behavior: none !important;
            touch-action: none;
        }

        .app-scaler {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
        }

        .game-window {
            position: relative;
            display: inline-block;
            overflow: visible;
        }

        .menu-bg {
            display: block;
            width: auto;
            height: auto;
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.35));
        }

        .clans-logo {
            position: absolute;
            left: -36px;
            top: -69px;
            width: 315px;
            height: 117px;
            background: url("/images/clans-logo.png") no-repeat center center;
            background-size: 100% 100%;
            z-index: 998;
        }

        .close-btn {
            position: absolute;
            left: 1044px;
            top: -30px;
            width: 72px;
            height: 73px;
            background: url("/images/X.png") no-repeat center center;
            background-size: 100% 100%;
            cursor: pointer;
            z-index: 999;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.35));
            transition: all 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .close-btn:hover:not(:active) { left: 1042px; top: -34px; width: 76px; height: 77px; }
        .close-btn:active { background-image: url("/images/X-clicked.png"); left: 1047px; top: -29px; width: 66px; height: 67px; }

        /* ---------- společné textové styly ---------- */
        .stroke {
            color: #FEFEFE;
            -webkit-text-stroke: 6px #000000;
            stroke-linejoin: round;
            -webkit-stroke-linejoin: round;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
        }
        .grad {
            position: relative;
            color: #000000;
            -webkit-text-stroke: 6px #000000;
            stroke-linejoin: round;
            -webkit-stroke-linejoin: round;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
        }
        .grad::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            -webkit-text-stroke: 0px transparent;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .grad-a::after  { background-image: linear-gradient(to bottom, #7CF6FA, #60E0FE); }
        .grad-b::after  { background-image: linear-gradient(to bottom, #FFA3C1, #FF4F86); }
        .grad-vs::after { background-image: linear-gradient(to bottom, #FFE873, #FFB21E); }

        /* ================= LEVÝ PANEL – zadání klanů ================= */
        .left-panel {
            position: absolute;
            left: 8px;
            top: 8px;
            width: 322px;
            height: 554px;
            z-index: 900;
        }

        .side-label {
            position: absolute;
            left: 22px;
            font-size: 17px;
            letter-spacing: 0.5px;
            z-index: 2;
        }
        .side-label.a { color: #33C5EC; }
        .side-label.b { color: #FF4F86; }
        .side-label .stroke { font-size: 17px; -webkit-text-stroke: 4px #000; }

        .clan-input-wrap {
            position: absolute;
            left: 14px;
            width: 294px;
            height: 50px;
            background: url("/images/topclans-leaderboard-search.png") no-repeat center center;
            background-size: 100% 100%;
            z-index: 3;
        }
        .clan-input-wrap::before {
            content: "";
            position: absolute;
            left: 13px;
            top: 50%;
            width: 18px;
            height: 18px;
            margin-top: -9px;
            border-radius: 50%;
            border: 3px solid #000;
        }
        .clan-input-wrap.a::before { background: #60E0FE; }
        .clan-input-wrap.b::before { background: #FF4F86; }

        .clan-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 0 18px 0 42px;
            color: #000000;
            font-size: 28px;
            font-weight: 800 !important;
            text-align: center;
            text-transform: uppercase;
            user-select: text;
        }
        .clan-input::placeholder { color: #B1B1B1; font-weight: 600; text-transform: none; }

        .clan-preview {
            position: absolute;
            left: 14px;
            width: 294px;
            height: 74px;
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
            z-index: 3;
            overflow: hidden;
        }
        .clan-preview.empty { justify-content: center; color: #B1B1B1; font-size: 17px; }
        .clan-preview.error { justify-content: center; color: #FF5555; font-size: 19px; font-weight: 800 !important; }
        .clan-preview .pv-icon {
            width: 54px;
            height: 54px;
            border-radius: 10px;
            border: 2.5px solid #000;
            background: #FFF;
            object-fit: contain;
            flex: 0 0 auto;
        }
        .clan-preview .pv-text { display: flex; flex-direction: column; min-width: 0; }
        .clan-preview .pv-name { font-size: 26px; line-height: 1.05; }
        .clan-preview .pv-sub {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            color: #696A6E;
            font-weight: 700 !important;
            white-space: nowrap;
        }
        .clan-preview .pv-sub img { width: 22px; height: 16px; border-radius: 3px; object-fit: cover; }
        .clan-preview { cursor: pointer; transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .clan-preview.empty, .clan-preview.error { cursor: default; }
        .clan-preview.filled:hover:not(:active) { transform: scale(1.02); }
        .clan-preview.filled:active { transform: scale(0.97); }

        .vs-badge {
            position: absolute;
            left: 0;
            width: 322px;
            text-align: center;
            font-size: 46px;
            line-height: 1;
            z-index: 3;
        }

        .battle-card {
            position: absolute;
            left: 14px;
            top: 452px;
            width: 294px;
            height: 92px;
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 3;
        }
        .battle-card .bc-title { font-size: 14px; color: #9E9E9E; font-weight: 700 !important; letter-spacing: 0.5px; }
        .battle-card .bc-name  { font-size: 22px; line-height: 1.1; -webkit-text-stroke: 5px #000; }
        .battle-card .bc-timer { font-size: 18px; color: #FF2B2B; font-weight: 800 !important; }

        /* ================= PRAVÝ PANEL – souboj dvou klanů ================= */
        .compare-area {
            position: absolute;
            left: 350px;
            top: 8px;
            width: 742px;
            height: 554px;
            z-index: 900;
            perspective: 1400px;
        }

        .compare-empty {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
        }
        .compare-empty .ce-icon { width: 150px; height: auto; }
        .compare-empty .ce-title { font-size: 44px; }
        .compare-empty .ce-sub { font-size: 22px; color: #9E9E9E; font-weight: 700 !important; }

        .compare-content { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; }

        /* --- karta klanu --- */
        .clan-card {
            position: absolute;
            top: 14px;
            width: 352px;
            height: 352px;
            background: #FFFFFF;
            border: 4px solid #000000;
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 22px;
            cursor: pointer;
            transition: left 0.6s cubic-bezier(0.2, 0.9, 0.2, 1), transform 0.2s ease-out;
        }
        .clan-card.pos-left  { left: 8px; }
        .clan-card.pos-right { left: 382px; }

        .refresh-bar {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 7px;
            background: rgba(0, 0, 0, 0.06);
        }
        .refresh-fill { display: block; width: 0%; height: 100%; }
        .clan-card.a .refresh-fill { background: #48D2F7; }
        .clan-card.b .refresh-fill { background: #FF4F86; }

        .card-icon {
            width: 108px;
            height: 108px;
            border-radius: 16px;
            border: 4px solid #000;
            background: #FFFFFF;
            object-fit: contain;
        }
        .clan-card.a .card-icon { box-shadow: 0 0 0 4px #60E0FE; }
        .clan-card.b .card-icon { box-shadow: 0 0 0 4px #FF4F86; }

        .card-rank-row { display: flex; align-items: center; gap: 6px; margin-top: 14px; height: 30px; }
        .card-flag { width: 29px; height: 22px; border-radius: 3px; object-fit: cover; }
        .rank-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 1px 12px;
            border-radius: 14px;
            border: 3px solid #000;
            background: #FFFFFF;
            font-size: 19px;
            font-weight: 800 !important;
            color: #262C2D;
            white-space: nowrap;
            transition: transform 0.3s ease-out;
        }
        .rank-pill.gold   { background: linear-gradient(#FFE873, #FFB21E); }
        .rank-pill.silver { background: linear-gradient(#F4F6FA, #BFC6D4); }
        .rank-pill.bronze { background: linear-gradient(#FFC48A, #E4893A); }
        .rank-arrow { font-size: 13px; display: none; }
        .rank-pill.up   { animation: rank-pop 1.4s ease-out 1; }
        .rank-pill.down { animation: rank-pop 1.4s ease-out 1; }
        .rank-pill.up .rank-arrow   { display: inline; color: #1DB81D; }
        .rank-pill.down .rank-arrow { display: inline; color: #FF2B2B; }
        @keyframes rank-pop {
            0% { transform: scale(1); }
            15% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        .card-name { font-size: 46px; line-height: 1.1; margin-top: 6px; }

        .points-section { position: relative; margin-top: auto; margin-bottom: 26px; display: flex; flex-direction: column; align-items: center; }
        .points-label { font-size: 15px; color: #9E9E9E; font-weight: 700 !important; letter-spacing: 0.6px; margin-top: 2px; }
        .card-points { font-size: 36px; }

        /* vyskakující +body */
        .gain-pop {
            position: absolute;
            left: 50%;
            top: -8px;
            padding: 2px 13px;
            border-radius: 40px;
            border: 3px solid #000;
            font-size: 20px;
            font-weight: 800 !important;
            color: #FEFEFE;
            -webkit-text-stroke: 4px #000;
            paint-order: stroke fill;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            z-index: 5;
        }
        .gain-pop.plus  { background: #6BF06B; }
        .gain-pop.minus { background: #FF5C5C; }
        .gain-pop.go { animation: gain-up 3s ease-out forwards; }
        @keyframes gain-up {
            0%   { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            10%  { opacity: 1; transform: translate(-50%, -12px) scale(1.05); }
            20%  { transform: translate(-50%, -18px) scale(1); }
            85%  { opacity: 1; transform: translate(-50%, -60px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -76px) scale(0.6); }
        }

        /* částice letící do bodů */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #000;
            z-index: 4;
            pointer-events: none;
        }
        .clan-card.a .particle { background: #60E0FE; }
        .clan-card.b .particle { background: #FF4F86; }

        /* --- rozdíl bodů --- */
        .diff-box {
            position: absolute;
            left: 50%;
            top: 384px;
            width: 470px;
            height: 150px;
            margin-left: -235px;
            background: #FFFFFF;
            border: 5px solid #000;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(-3deg);
            transition: transform 0.2s ease-out, box-shadow 0.4s;
            z-index: 3;
        }
        .diff-box.lead-a { box-shadow: 0 0 0 5px #60E0FE, 0 8px 18px rgba(0,0,0,0.25); }
        .diff-box.lead-b { box-shadow: 0 0 0 5px #FF4F86, 0 8px 18px rgba(0,0,0,0.25); }
        .diff-label { font-size: 15px; color: #9E9E9E; font-weight: 700 !important; letter-spacing: 0.6px; }
        .diff-value { font-size: 52px; line-height: 1.15; }
        .diff-lead { font-size: 22px; -webkit-text-stroke: 5px #000; }

        /* --- vlastní odometer (rolující číslice) --- */
        .odo { display: inline-flex; align-items: flex-start; line-height: 1.2; height: 1.2em; }
        .odo-col {
            position: relative;
            display: inline-block;
            width: 0.6em;
            height: 1.2em;
            overflow: hidden;
            clip-path: inset(0 -0.1em);
            text-align: center;
            /* místo pro obrys písma, aby se neořízl */
            padding: 0 0.04em;
            box-sizing: content-box;
        }
        .odo-sep { display: inline-block; width: 0.28em; text-align: center; }
        .odo-ribbon { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
        .odo-ribbon span { display: block; height: 1.2em; }
        .odo-flash-up   { color: #7CFF5B !important; }
        .odo-flash-down { color: #FF5C5C !important; }
        .odo-fade { transition: color 2s ease-out; }


        /* ---------- tlačítka FEEDBACK / Privacy (stejná jako jinde) ---------- */
        .ps99-feedback-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 13px;
            background: #FFFFFF;
            border: 2.5px solid #000000;
            border-radius: 9px;
            color: #000000;
            font-size: 13.5px;
            font-weight: 600 !important;
            font-family: 'Fredoka', sans-serif !important;
            text-decoration: none;
            box-shadow: 0 3px 0 #000000, 0 5px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1),
                        box-shadow 0.044s cubic-bezier(0.1, 0.9, 0.2, 1),
                        background-color 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
            user-select: none;
        }
        .ps99-feedback-btn:hover:not(:active) {
            background-color: #F0F4FF;
            transform: translateY(-1.5px) scale(1.02);
            box-shadow: 0 4.5px 0 #000000, 0 7px 12px rgba(0, 0, 0, 0.25);
        }
        .ps99-feedback-btn:active {
            transform: translateY(2px) scale(0.96);
            box-shadow: 0 1px 0 #000000, 0 2px 4px rgba(0, 0, 0, 0.2);
            background-color: #E2E8F0;
        }

        .privacy-link {
            position: fixed;
            bottom: 14px;
            right: 14px;
            z-index: 99999;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 700 !important;
            text-decoration: underline;
            -webkit-text-stroke: 2.5px #000000;
            paint-order: stroke fill;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }
        .privacy-link:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="app-scaler" id="appScaler">
        <div class="game-window">
            <img class="menu-bg" src="/images/main-menu.png" draggable="false">

            <div class="clans-logo"></div>

            <!-- LEVÝ PANEL: zadání dvou klanů -->
            <div class="left-panel">
                <div class="side-label a" style="top: 50px;"><span class="stroke">CLAN 1</span></div>
                <div class="clan-input-wrap a" style="top: 76px;">
                    <input type="text" class="clan-input" id="inputA" placeholder="Clan tag" maxlength="4" autocomplete="off" spellcheck="false">
                </div>
                <div class="clan-preview empty" id="previewA" style="top: 134px;">Type a clan &amp; press Enter</div>

                <div class="vs-badge" style="top: 216px;"><span class="grad grad-vs" data-text="VS">VS</span></div>

                <div class="side-label b" style="top: 268px;"><span class="stroke">CLAN 2</span></div>
                <div class="clan-input-wrap b" style="top: 294px;">
                    <input type="text" class="clan-input" id="inputB" placeholder="Clan tag" maxlength="4" autocomplete="off" spellcheck="false">
                </div>
                <div class="clan-preview empty" id="previewB" style="top: 352px;">Type a clan &amp; press Enter</div>

                <div class="battle-card" id="battleCard">
                    <div class="bc-title">ACTIVE CLAN BATTLE</div>
                    <div class="bc-name stroke" id="battleName">Loading...</div>
                    <div class="bc-timer" id="battleTimer"></div>
                </div>
            </div>

            <!-- PRAVÝ PANEL: souboj dvou klanů -->
            <div class="compare-area" id="compareArea">
                <div class="compare-empty" id="compareEmpty">
                    <img class="ce-icon" src="/images/hotbar/arrows.png" draggable="false" alt="">
                    <div class="ce-title"><span class="grad grad-a" data-text="Clan Compare">Clan Compare</span></div>
                    <div class="ce-sub" id="emptySub">Enter two clans on the left to compare them!</div>
                </div>

                <div class="compare-content" id="compareContent">
                    <div class="clan-card a pos-left" id="cardA">
                        <div class="refresh-bar"><span class="refresh-fill"></span></div>
                        <img class="card-icon" id="iconA" src="" alt="">
                        <div class="card-rank-row">
                            <img class="card-flag" id="flagA" src="" alt="">
                            <span class="rank-pill" id="rankA"><span class="rank-txt">#?</span><span class="rank-arrow"></span></span>
                        </div>
                        <div class="card-name grad grad-a" id="nameA" data-text=""></div>
                        <div class="points-section">
                            <div class="gain-pop" id="popA"></div>
                            <div class="card-points stroke" id="pointsA"></div>
                            <div class="points-label">BATTLE POINTS</div>
                        </div>
                    </div>

                    <div class="clan-card b pos-right" id="cardB">
                        <div class="refresh-bar"><span class="refresh-fill"></span></div>
                        <img class="card-icon" id="iconB" src="" alt="">
                        <div class="card-rank-row">
                            <img class="card-flag" id="flagB" src="" alt="">
                            <span class="rank-pill" id="rankB"><span class="rank-txt">#?</span><span class="rank-arrow"></span></span>
                        </div>
                        <div class="card-name grad grad-b" id="nameB" data-text=""></div>
                        <div class="points-section">
                            <div class="gain-pop" id="popB"></div>
                            <div class="card-points stroke" id="pointsB"></div>
                            <div class="points-label">BATTLE POINTS</div>
                        </div>
                    </div>

                    <div class="diff-box" id="diffBox">
                        <div class="diff-label">POINT DIFFERENCE</div>
                        <div class="diff-value stroke" id="diffValue"></div>
                        <div class="diff-lead stroke" id="diffLead"></div>
                    </div>
                </div>
            </div>

            <div class="close-btn" onclick="location.href='/'"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const UPDATE_MS = 10000;        // jak často se stahují body
        const ODO_CLAN_MS = 6000;       // délka rolování bodů klanu
        const ODO_DIFF_MS = 4000;       // délka rolování rozdílu
        const DIFF_DELAY_MS = 1500;     // rozdíl se pohne až chvíli po bodech
        const $ = (id) => document.getElementById(id);

        function autoFitScreen() {
            const scaler = $("appScaler");
            if (!scaler) return;
            const winW = window.innerWidth, winH = window.innerHeight;
            if (winW >= 1150) { document.body.classList.remove("is-mobile"); scaler.style.transform = "none"; return; }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 960) * 0.92})`;
        }
        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);

        // ---------- pomocné ----------
        const fmtFull = (n) => Math.round(n).toLocaleString("en-US");
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        function getTwemojiUrl(cc) {
            if (!cc || cc.length !== 2) return "";
            const cp = cc.toUpperCase().split("").map((ch) => 0x1F1E6 + ch.charCodeAt(0) - 65);
            return `https://twemoji.maxcdn.com/v/14.0.2/svg/${cp[0].toString(16)}-${cp[1].toString(16)}.svg`;
        }
        function getClanIconUrl(icon) {
            const id = (icon || "").replace("rbxassetid://", "").trim();
            return id ? `https://ps99.biggamesapi.io/image/${id}` : "https://placehold.co/175x175/ffffff/000000?text=Clan";
        }
        const prettyBattle = (n) => (n || "").replace(/([a-z])([A-Z0-9])/g, "$1 $2").replace(/([0-9])([A-Z])/g, "$1 $2").trim();
        function setGrad(el, t) { el.textContent = t; el.setAttribute("data-text", t); }

        // ---------- ODOMETER: každá číslice je "páska", která se odroluje na nové číslo ----------
        class Odometer {
            constructor(el, ms) { this.el = el; this.ms = ms; this.value = null; this.token = 0; el.classList.add("odo"); }

            set(v, animate = true) {
                v = Math.max(0, Math.round(v || 0));
                const old = this.value;
                this.value = v;
                const token = ++this.token;
                if (old === null || !animate || old === v) { this.renderStatic(v); return; }
                this.renderRolling(old, v);
                setTimeout(() => { if (token === this.token) this.renderStatic(v); }, this.ms + 80);
            }

            build(cols) {
                // cols = pole sloupců zprava doleva; vloží čárky po třech číslicích
                const parts = [];
                cols.forEach((c, i) => {
                    if (i > 0 && i % 3 === 0) parts.push(`<span class="odo-sep">,</span>`);
                    parts.push(c);
                });
                this.el.innerHTML = parts.reverse().join("");
            }

            renderStatic(v) {
                const s = String(v);
                const cols = [];
                for (let i = s.length - 1; i >= 0; i--) cols.push(`<span class="odo-col"><span class="odo-ribbon"><span>${s[i]}</span></span></span>`);
                this.build(cols);
            }

            renderRolling(old, v) {
                const len = Math.max(String(v).length, 1);
                const up = v > old;
                const cols = [], moves = [];
                for (let i = 0; i < len; i++) {
                    const p = 10 ** i;
                    const t0 = Math.floor(old / p), t1 = Math.floor(v / p);
                    if (t0 === t1) { cols.push(`<span class="odo-col"><span class="odo-ribbon"><span>${t1 % 10}</span></span></span>`); continue; }
                    // posloupnost "otáček" od starého k novému číslu (u velkých skoků jen začátek a konec)
                    const steps = Math.abs(t1 - t0);
                    let seq = [];
                    if (steps <= 24) for (let k = 0; k <= steps; k++) seq.push(up ? t0 + k : t0 - k);
                    else {
                        for (let k = 0; k < 8; k++) seq.push(up ? t0 + k : t0 - k);
                        for (let k = 15; k >= 0; k--) seq.push(up ? t1 - k : t1 + k);
                    }
                    const digits = seq.map((t) => ((t % 10) + 10) % 10);
                    if (!up) digits.reverse();                     // dolů se roluje opačně
                    const n = digits.length - 1;
                    cols.push(`<span class="odo-col"><span class="odo-ribbon" data-n="${n}" data-up="${up ? 1 : 0}" style="transform: translateY(${up ? 0 : -n * 1.2}em)">${digits.map((d) => `<span>${d}</span>`).join("")}</span></span>`);
                    moves.push(i);
                }
                this.build(cols);
                const ribbons = this.el.querySelectorAll(".odo-ribbon[data-n]");
                void this.el.offsetWidth;                          // start z výchozí pozice
                ribbons.forEach((r) => {
                    const n = +r.dataset.n, isUp = r.dataset.up === "1";
                    r.style.transition = `transform ${this.ms}ms cubic-bezier(0.1, 0.7, 0.1, 1)`;
                    r.style.transform = `translateY(${isUp ? -n * 1.2 : 0}em)`;
                });
            }
        }

        function flash(el, up) {
            el.classList.remove("odo-fade", "odo-flash-up", "odo-flash-down");
            el.classList.add(up ? "odo-flash-up" : "odo-flash-down");
            setTimeout(() => { el.classList.add("odo-fade"); el.classList.remove("odo-flash-up", "odo-flash-down"); }, 60);
        }

        // ---------- data ----------
        let battle = null;
        const odo = {};

        async function loadBattle() {
            try {
                const r = await fetch(`${WORKER_URL}/activeClanBattle`);
                const j = await r.json();
                if (j && j.status === "ok" && j.data) battle = j.data;
            } catch (e) {}
            renderBattleCard();
        }
        function renderBattleCard() {
            const nameEl = $("battleName"), timerEl = $("battleTimer");
            if (!battle || !battle.configName) { nameEl.textContent = "No active battle"; timerEl.textContent = ""; return; }
            nameEl.textContent = prettyBattle(battle.configName);
            const left = (battle.FinishTime || 0) - Date.now() / 1000;
            if (left <= 0) { timerEl.textContent = "Ended"; return; }
            const d = Math.floor(left / 86400), h = Math.floor((left % 86400) / 3600), m = Math.floor((left % 3600) / 60), s = Math.floor(left % 60);
            const p = (n) => String(n).padStart(2, "0");
            timerEl.textContent = `Ends in ${d > 0 ? p(d) + "d:" : ""}${p(h)}h:${p(m)}m:${p(s)}s`;
        }
        setInterval(renderBattleCard, 1000);

        async function fetchClan(tag) {
            const r = await fetch(`${WORKER_URL}/clan/${encodeURIComponent(tag)}`);
            const j = await r.json();
            if (!j || j.status !== "ok" || !j.data) return null;
            const c = j.data;
            const battles = c.Battles || {};
            const list = Array.isArray(battles) ? battles : Object.values(battles);
            let active = null;
            if (battle && battle.configName) {
                active = (!Array.isArray(battles) && battles[battle.configName]) || list.find((b) => b.BattleID === battle.configName) || null;
            }
            const members = (c.Members || []).length + ((c.Members || []).some((m) => m.UserID === c.Owner) ? 0 : 1);
            return {
                name: c.Name,
                icon: getClanIconUrl(c.Icon),
                flag: getTwemojiUrl(c.CountryCode),
                members,
                capacity: c.MemberCapacity || 75,
                points: active ? (active.Points || 0) : 0,
                place: active && active.Place ? active.Place : null
            };
        }

        // ---------- levý panel ----------
        function renderPreview(side, data, status) {
            const el = $(side === "a" ? "previewA" : "previewB");
            el.className = "clan-preview";
            el.onclick = null;
            if (status === "empty") { el.classList.add("empty"); el.textContent = "Type a clan & press Enter"; return; }
            if (status === "loading") { el.classList.add("empty"); el.textContent = "Loading..."; return; }
            if (status === "error") { el.classList.add("error"); el.textContent = data; return; }
            el.classList.add("filled");
            el.innerHTML = `
                <img class="pv-icon" src="${esc(data.icon)}" onerror="this.src='https://placehold.co/175x175/ffffff/000000?text=Clan'" alt="">
                <div class="pv-text">
                    <div class="pv-name stroke">[${esc(data.name)}]</div>
                    <div class="pv-sub">${data.flag ? `<img src="${esc(data.flag)}" onerror="this.style.display='none'" alt="">` : ""}
                        <span>${data.members}/${data.capacity} members</span></div>
                </div>`;
            el.onclick = () => { location.href = `/clan-detail/?name=${encodeURIComponent(data.name)}`; };
        }

        function showEmpty(text) {
            $("compareContent").style.display = "none";
            $("compareEmpty").style.display = "flex";
            $("emptySub").textContent = text;
        }

        // ---------- efekty ----------
        function popGain(side, delta) {
            const el = $("pop" + side);
            el.classList.remove("go", "plus", "minus");
            void el.offsetWidth;
            el.textContent = (delta > 0 ? "+" : "-") + fmtFull(Math.abs(delta));
            el.classList.add(delta > 0 ? "plus" : "minus", "go");
        }

        function spawnParticles(side, delta) {
            const card = $("card" + side), target = $("points" + side);
            if (!card || delta <= 0) return;
            const tx = target.offsetLeft + target.parentElement.offsetLeft, ty = target.parentElement.offsetTop + target.offsetTop;
            const tw = target.offsetWidth, th = target.offsetHeight;
            const n = Math.min(18, 5 + Math.ceil(Math.log10(delta + 1) * 1.2));
            for (let i = 0; i < n; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                const sx = 20 + Math.random() * (card.clientWidth - 40);
                const sy = 150 + Math.random() * 80;
                p.style.left = sx + "px";
                p.style.top = sy + "px";
                card.appendChild(p);
                const ex = tx + Math.random() * tw, ey = ty + th * (0.3 + Math.random() * 0.4);
                const dur = 0.9 + Math.random() * 0.5, delay = Math.random() * 0.5;
                setTimeout(() => {
                    p.style.transition = `transform ${dur}s cubic-bezier(0.5, 0, 0.6, 1), opacity 0.25s ease-in ${dur - 0.25}s`;
                    p.style.transform = `translate(${ex - sx}px, ${ey - sy}px) scale(0.4)`;
                    p.style.opacity = "0";
                }, delay * 1000);
                setTimeout(() => p.remove(), (dur + delay) * 1000 + 120);
            }
        }

        function startRefreshBars() {
            document.querySelectorAll(".refresh-fill").forEach((f) => {
                f.style.transition = "none";
                f.style.width = "0%";
                void f.offsetWidth;
                f.style.transition = `width ${UPDATE_MS}ms linear`;
                f.style.width = "100%";
            });
        }

        function setRank(side, place, prevPlace) {
            const pill = $("rank" + side);
            pill.querySelector(".rank-txt").textContent = place ? `#${place}` : "#?";
            pill.className = "rank-pill " + (place === 1 ? "gold" : place === 2 ? "silver" : place === 3 ? "bronze" : "");
            if (prevPlace && place && place !== prevPlace) {
                void pill.offsetWidth;
                pill.classList.add(place < prevPlace ? "up" : "down");
                pill.querySelector(".rank-arrow").textContent = place < prevPlace ? "▲" : "▼";
            }
        }

        // 3D náklon karet při pohybu myši (jen na počítači)
        function setupTilt() {
            const items = [$("cardA"), $("cardB"), $("diffBox")];
            items.forEach((el) => {
                const base = el.id === "diffBox" ? "rotate(-3deg)" : "";
                el.addEventListener("mousemove", (e) => {
                    if (document.body.classList.contains("is-mobile")) return;
                    const r = el.getBoundingClientRect();
                    const rx = ((e.clientY - r.top) / r.height - 0.5) * -6;
                    const ry = ((e.clientX - r.left) / r.width - 0.5) * 6;
                    el.style.transform = `${base} rotateX(${rx}deg) rotateY(${ry}deg) scale(${el.id === "diffBox" ? 1.03 : 1.01})`;
                });
                el.addEventListener("mouseleave", () => { el.style.transform = base; });
            });
        }

        // ---------- hlavní smyčka ----------
        let tags = { a: "", b: "" };
        let prev = null;                 // { a: {points, place}, b: {...}, diff }
        let timer = null, loadToken = 0;

        async function update(first) {
            const token = loadToken;
            const [A, B] = await Promise.all([
                fetchClan(tags.a).catch(() => undefined),
                fetchClan(tags.b).catch(() => undefined)
            ]);
            if (token !== loadToken) return;
            startRefreshBars();

            if (first) {
                if (A) renderPreview("a", A); else renderPreview("a", A === null ? `[${tags.a}] not found!` : "Error loading clan!", "error");
                if (B) renderPreview("b", B); else renderPreview("b", B === null ? `[${tags.b}] not found!` : "Error loading clan!", "error");
                if (!A || !B) { showEmpty("One of the clans could not be loaded."); stop(); return; }
                $("compareEmpty").style.display = "none";
                $("compareContent").style.display = "block";
                for (const [s, d] of [["A", A], ["B", B]]) {
                    $("icon" + s).src = d.icon;
                    $("icon" + s).onerror = function () { this.src = "https://placehold.co/175x175/ffffff/000000?text=Clan"; };
                    const f = $("flag" + s);
                    if (d.flag) { f.src = d.flag; f.style.display = ""; } else f.style.display = "none";
                    f.onerror = function () { this.style.display = "none"; };
                    setGrad($("name" + s), `[${d.name}]`);
                    $("card" + s).onclick = () => { location.href = `/clan-detail/?name=${encodeURIComponent(d.name)}`; };
                }
            }
            if (!A || !B) return;      // dočasná chyba při obnovení – zkusí se znovu

            const diff = A.points - B.points;
            const animate = !!prev;

            // body klanů
            for (const [s, d, k] of [["A", A, "a"], ["B", B, "b"]]) {
                const before = prev ? prev[k].points : null;
                odo[s].set(d.points, animate);
                if (animate && before !== d.points) {
                    flash($("points" + s), d.points > before);
                    popGain(s, d.points - before);
                    spawnParticles(s, d.points - before);
                }
                setRank(s, d.place, prev ? prev[k].place : null);
            }

            // kdo vede, je vlevo
            const aLeads = A.points >= B.points;
            $("cardA").className = "clan-card a " + (aLeads ? "pos-left" : "pos-right");
            $("cardB").className = "clan-card b " + (aLeads ? "pos-right" : "pos-left");

            // rozdíl (pohne se až po chvíli)
            const applyDiff = () => {
                const box = $("diffBox");
                box.className = "diff-box " + (diff === 0 ? "" : diff > 0 ? "lead-a" : "lead-b");
                const leadEl = $("diffLead");
                if (diff === 0) { leadEl.textContent = A.points ? "It's a tie!" : "No battle points yet"; leadEl.style.color = "#FFD34A"; }
                else { leadEl.textContent = `[${diff > 0 ? A.name : B.name}] leads`; leadEl.style.color = diff > 0 ? "#60E0FE" : "#FF4F86"; }
                const before = prev ? Math.abs(prev.diff) : null;
                odo.D.set(Math.abs(diff), animate);
                if (animate && before !== Math.abs(diff)) flash($("diffValue"), Math.abs(diff) > before);
            };
            if (animate && prev.diff !== diff) setTimeout(() => { if (token === loadToken) applyDiff(); }, DIFF_DELAY_MS);
            else applyDiff();

            prev = { a: { points: A.points, place: A.place }, b: { points: B.points, place: B.place }, diff };
        }

        function stop() { if (timer) clearInterval(timer); timer = null; }

        async function start() {
            const a = $("inputA").value.trim().toUpperCase(), b = $("inputB").value.trim().toUpperCase();
            updateUrl(a, b);
            stop();
            loadToken++;
            prev = null;
            if (!a || !b) {
                if (a) loadPreviewOnly("a", a); else renderPreview("a", null, "empty");
                if (b) loadPreviewOnly("b", b); else renderPreview("b", null, "empty");
                showEmpty("Enter two clans on the left to compare them!");
                return;
            }
            tags = { a, b };
            renderPreview("a", null, "loading");
            renderPreview("b", null, "loading");
            showEmpty("Loading clans...");
            if (!battle) await loadBattle();
            await update(true);
            if (prev) timer = setInterval(() => update(false), UPDATE_MS);
        }

        async function loadPreviewOnly(side, tag) {
            renderPreview(side, null, "loading");
            try {
                const d = await fetchClan(tag);
                if (d) renderPreview(side, d); else renderPreview(side, `[${tag}] not found!`, "error");
            } catch (e) { renderPreview(side, "Error loading clan!", "error"); }
        }

        function updateUrl(a, b) {
            const p = new URLSearchParams();
            if (a) p.set("a", a);
            if (b) p.set("b", b);
            const q = p.toString();
            history.replaceState(null, "", location.pathname + (q ? "?" + q : ""));
        }

        let lastStarted = "";
        function maybeStart() {
            const key = $("inputA").value.trim().toUpperCase() + "|" + $("inputB").value.trim().toUpperCase();
            if (key === lastStarted) return;
            lastStarted = key;
            start();
        }
        ["inputA", "inputB"].forEach((id) => {
            const el = $(id);
            el.addEventListener("input", () => { el.value = el.value.replace(/\s+/g, ""); });
            el.addEventListener("keydown", (e) => {
                if (e.key !== "Enter") return;
                e.preventDefault();
                if (id === "inputA" && !$("inputB").value.trim()) { $("inputB").focus(); maybeStart(); return; }
                el.blur();
                maybeStart();
            });
            el.addEventListener("change", maybeStart);
        });

        window.addEventListener("DOMContentLoaded", () => {
            autoFitScreen();
            odo.A = new Odometer($("pointsA"), ODO_CLAN_MS);
            odo.B = new Odometer($("pointsB"), ODO_CLAN_MS);
            odo.D = new Odometer($("diffValue"), ODO_DIFF_MS);
            setupTilt();
            const p = new URLSearchParams(location.search);
            $("inputA").value = (p.get("a") || "").toUpperCase().slice(0, 4);
            $("inputB").value = (p.get("b") || "").toUpperCase().slice(0, 4);
            loadBattle().then(() => { if ($("inputA").value || $("inputB").value) maybeStart(); });
        });
    </script>
