    <script>
        const WORKER_URL = "https://rough-pine-d90f.dan13el.workers.dev";
        const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==";
        const $ = id => document.getElementById(id);

        // ---------- pomocné funkce ----------
        function fullNumber(n) { return Number(n || 0).toLocaleString("en-US"); }

        // Číslo zkrácené na 2 desetinná místa (909.73k, 21.83m), pro osu Y bez zbytečných nul
        function short2(v, trim) {
            const f = (x, s) => { let t = x.toFixed(2); if (trim) t = t.replace(/\.?0+$/, ""); return t + s; };
            if (v >= 1e9) return f(v / 1e9, "b");
            if (v >= 1e6) return f(v / 1e6, "m");
            if (v >= 1e3) return f(v / 1e3, "k");
            return String(Math.round(v));
        }

        function showCenter(text, isError) {
            $("pdContent").classList.remove("is-visible");
            const el = $("centerMsg");
            el.textContent = text;
            el.classList.toggle("is-error", !!isError);
            el.style.display = "block";
        }

        // Zmenšuje písmo, dokud se text nevejde do dané šířky (bez zkracování na "...")
        function fitWidth(el, maxPx, startPx, minPx, strokeRatio) {
            let size = startPx;
            const apply = () => {
                el.style.fontSize = size + "px";
                if (strokeRatio) el.style.webkitTextStroke = Math.max(3, Math.round(size * strokeRatio)) + "px #000000";
            };
            apply();
            while (el.offsetWidth > maxPx && size > minPx) { size -= 1; apply(); }
        }
        function fitInside(el, startPx, minPx) {
            let size = startPx;
            el.style.fontSize = size + "px";
            while (el.scrollWidth > el.clientWidth && size > minPx) { size -= 1; el.style.fontSize = size + "px"; }
        }

        let currentName = "";
        // Adresa stránky nese jméno hráče (/people-detail/?id=Jmeno). Staré odkazy s číselným ID fungují dál.
        function setUrlName(name) {
            if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) return;
            const q = new URLSearchParams(location.search);
            q.set("id", name);                                   // ostatní parametry (tab=history) zůstávají
            const want = "?" + q.toString();
            if (location.search !== want && history.replaceState) {
                history.replaceState(null, "", location.pathname + want);
            }
        }

        function setName(name) {
            currentName = name;
            setUrlName(name);
            const el = $("pdName");
            el.textContent = name;
            el.setAttribute("data-text", name);
            document.title = `${name} - PS99 Clans`;
            fitWidth(el, 262, 40, 20, 0.15);
        }

        // Avatary přes sdílený avatars.js: cache, opakování a záloha přes roproxy/Roblox, když worker selže
        async function fetchAvatars(ids, size) {
            try {
                const res = await Avatars.load(ids, { size, circular: false });
                const map = {};
                Object.keys(res).forEach(id => { if (res[id]) map[Number(id)] = res[id]; });
                return map;
            } catch (e) {
                console.warn("Avatary se nepodařilo načíst:", e.message);
                return {};
            }
        }

        async function loadMissingName(userId) {
            try {
                const res = await fetch(`${WORKER_URL}/roblox/users`, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userIds: [userId] }),
                });
                const json = await res.json();
                const u = (json.data || []).find(x => x && Number(x.id) === userId && x.name);
                if (u) setName(u.name);
            } catch (e) { console.warn("Jméno se nepodařilo načíst:", e.message); }
        }

        // ---------- sousedé v žebříčku + postup ----------
        function fillNeighbor(prefix, n, label) {
            const box = $(prefix);
            if (!n) { box.classList.add("is-empty"); box.onclick = null; return; }
            box.classList.remove("is-empty");
            const name = n.username || `User ${n.userId}`;
            const nameEl = $(prefix + "Name");
            nameEl.textContent = name;
            fitInside(nameEl, 12, 8);
            $(prefix + "Sub").textContent = `#${fullNumber(n.rank)} · ${label}`;
            box.onclick = () => { location.href = `/people-detail/?id=${encodeURIComponent(n.username || n.userId)}`; };
        }

        function fillRank(p, nb) {
            $("pdRankNum").textContent = `#${fullNumber(p.rank)}`;
            $("pdRankTotal").textContent = `of ${fullNumber(p.total)} players`;
            const behind = p.total > 0 ? ((p.total - p.rank) / p.total) * 100 : 0;
            const ahead = p.total > 0 ? ((p.rank - 1) / p.total) * 100 : 0;
            $("pdPctBehind").textContent = behind.toFixed(2) + "%";
            $("pdPctAhead").textContent = ahead.toFixed(2) + "%";
            $("pdBarFill").style.width = Math.max(0, Math.min(100, behind)) + "%";
            fillNeighbor("nbBehind", nb && nb.behind, "Behind");
            fillNeighbor("nbAhead", nb && nb.ahead, "Ahead");
        }

        // ---------- graf: plynulá křivka (monotónní kubická interpolace, nepřestřelí pod nulu) ----------
        function smoothPath(pts) {
            const n = pts.length;
            if (n === 1) return `M${pts[0].x} ${pts[0].y}`;
            const dx = [], s = [], m = new Array(n);
            for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1].x - pts[i].x; s[i] = (pts[i + 1].y - pts[i].y) / dx[i]; }
            m[0] = s[0]; m[n - 1] = s[n - 2];
            for (let i = 1; i < n - 1; i++) m[i] = s[i - 1] * s[i] <= 0 ? 0 : (s[i - 1] + s[i]) / 2;
            for (let i = 0; i < n - 1; i++) {
                if (s[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
                const a = m[i] / s[i], b = m[i + 1] / s[i], h = a * a + b * b;
                if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * s[i]; m[i + 1] = t * b * s[i]; }
            }
            let d = `M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
            for (let i = 0; i < n - 1; i++) {
                const x1 = pts[i].x + dx[i] / 3, y1 = pts[i].y + m[i] * dx[i] / 3;
                const x2 = pts[i + 1].x - dx[i] / 3, y2 = pts[i + 1].y - m[i + 1] * dx[i] / 3;
                d += ` C${x1.toFixed(1)} ${y1.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)} ${pts[i + 1].x.toFixed(1)} ${pts[i + 1].y.toFixed(1)}`;
            }
            return d;
        }

        function niceMax(v) {
            if (v <= 1) return 1;
            const p = Math.pow(10, Math.floor(Math.log10(v)));
            const f = v / p;
            return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
        }

        const pad2 = x => String(x).padStart(2, "0");
        const hh = ts => pad2(new Date(ts * 1000).getHours());

        const SVG_W = 716, SVG_H = 186, PAD_L = 54, PAD_R = 26, PAD_T = 26, PAD_B = 28;

        function setStats(history, ended, available) {
            const vals = ["stTotal", "stAvg", "stBest", "stLatest"];
            vals.forEach(id => $(id).classList.toggle("is-na", !available || history.length === 0));
            if (!available || history.length === 0) {
                vals.forEach(id => { $(id).textContent = "N/A"; });
                $("stLabelTotal").textContent = "Total points";
                $("stLabelBest").textContent = "Best hour";
                return;
            }
            // gain === null = hodina bez dat (chyba API) – do součtů ani průměru se nepočítá
            const gains = history.map(h => h.gain);
            const known = gains.filter(g => g != null);
            const total = known.reduce((a, b) => a + b, 0);
            const bestVal = known.length ? Math.max(...known) : 0;
            const bestI = gains.indexOf(bestVal);
            const latest = gains[gains.length - 1];
            $("stLabelTotal").textContent = `Total · ${history.length}h`;
            $("stLabelBest").textContent = bestVal > 0 ? `Best hour · ${hh(history[bestI].hour)}:00` : "Best hour";
            $("stTotal").textContent = short2(total);
            $("stAvg").textContent = known.length ? short2(total / known.length) : "N/A";
            $("stBest").textContent = known.length ? short2(bestVal) : "N/A";
            $("stLatest").textContent = latest == null ? "N/A" : short2(latest);
            $("stLatest").classList.toggle("is-na", latest == null);
        }

        function renderChart(history, ended) {
            const svg = $("pdChartSvg"), card = $("pdChartCard"), tip = $("pdTip");
            $("pdChartMsg").classList.remove("is-visible");
            svg.style.display = "block";

            const n = history.length;
            const plotW = SVG_W - PAD_L - PAD_R, plotH = SVG_H - PAD_T - PAD_B;
            // gain === null = hodina bez dat (chyba API): žádný bod, čára se v ní přeruší
            const gains = history.map(h => h.gain);
            const known = gains.filter(g => g != null);
            const total = known.reduce((a, b) => a + b, 0), avg = known.length ? total / known.length : 0;
            const max = niceMax(Math.max(...known, 1));
            const baseY = PAD_T + plotH;
            const xAt = i => n === 1 ? PAD_L + plotW / 2 : PAD_L + (i * plotW) / (n - 1);
            const yAt = v => baseY - (v / max) * plotH;
            const pts = gains.map((g, i) => ({ x: xAt(i), y: g == null ? baseY : yAt(g), gap: g == null }));
            // souvislé úseky s daty
            const segs = [];
            let cur = [];
            pts.forEach(p => { if (p.gap) { if (cur.length) segs.push(cur); cur = []; } else cur.push(p); });
            if (cur.length) segs.push(cur);
            const nowHour = Math.floor(Date.now() / 3600000) * 3600;

            let out = `<defs><linearGradient id="pdFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="rgba(28,46,74,0.8)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient></defs>`;

            // mřížka + osa Y (jako v live)
            [0, 0.25, 0.5, 0.75, 1].forEach(f => {
                const y = baseY - f * plotH;
                out += `<line x1="${PAD_L}" y1="${y}" x2="${SVG_W - PAD_R}" y2="${y}" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>`;
                out += `<text x="${PAD_L - 8}" y="${y + 4}" text-anchor="end">${f === 0 ? "0" : short2(max * f, true)}</text>`;
            });

            // popisky osy X
            const step = n > 12 ? 6 : n > 6 ? 3 : 1;
            for (let i = n - 1; i >= 0; i -= step) {
                const ago = n - 1 - i;
                const label = ago === 0 ? (ended ? "END" : "NOW") : `${ago}h ago`;
                const anchor = i === n - 1 && n > 1 ? "end" : "middle";
                out += `<text x="${xAt(i) + (anchor === "end" ? 6 : 0)}" y="${SVG_H - 8}" text-anchor="${anchor}" style="${ago === 0 ? "font-weight:800" : ""}">${label}</text>`;
            }

            // průměr (čárkovaně)
            const avgY = yAt(avg);
            out += `<line x1="${PAD_L}" y1="${avgY}" x2="${SVG_W - PAD_R}" y2="${avgY}" stroke="#262C2D" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 5"/>`;

            // plocha, obrys a bílá čára křivky (každý úsek zvlášť, mezery zůstanou prázdné)
            segs.forEach(seg => {
                if (seg.length < 2) return;
                const line = smoothPath(seg), a = seg[0], z = seg[seg.length - 1];
                out += `<path d="${line} L${z.x.toFixed(1)} ${baseY} L${a.x.toFixed(1)} ${baseY} Z" fill="url(#pdFill)"/>`;
                out += `<path d="${line}" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
                out += `<path d="${line}" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
            });

            // body (bílé s černým okrajem jako v live) – jen hodiny s daty
            pts.forEach((p, i) => { if (!p.gap) out += `<circle id="pdPt${i}" cx="${p.x}" cy="${p.y}" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>`; });

            // bublina s posledním známým přírůstkem
            let lastI = n - 1;
            while (lastI > 0 && pts[lastI].gap) lastI--;
            const last = pts[lastI], txt = gains[lastI] == null ? "" : short2(gains[lastI]);
            const bw = txt.length * 8 + 16, bx = Math.max(PAD_L - 8, Math.min(SVG_W - 4 - bw, last.x - bw / 2));
            const by = Math.max(2, last.y - 30);
            if (txt) out += `<g pointer-events="none"><rect x="${bx}" y="${by}" width="${bw}" height="22" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
                    <text x="${bx + bw / 2}" y="${by + 15.5}" text-anchor="middle" style="font-size:13px;font-weight:800">${txt}</text></g>`;

            // neviditelné plochy pro hover/klepnutí
            const hw = n === 1 ? plotW : plotW / (n - 1);
            pts.forEach((p, i) => { out += `<rect class="pd-hit" data-i="${i}" x="${p.x - hw / 2}" y="0" width="${hw}" height="${baseY}"/>`; });
            svg.innerHTML = out;

            let activeI = -1;
            const hide = () => {
                tip.style.display = "none";
                if (activeI >= 0) { const c = $("pdPt" + activeI); if (c) c.setAttribute("r", "4"); }
                activeI = -1;
            };
            const show = i => {
                hide();
                activeI = i;
                const h = history[i], c = $("pdPt" + i);
                if (c) c.setAttribute("r", "6.5");
                $("pdTipTitle").textContent = `${hh(h.hour)}:00 - ${hh(h.hour)}:59${!ended && h.hour === nowHour ? " (so far)" : ""}`;
                $("pdTipBody").textContent = h.gain == null ? "No data (API error)" : `+${fullNumber(h.gain)} points`;
                tip.style.display = "block";
                const w = tip.offsetWidth, th = tip.offsetHeight;
                let left = 6 + pts[i].x - w / 2;
                left = Math.max(6, Math.min(728 - w - 2, left));
                let top = 58 + pts[i].y - th - 12;
                if (top < 4) top = 58 + pts[i].y + 14;
                tip.style.left = left + "px"; tip.style.top = top + "px";
            };
            svg.onmouseover = e => { const t = e.target.closest("[data-i]"); if (t) show(+t.dataset.i); };
            svg.onclick = e => { const t = e.target.closest("[data-i]"); if (t) show(+t.dataset.i); };
            svg.onmouseleave = hide;
        }

        function renderNoChart(main, sub) {
            $("pdChartSvg").style.display = "none";
            $("pdTip").style.display = "none";
            $("pdChartMsgMain").textContent = main;
            $("pdChartMsgSub").textContent = sub;
            $("pdChartMsg").classList.add("is-visible");
        }

        // ---------- načtení hráče ----------
        // V adrese může být jméno (?id=Jmeno) nebo staré číselné ID (?id=123456).
        async function fetchPlayer(raw) {
            const getJson = async (u) => (await fetch(u)).json();
            const nameUrl = `${WORKER_URL}/api/player/search?name=${encodeURIComponent(raw)}`;
            const looksLikeName = /^[A-Za-z0-9_]{3,20}$/.test(raw);

            if (/^\d+$/.test(raw)) {
                const json = await getJson(`${WORKER_URL}/api/player/${raw}`);
                // jméno může být i ze samých číslic – když ID nic nenajde, zkusíme ho ještě jako jméno
                if (json && json.status === "ok" && !json.found && looksLikeName) {
                    const alt = await getJson(nameUrl);
                    if (alt && alt.status === "ok" && alt.found) return alt;
                }
                return json;
            }
            if (looksLikeName) return getJson(nameUrl);
            return { status: "ok", found: false };
        }

        async function loadPlayer() {
            const raw = (new URLSearchParams(location.search).get("id") || "").trim();
            if (!raw) { showCenter("Player not found."); if (window.PS99Site) PS99Site.notFound(); return; }

            try {
                const json = await fetchPlayer(raw);
                if (!json || json.status !== "ok") { showCenter("API Error.", true); return; }
                if (!json.found || !json.player) {
                    showCenter(json.message || "Player not found.");
                    if (json.userId) {
                        // V aktuální válce hráč není, ale z minulých válek historii mít může -> rovnou ji ukázat
                        pdPlayer = { userId: json.userId, live: null };
                        if (/^[A-Za-z0-9_]{3,20}$/.test(raw) && !/^\d+$/.test(raw)) setName(raw); else loadMissingName(json.userId);
                        fetchAvatars([json.userId], "420x420").then(m => { if (m[json.userId]) { $("pdAvatar").src = m[json.userId]; if ($("phAva")) $("phAva").src = m[json.userId]; } });
                        $("pdHistBtn").classList.add("is-ready");
                        showView("history", "replace");
                        return;
                    }
                    if (window.PS99Site) PS99Site.notFound();
                    return;
                }

                const p = json.player, ended = !json.active, battle = json.battle || {};
                const history = Array.isArray(json.history) ? json.history : [];
                const available = json.historyAvailable !== false && history.length > 0;

                pdHasDetail = true;
                pdPlayer = {
                    userId: p.userId,
                    // aktuální / poslední válka pro začátek historie (v historii je až po konci a přepočtu)
                    live: battle.name ? { battle: battle.name, title: null, start: battle.start || null, finish: battle.finish || null,
                        clan: p.clan, points: p.points, rank: p.rank, total: p.total, isLive: true, active: !!json.active } : null,
                };
                $("pdHistBtn").classList.add("is-ready");
                $("centerMsg").style.display = "none";
                $("pdContent").classList.add("is-visible");
                if (window.PS99Site) PS99Site.contentReady();

                setName(p.username || `User ${p.userId}`);
                // inClan === false: hráče už nikdo neviděl v žádném klanu; body zůstávají, klan je jen poslední známý
                const noClan = p.inClan === false;
                $("pdClan").classList.toggle("is-none", noClan);
                $("pdClan").title = noClan && p.clan ? `Not in a clan right now. Last clan: ${p.clan}` : "";
                $("pdClanTag").textContent = noClan ? "No clan" : (p.clan || "-");
                $("pdClan").onclick = () => { if (!noClan && p.clan) location.href = `/clan-detail/?name=${encodeURIComponent(p.clan)}`; };
                $("pdPoints").textContent = fullNumber(p.points);
                fillRank(p, json.neighbors);

                // avatary: hlavní ve větším rozlišení, sousedé malé (dva dotazy najednou)
                const nbIds = [json.neighbors && json.neighbors.behind, json.neighbors && json.neighbors.ahead].filter(Boolean).map(n => n.userId);
                fetchAvatars([p.userId], "420x420").then(m => { if (m[p.userId]) { $("pdAvatar").src = m[p.userId]; if ($("phAva")) $("phAva").src = m[p.userId]; } });
                if (nbIds.length) fetchAvatars(nbIds, "150x150").then(m => {
                    const b = json.neighbors.behind, a = json.neighbors.ahead;
                    if (b && m[b.userId]) $("nbBehindImg").src = m[b.userId];
                    if (a && m[a.userId]) $("nbAheadImg").src = m[a.userId];
                });
                if (!p.username) loadMissingName(p.userId);

                // záhlaví grafu
                const warName = battle.name || "clan war";
                $("pdBadge").classList.toggle("is-ended", ended);
                $("pdBadgeText").textContent = ended ? "WAR ENDED" : "WAR ACTIVE";
                $("pdChartSub").textContent = available
                    ? (() => { const hrs = history.length === 1 ? "hour" : `${history.length} hours`; return ended ? `Final ${hrs} of ${warName}` : `Last ${hrs} of ${warName}`; })()
                    : warName;

                if (viewParam() === "history") showView("history", "none");

                setStats(history, ended, available);
                if (available) renderChart(history, ended);
                else renderNoChart("No hourly data for this war",
                    ended ? "Hourly history is recorded while a clan war is running. This war was not tracked from its start, so the graph will be available from the next war."
                          : "The graph fills in hour by hour during the clan war.");
            } catch (err) {
                console.error(err);
                showCenter("API Error.", true);
            }
        }

        // ================= HISTORIE VÁLEK =================
        // Druhý pohled v okně (?tab=history). Data: /api/player/ID/history (válka -> klan, body, pořadí, počet hráčů).
        let pdPlayer = null;          // { userId, live } – live = aktuální / poslední válka z detailu (ještě není v historii)
        let pdHasDetail = false;      // hráč je v aktuální válce (stats pohled má co ukázat)
        let histData = null, histLoading = null, histPushed = false;

        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const viewParam = () => new URLSearchParams(location.search).get("tab") === "history" ? "history" : "stats";
        function urlFor(view) {
            const q = new URLSearchParams(location.search);
            if (view === "history") q.set("tab", "history"); else q.delete("tab");
            return location.pathname + "?" + q.toString();
        }

        function prettyBattle(n) { return String(n || "").replace(/([a-z])([A-Z0-9])/g, "$1 $2").replace(/([0-9])([A-Za-z])/g, "$1 $2"); }
        const warTitle = w => w.battle;                       // název války tak, jak ho používá hra (bez mezer)
        const topPct = w => (w.rank && w.total) ? (w.rank / w.total) * 100 : null;       // 3.92 = top 3.92 %
        const beatPct = w => (w.rank && w.total) ? ((w.total - w.rank) / w.total) * 100 : null;
        // Kolik % hráčů skončilo za ním (96.08 -> "96.0%"); zaokrouhleno dolů, ať se nic nepřikrášlí
        function fmtBehind(b) { return b >= 100 ? "100%" : (Math.floor(b * 10) / 10).toFixed(1) + "%"; }
        function fmtTop(t) { const v = Math.max(0.1, Math.ceil(t * 10) / 10); return (v < 10 ? v.toFixed(1).replace(/\.0$/, "") : String(Math.ceil(v))) + "%"; }
        function tierOf(t) { return t <= 1 ? "t1" : t <= 5 ? "t5" : t <= 10 ? "t10" : t <= 25 ? "t25" : t <= 50 ? "t50" : "t100"; }
        const TIER_COLOR = { t1: "#FFC21F", t5: "#55DDFD", t10: "#8EDC4A", t25: "#93B4F7", t50: "#C9B5F5", t100: "#D3D9E2" };
        function fmtDay(ts, year) { return new Date(ts * 1000).toLocaleDateString("en-US", year ? { month: "short", day: "numeric", year: "numeric" } : { month: "short", day: "numeric" }); }
        function dateRange(w) {
            if (!w.finish) return "";
            const end = w.finish - 1, y = new Date(end * 1000).getFullYear();
            if (!w.start) return fmtDay(end, true);
            return `${fmtDay(w.start, new Date(w.start * 1000).getFullYear() !== y)} – ${fmtDay(end, true)}`;
        }

        function histHeader(count) {
            const name = currentName || (pdPlayer ? `User ${pdPlayer.userId}` : "");
            return `<div class="ph-head">
                <img class="ph-ava" id="phAva" src="${esc($("pdAvatar").src || BLANK)}" alt="" draggable="false">
                <div class="ph-kicker">CLAN WAR HISTORY</div>
                <div class="ph-name pd-outline" id="phName" data-text="${esc(name)}">${esc(name)}</div>
                ${count == null ? "" : `<div class="ph-count pd-card"><div class="ph-count-num pd-outline">${count}</div><div class="ph-count-label">WARS PLAYED</div></div>`}
            </div>`;
        }
        function fitHistHeader() { const el = $("phName"); if (el) fitWidth(el, 420, 34, 18, 0.18); }

        function renderHistMsg(main, sub, isError) {
            $("phInner").innerHTML = histHeader(null) +
                `<div class="ph-msg"><div class="ph-msg-main" style="${isError ? "color:#ff4a4a" : ""}">${esc(main)}</div><div class="ph-msg-sub">${esc(sub || "")}</div></div>`;
            fitHistHeader();
        }

        function scanNote(scan) {
            if (!scan || !scan.running) return "";
            // výrazný pruh nahoře, dokud se poprvé sbírají staré války
            const pct = scan.progress == null ? null : Math.floor(scan.progress * 100);
            const bar = pct == null ? "" : `<div class="ph-scanbar"><i style="width:${Math.max(2, pct)}%"></i></div>`;
            const txt = scan.firstScanDone
                ? `The last clan war is being checked across every clan${pct == null ? "" : ` (${pct}%)`}. Ranks marked * become final when that is done.`
                : `Past clan wars are being collected from every clan${pct == null ? "" : ` (${pct}%)`}. This runs once and takes about an hour; past wars appear when it finishes.`;
            return `<div class="ph-note ph-scan pd-card">${esc(txt)}${bar}</div>`;
        }

        function warCard(w, i) {
            const t = topPct(w), beat = beatPct(w);
            const live = w.isLive && w.active;
            const tier = t == null ? "tna" : tierOf(t);
            const provisional = !w.isLive && w.final === false && w.rank;
            const meta = [];
            if (live) meta.push(`<span class="ph-live-dot"></span><span class="ph-date" style="color:#1E9E3A">Live now</span>`);
            else if (w.isLive) meta.push(`<span class="ph-date">Latest war</span>`);
            const dr = dateRange(w);
            if (dr) meta.push(`<span class="ph-date">${esc(dr)}</span>`);
            if (w.clan) meta.push(`<span class="ph-clan" data-clan="${esc(w.clan)}" title="Open clan">${esc(w.clan)}</span>`);
            return `<div class="ph-war pd-card${live ? " is-live" : ""}">
                <div class="ph-tier ${tier}" title="${beat == null ? "Rank not known yet" : `${beat.toFixed(2)}% of players finished behind`}">
                    <span class="ph-tier-top">${beat == null ? "RANK" : "BEHIND"}</span>
                    <span class="ph-tier-val pd-outline">${beat == null ? "?" : fmtBehind(beat)}</span>
                </div>
                <div class="ph-war-name pd-outline" title="${esc(w.battle)}">${esc(warTitle(w))}</div>
                <div class="ph-war-meta">${meta.join("")}</div>
                <div class="ph-pts" title="${fullNumber(w.points)} points">
                    <div class="ph-pts-row"><img src="/images/stars.png" alt="" draggable="false"><span class="ph-pts-num pd-outline">${short2(w.points || 0, true)}</span></div>
                    <div class="ph-sub">points</div>
                </div>
                <div class="ph-rank">
                    <div class="ph-rank-num pd-outline${w.rank ? "" : " is-na"}">${w.rank ? `#${fullNumber(w.rank)}${provisional ? "*" : ""}` : "ranking…"}</div>
                    <div class="ph-sub">${w.total ? `of ${fullNumber(w.total)} players` : "&nbsp;"}</div>
                    <div class="ph-beat">${beat == null ? "&nbsp;" : `${beat.toFixed(2)}% behind`}</div>
                </div>
            </div>`;
        }

        // Sloupce: kolik % hráčů v každé válce hráč porazil (vlevo nejstarší)
        function formChart(items) {
            const pts = items.filter(w => topPct(w) != null).slice().reverse();
            if (pts.length < 2) return "";
            const W = 712, Hh = 104, padL = 34, padB = 4, plotW = W - padL - 6, plotH = Hh - padB - 6;
            const slot = plotW / pts.length, bw = Math.max(4, Math.min(26, slot - 6));
            let svg = "";
            [0, 50, 100].forEach(v => {
                const y = 6 + plotH - (v / 100) * plotH;
                svg += `<line x1="${padL}" y1="${y}" x2="${W - 6}" y2="${y}" stroke="rgba(0,0,0,${v === 0 ? 0.25 : 0.08})" stroke-width="1.5" ${v === 50 ? 'stroke-dasharray="5 4"' : ""}/>`;
                svg += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end">${v}%</text>`;
            });
            pts.forEach((w, i) => {
                const b = beatPct(w), h = Math.max(3, (b / 100) * plotH), x = padL + i * slot + (slot - bw) / 2, y = 6 + plotH - h;
                const c = TIER_COLOR[tierOf(topPct(w))];
                svg += `<rect class="ph-bar" data-i="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${c}" stroke="#000" stroke-width="2"/>`;
                svg += `<rect class="ph-bar" data-i="${i}" x="${(padL + i * slot).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${Hh}" fill="transparent"/>`;
            });
            formChart.items = pts;
            return `<div class="ph-form pd-card" id="phForm">
                <div class="ph-form-title pd-outline">FORM</div>
                <div class="ph-form-sub">Players behind him in each war, oldest to newest</div>
                <div class="ph-form-legend"><span><i style="background:${TIER_COLOR.t1}"></i>99%+</span><span><i style="background:${TIER_COLOR.t5}"></i>95%+</span><span><i style="background:${TIER_COLOR.t10}"></i>90%+</span><span><i style="background:${TIER_COLOR.t25}"></i>75%+</span></div>
                <svg class="ph-form-svg" id="phFormSvg" viewBox="0 0 ${W} ${Hh}">${svg}</svg>
                <div class="ph-tip" id="phTip"><div class="ph-tip-title" id="phTipTitle"></div><div class="ph-tip-body" id="phTipBody"></div></div>
            </div>`;
        }
        function bindFormChart() {
            const svg = $("phFormSvg"), tip = $("phTip"), card = $("phForm");
            if (!svg) return;
            const show = i => {
                const w = formChart.items[i]; if (!w) return;
                $("phTipTitle").textContent = warTitle(w);
                $("phTipBody").textContent = `${fmtBehind(beatPct(w))} behind · #${fullNumber(w.rank)} of ${fullNumber(w.total)}`;
                tip.style.display = "block";
                const r = svg.querySelector(`rect[data-i="${i}"]`), sr = svg.getBoundingClientRect(), cr = card.getBoundingClientRect();
                const scale = cr.width / card.offsetWidth || 1;
                const cx = (r.getBoundingClientRect().left + r.getBoundingClientRect().width / 2 - cr.left) / scale;
                const top = (r.getBoundingClientRect().top - cr.top) / scale;
                const left = Math.max(6, Math.min(card.offsetWidth - tip.offsetWidth - 6, cx - tip.offsetWidth / 2));
                tip.style.left = left + "px";
                tip.style.top = Math.max(2, top - tip.offsetHeight - 8) + "px";
            };
            svg.onmouseover = e => { const t = e.target.closest("[data-i]"); if (t) show(+t.dataset.i); };
            svg.onclick = e => { const t = e.target.closest("[data-i]"); if (t) show(+t.dataset.i); };
            svg.onmouseleave = () => { tip.style.display = "none"; };
        }

        function renderHistory() {
            const d = histData || {}, P = pdPlayer;
            const wars = (d.wars || []).slice();
            const items = [];
            if (P.live && P.live.battle && !wars.some(w => w.battle === P.live.battle)) items.push(P.live);
            items.push(...wars);

            if (!items.length) {
                const scan = d.scan || {};
                if (scan.running && !scan.firstScanDone) {
                    const pct = scan.progress == null ? null : Math.floor(scan.progress * 100);
                    renderHistMsg("Collecting clan war history…",
                        `Past wars are being gathered from every clan${pct == null ? "" : ` (${pct}%)`}. This runs once and takes about an hour, check back later.`);
                    if (pct != null) $("phInner").insertAdjacentHTML("beforeend", `<div class="ph-scanbar"><i style="width:${Math.max(2, pct)}%"></i></div>`);
                } else {
                    renderHistMsg("No clan war history", "This player has no recorded points in a finished clan war.");
                    $("phInner").insertAdjacentHTML("beforeend", scanNote(scan));
                }
                return;
            }

            const ranked = items.filter(w => topPct(w) != null);
            const best = ranked.slice().sort((a, b) => topPct(a) - topPct(b))[0];
            const avgBehind = ranked.length ? ranked.reduce((s, w) => s + beatPct(w), 0) / ranked.length : null;
            const over90 = ranked.filter(w => beatPct(w) >= 90).length;
            const totalPts = items.reduce((s, w) => s + (w.points || 0), 0);
            const tile = (label, value, na, title) => `<div class="ph-tile pd-card"${title ? ` title="${esc(title)}"` : ""}><div class="ph-tile-label">${esc(label)}</div><div class="ph-tile-value pd-outline${na ? " is-na" : ""}">${esc(value)}</div></div>`;

            $("phInner").innerHTML = histHeader(items.length) + scanNote(d.scan) +
                `<div class="ph-tiles">
                    ${best ? tile(`Best · ${warTitle(best)}`, `#${fullNumber(best.rank)}`, false, `${warTitle(best)}: #${fullNumber(best.rank)} of ${fullNumber(best.total)}`) : tile("Best finish", "N/A", true)}
                    ${avgBehind != null ? tile("Average · players behind", fmtBehind(avgBehind)) : tile("Average · players behind", "N/A", true)}
                    ${tile("Wars with 90%+ behind", ranked.length ? `${over90} / ${ranked.length}` : "N/A", !ranked.length)}
                    ${tile("Points, all wars", short2(totalPts, true), false, `${fullNumber(totalPts)} points`)}
                </div>` +
                formChart(items) +
                `<div class="ph-list-head"><span class="ph-list-title pd-outline">WARS</span><span class="ph-list-note">Rank among all players who scored in that war</span></div>` +
                items.map(warCard).join("") +
                `<div class="ph-note">History is built from every clan's saved war results. Wars of clans that were deleted can't be included.</div>`;

            fitHistHeader();
            $("phInner").querySelectorAll(".ph-war-name").forEach(el => fitWidth(el, 330, 22, 13, 0.27));
            bindFormChart();
        }

        async function loadHistory() {
            if (histData) { renderHistory(); return; }
            if (histLoading) return histLoading;
            renderHistMsg("Loading history…", "");
            histLoading = (async () => {
                for (let attempt = 0; attempt < 2; attempt++) {
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), 12000);
                    try {
                        const res = await fetch(`${WORKER_URL}/api/player/${pdPlayer.userId}/history`, { signal: ctrl.signal });
                        const json = await res.json();
                        if (json && json.status === "ok") { histData = json; renderHistory(); return; }
                    } catch (e) {
                    } finally { clearTimeout(timer); }
                    if (attempt === 0) await new Promise(r => setTimeout(r, 600));
                }
                renderHistMsg("Couldn't load the history", "Please try again in a moment.", true);
            })();
            try { await histLoading; } finally { histLoading = null; }
        }

        function showView(view, mode) {
            const hist = view === "history" && !!pdPlayer;
            $("phScroll").classList.toggle("is-visible", hist);
            $("pdContent").classList.toggle("is-visible", !hist && pdHasDetail);
            $("centerMsg").style.display = (!hist && !pdHasDetail) ? "block" : "none";
            if (mode === "push") { history.pushState({ v: view }, "", urlFor(view)); histPushed = hist; }
            else if (mode === "replace") history.replaceState({ v: view }, "", urlFor(view));
            if (currentName) document.title = `${currentName}${hist ? " - War History" : ""} - PS99 Clans`;
            if (hist) { $("phScroll").scrollTop = 0; loadHistory(); }
        }
        function goBack() {
            if ($("phScroll").classList.contains("is-visible") && pdHasDetail) {
                if (histPushed) { histPushed = false; history.back(); }
                else showView("stats", "replace");
                return;
            }
            location.href = "/people/";
        }
        function toggleHistory() {
            if ($("phScroll").classList.contains("is-visible")) { if (pdHasDetail) goBack(); }
            else showView("history", "push");
        }
        window.addEventListener("popstate", () => { if (pdPlayer) showView(viewParam(), "none"); });

        function autoFitScreen() {
            if (window.visualViewport && window.visualViewport.scale > 1.01) return;   // uživatel zoomuje -> nic neměnit
            const scaler = $("appScaler");
            if (!scaler) return;
            const winW = document.documentElement.clientWidth, winH = document.documentElement.clientHeight;
            if (winW >= 1150) { document.body.classList.remove("is-mobile"); scaler.style.transform = winH < 840 ? `scale(${(winH / 840).toFixed(4)})` : "none"; return; }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 960) * 0.92})`;
        }

        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);
        window.addEventListener("DOMContentLoaded", autoFitScreen);
        window.addEventListener("DOMContentLoaded", loadPlayer);
        window.addEventListener("DOMContentLoaded", () => {
            const b = $("pdHistBtn");
            b.addEventListener("click", toggleHistory);
            b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleHistory(); } });
            $("phInner").addEventListener("click", e => {
                const c = e.target.closest("[data-clan]");
                if (c) location.href = `/clan-detail/?name=${encodeURIComponent(c.dataset.clan)}`;
            });
        });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (currentName) setName(currentName); fitHistHeader(); });
    </script>
