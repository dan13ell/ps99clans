    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const NAME_MAX_WIDTH = 480;

        const $ = id => document.getElementById(id);

        function escapeHtml(str) {
            return String(str ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function formatNumber(num) {
            if (num === undefined || num === null || isNaN(num)) return "0";
            const fmt = (v, suffix) => (v >= 100 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, "")) + suffix;
            if (num >= 1e9) return fmt(num / 1e9, "b");
            if (num >= 1e6) return fmt(num / 1e6, "m");
            if (num >= 1e3) return fmt(num / 1e3, "k");
            return String(Math.round(num));
        }

        function fullNumber(num) {
            return Number(num || 0).toLocaleString("en-US");
        }

        function showCenter(text, isError = false) {
            $("pdContent").classList.remove("is-visible");
            const el = $("centerMsg");
            el.textContent = text;
            el.classList.toggle("is-error", isError);
            el.style.display = "block";
        }

        // Zmenšuje písmo nicku, dokud se nevejde do NAME_MAX_WIDTH (48px -> 20px)
        function fitTitle() {
            const el = $("pdName");
            let size = 48;
            const apply = () => {
                el.style.fontSize = size + "px";
                el.style.webkitTextStroke = Math.max(3, Math.round(size / 8)) + "px #000000";
            };
            apply();
            while (el.offsetWidth > NAME_MAX_WIDTH && size > 20) {
                size -= 1;
                apply();
            }
        }

        function setName(name) {
            const el = $("pdName");
            el.textContent = name;
            el.setAttribute("data-text", name);
            document.title = `${name} - PS99 Clans`;
            fitTitle();
        }

        async function loadAvatar(userId) {
            try {
                const res = await fetch(`${WORKER_URL}/roblox/avatars?userIds=${userId}&size=420x420&format=Png&isCircular=false`);
                const json = await res.json();
                const item = (json.data || []).find(x => x && Number(x.targetId) === userId && x.imageUrl);
                if (item) $("pdAvatar").src = item.imageUrl;
            } catch (e) {
                console.warn("Avatar se nepodařilo načíst:", e.message);
            }
        }

        async function loadMissingName(userId) {
            try {
                const res = await fetch(`${WORKER_URL}/roblox/users`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userIds: [userId] }),
                });
                const json = await res.json();
                const u = (json.data || []).find(x => x && Number(x.id) === userId && x.name);
                if (u) setName(u.name);
            } catch (e) {
                console.warn("Jméno se nepodařilo načíst:", e.message);
            }
        }

        // ---------- Graf bodů za hodinu (vlastní SVG, bez externí knihovny) ----------
        function niceMax(v) {
            if (v <= 1) return 1;
            const p = Math.pow(10, Math.floor(Math.log10(v)));
            const f = v / p;
            return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
        }

        function hourLabel(ts) {
            return String(new Date(ts * 1000).getHours()).padStart(2, "0") + ":00";
        }

        function renderChart(history) {
            const svg = $("pdChartSvg");
            const msg = $("pdChartMsg");
            const info = $("pdChartInfo");
            msg.classList.remove("is-visible");
            svg.style.display = "block";

            const W = 726, H = 250, padL = 52, padR = 8, padT = 12, padB = 30;
            const slots = 24;
            const slotW = (W - padL - padR) / slots;
            const barW = Math.round(slotW * 0.68);
            const plotH = H - padT - padB;

            const gains = history.map(h => h.gain);
            const total = gains.reduce((a, b) => a + b, 0);
            const max = niceMax(Math.max(...gains, 1));
            const currentHour = Math.floor(Date.now() / 3600000) * 3600;
            const defaultInfo = `Last ${history.length}h: +${formatNumber(total)}`;
            info.textContent = defaultInfo;

            let out = "";
            // vodorovné čáry a popisky osy Y
            [0, 0.5, 1].forEach(f => {
                const y = padT + plotH - f * plotH;
                out += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${f === 0 ? "#2B2B2B" : "#D5E3E3"}" stroke-width="${f === 0 ? 3 : 2}" stroke-linecap="round"/>`;
                out += `<text x="${padL - 8}" y="${y + 5}" text-anchor="end">${formatNumber(max * f)}</text>`;
            });

            history.forEach((h, i) => {
                const x = padL + i * slotW + (slotW - barW) / 2;
                const bh = h.gain > 0 ? Math.max(4, (h.gain / max) * plotH) : 0;
                const isCurrent = h.hour === currentHour;
                if (bh > 0) {
                    out += `<rect class="pd-bar" id="pdBar${i}" x="${x}" y="${padT + plotH - bh}" width="${barW}" height="${bh}" rx="4" fill="${isCurrent ? "#BFF3FF" : "#60E0FE"}" stroke="#000" stroke-width="3"${isCurrent ? ' stroke-dasharray="5 3"' : ""}/>`;
                } else {
                    out += `<rect x="${x}" y="${padT + plotH - 3}" width="${barW}" height="3" rx="1.5" fill="#CFE0E0"/>`;
                }
                if (i % 3 === 0) {
                    out += `<text x="${x + barW / 2}" y="${H - 8}" text-anchor="middle">${hourLabel(h.hour)}</text>`;
                }
                out += `<rect class="pd-hit" data-i="${i}" x="${padL + i * slotW}" y="${padT}" width="${slotW}" height="${plotH}"/>`;
            });
            svg.innerHTML = out;

            const show = i => {
                const h = history[i];
                if (!h) return;
                const hh = hourLabel(h.hour);
                const end = hh.slice(0, 2) + ":59";
                info.textContent = `${hh}-${end}: +${fullNumber(h.gain)}${h.hour === currentHour ? " (so far)" : ""}`;
            };
            svg.onmouseover = e => { const t = e.target.closest("[data-i]"); if (t) show(+t.dataset.i); };
            svg.onclick = e => { const t = e.target.closest("[data-i]"); if (t) show(+t.dataset.i); };
            svg.onmouseleave = () => { info.textContent = defaultInfo; };
        }

        function renderNoChart(main, sub) {
            $("pdChartSvg").style.display = "none";
            $("pdChartInfo").textContent = "";
            $("pdChartMsgMain").textContent = main;
            $("pdChartMsgSub").textContent = sub;
            $("pdChartMsg").classList.add("is-visible");
        }

        // ---------- Načtení hráče ----------
        async function loadPlayer() {
            const userId = parseInt(new URLSearchParams(location.search).get("id"), 10);
            if (!userId) { showCenter("Player not found."); return; }

            try {
                const res = await fetch(`${WORKER_URL}/api/player/${userId}`);
                const json = await res.json();

                if (!json || json.status !== "ok") { showCenter("API Error.", true); return; }
                if (!json.found || !json.player) {
                    showCenter(json.message || "Player not found in top 25,000.");
                    return;
                }

                const p = json.player;
                $("centerMsg").style.display = "none";
                $("pdContent").classList.add("is-visible");

                setName(p.username || `User ${p.userId}`);
                $("pdClanTag").textContent = p.clan || "-";
                $("pdClan").onclick = () => { if (p.clan) location.href = `/clan-detail/?name=${encodeURIComponent(p.clan)}`; };
                $("pdPoints").textContent = fullNumber(p.points);
                $("pdRankNum").textContent = `#${fullNumber(p.rank)}`;
                $("pdRankTotal").textContent = `of ${fullNumber(p.total)}`;

                loadAvatar(p.userId);
                if (!p.username) loadMissingName(p.userId);

                // Graf jen při aktivní válce; po jejím konci se místo něj ukáže hláška (žádné nuly)
                if (json.active && Array.isArray(json.history) && json.history.length > 0) {
                    renderChart(json.history);
                } else if (json.active) {
                    renderNoChart("No data yet", "The graph fills in hour by hour during the clan war.");
                } else {
                    renderNoChart("Clan war is not active", "The hourly graph is shown during a clan war.");
                }
            } catch (err) {
                console.error(err);
                showCenter("API Error.", true);
            }
        }

        function autoFitScreen() {
            const scaler = $("appScaler");
            if (!scaler) return;
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            if (winW >= 1150) {
                document.body.classList.remove("is-mobile");
                scaler.style.transform = "none";
                return;
            }
            document.body.classList.add("is-mobile");
            const scale = Math.min(winW / 1120, winH / 650) * 0.92;
            scaler.style.transform = `scale(${scale})`;
        }

        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);
        window.addEventListener("DOMContentLoaded", autoFitScreen);
        window.addEventListener("DOMContentLoaded", loadPlayer);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
    </script>
