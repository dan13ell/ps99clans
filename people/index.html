    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";

        let playersData = [];
        let currentPage = 1;
        let totalPages = 1;
        const itemsPerPage = 99;
        let searchQuery = "";
        let searchTimeout = null;
        let requestCounter = 0; // ochrana proti out-of-order odpovědím při psaní

        function escapeHtml(str) {
            return String(str ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function showMessage(text, color = "white") {
            const grid = document.getElementById("playersGrid");
            grid.innerHTML = `<div style="grid-column: 1 / -1; width: 100%; text-align: center; padding: 100px 0; font-size: 28px; font-weight: 800; color: ${color}; -webkit-text-stroke: 4px black; paint-order: stroke fill;">${escapeHtml(text)}</div>`;
        }

        function formatNumber(num) {
            if (num === undefined || num === null) return "0";
            // od 100 výš bez desetin, ať se čísla vejdou do úzké karty (123.5m -> 124m)
            const fmt = (v, suffix) => (v >= 100 ? Math.round(v) : v.toFixed(1)) + suffix;
            if (num >= 1e9) return fmt(num / 1e9, "b");
            if (num >= 1e6) return fmt(num / 1e6, "m");
            if (num >= 1e3) return fmt(num / 1e3, "k");
            return num.toString();
        }

        async function loadAllAvatarsBatch(playersOnPage) {
            const userIds = playersOnPage.map(p => p.UserID).filter(id => id).join(",");
            if (!userIds) return;

            try {
                const response = await fetch(`${WORKER_URL}/roblox/avatars?userIds=${userIds}&size=150x150&format=Png&isCircular=false`);
                const json = await response.json();

                if (json && Array.isArray(json.data)) {
                    const avatarMap = {};
                    json.data.forEach(item => {
                        if (item && item.targetId && item.imageUrl) {
                            avatarMap[item.targetId] = item.imageUrl;
                        }
                    });

                    playersOnPage.forEach((player, index) => {
                        const imgElement = document.getElementById(`avatar-img-${player.UserID}-${index}`);
                        if (imgElement) {
                            imgElement.src = avatarMap[player.UserID] || "https://placehold.co/150x150/f0f4ff/1c1d22?text=Roblox";
                        }
                    });
                }
            } catch (err) {
                console.warn("Chyba při hromadném načítání avatarů:", err.message);
            }
        }

        async function fetchTopPlayers() {
            const overlay = document.getElementById("loadingOverlay");
            if (overlay) overlay.style.display = "flex";

            const myRequest = ++requestCounter;

            try {
                const res = await fetch(`${WORKER_URL}/api/top-war-players?page=${currentPage}&pageSize=${itemsPerPage}&search=${encodeURIComponent(searchQuery)}`);
                const json = await res.json();
                if (myRequest !== requestCounter) return; // mezitím přišel novější dotaz

                if (!json || json.status !== "ok") {
                    playersData = [];
                    totalPages = 1;
                    showMessage("API Error.", "#ff4a4a");
                    return;
                }

                totalPages = Math.max(1, json.totalPages || 1);

                const list = Array.isArray(json.data) ? json.data.slice() : [];

                // Hledání: přesný nick dáme na první místo, i když ho databáze ještě nezná podle jména
                if (searchQuery && currentPage === 1 && list.length > 0 &&
                    !list.some(p => (p.Username || "").toLowerCase() === searchQuery.toLowerCase())) {
                    const exact = await searchByRobloxName(searchQuery);
                    if (myRequest !== requestCounter) return;
                    if (exact && !list.some(p => p.UserID === exact.UserID)) list.unshift(exact);
                }

                if (list.length > 0) {
                    playersData = list;
                    renderGrid();
                    return;
                }

                // Nic v databázi: hráč může být mimo top 25 000 nebo mu ještě nemáme nick.
                // Zkusíme přesné vyhledání přes Roblox nick.
                if (searchQuery && currentPage === 1) {
                    const single = await searchByRobloxName(searchQuery);
                    if (myRequest !== requestCounter) return;
                    if (single) {
                        playersData = [single];
                        totalPages = 1;
                        renderGrid();
                        return;
                    }
                }

                playersData = [];
                totalPages = 1;
                document.getElementById("pageNumberDisplay").textContent = 1;
                showMessage(searchQuery ? "Player not found in top 25,000." : "No players yet.");
            } catch (err) {
                console.error(err);
                if (myRequest === requestCounter) showMessage("API Error.", "#ff4a4a");
            } finally {
                if (myRequest === requestCounter && overlay) overlay.style.display = "none";
            }
        }

        // Přesné hledání podle Roblox nicku (worker převede nick -> ID a vrátí pořadí v top 25 000)
        async function searchByRobloxName(name) {
            if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) return null;
            try {
                const res = await fetch(`${WORKER_URL}/api/player/search?name=${encodeURIComponent(name)}`);
                const json = await res.json();
                if (json && json.status === "ok" && json.found && json.player) {
                    const p = json.player;
                    return { UserID: p.userId, Username: p.username, Clan: p.clan, Points: p.points, Rank: p.rank };
                }
            } catch (e) {
                console.warn("Search fallback failed:", e.message);
            }
            return null;
        }

        function renderGrid() {
            const grid = document.getElementById("playersGrid");
            grid.innerHTML = "";

            if (playersData.length === 0) {
                showMessage("No players match search.");
                return;
            }

            playersData.forEach((player, index) => {
                // Skutečné pořadí z celé databáze (správně i při hledání), ne pozice na stránce
                const absoluteRank = player.Rank || (((currentPage - 1) * itemsPerPage) + index + 1);
                const card = document.createElement("div");
                card.className = "player-card";
                card.style.cursor = "pointer";
                card.addEventListener("click", () => {
                    location.href = `/people-detail/?id=${encodeURIComponent(player.UserID)}`;
                });

                const rankColor = (absoluteRank === 1) ? "#8AFCED" : "#FFFFFF";
                const rankClass = String(absoluteRank).length >= 5 ? "player-rank is-long" : "player-rank";
                const formattedPoints = formatNumber(player.Points);
                const imgId = `avatar-img-${player.UserID}-${index}`;
                const displayName = player.Username || `User ${player.UserID}`;

                card.innerHTML = `
                    <div class="${rankClass}" style="color: ${rankColor};">#${absoluteRank}</div>
                    <img class="player-avatar" id="${imgId}" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="" draggable="false">
                    <div class="player-userid" id="name-${player.UserID}-${index}" title="${escapeHtml(displayName)}">${escapeHtml(displayName)}</div>
                    <div class="player-clan-badge">${escapeHtml(player.Clan)}</div>
                    <div class="player-points-box">
                        <div class="points-icon"></div>
                        <div class="player-points">${formattedPoints}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            loadAllAvatarsBatch(playersData);
            fillMissingNames(playersData);
            fitAllNames();
            // až se načte font, šířky písma se změní, tak se nicky přizpůsobí znovu
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAllNames);

            document.getElementById("pageNumberDisplay").textContent = currentPage;
        }

        // Zmenšuje písmo nicku, dokud se nevejde celý (25px -> 12px), obrys se zmenšuje úměrně
        function fitName(el) {
            if (!el) return;
            let size = 25;
            const apply = () => {
                el.style.fontSize = size + "px";
                el.style.webkitTextStroke = Math.max(3, Math.round(size * 0.29)) + "px #000000";
            };
            apply();
            while (el.scrollWidth > el.clientWidth && size > 12) {
                size -= 1;
                apply();
            }
        }

        function fitAllNames() {
            document.querySelectorAll(".player-userid").forEach(fitName);
        }

        // Hráčům bez jména dotáhne nick přes worker (/roblox/users) a doplní ho do karet
        async function fillMissingNames(players) {
            const myRequest = requestCounter;
            const missing = players.map((p, i) => ({ p, i })).filter(x => !x.p.Username);
            if (missing.length === 0) return;

            for (let attempt = 0; attempt < 2; attempt++) {
                try {
                    const ids = missing.map(x => x.p.UserID).slice(0, 100);
                    const res = await fetch(`${WORKER_URL}/roblox/users`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ userIds: ids }),
                    });
                    const json = await res.json();
                    if (myRequest !== requestCounter) return; // stránka se mezitím změnila
                    const names = {};
                    (json.data || []).forEach(u => { if (u && u.id && u.name) names[u.id] = u.name; });

                    for (const x of missing) {
                        const name = names[x.p.UserID];
                        const el = document.getElementById(`name-${x.p.UserID}-${x.i}`);
                        if (name && el) {
                            x.p.Username = name;
                            el.textContent = name;
                            el.title = name;
                            fitName(el);
                        }
                    }
                    if (missing.every(x => x.p.Username)) return;
                } catch (err) {
                    console.warn("Doplnění jmen selhalo:", err.message);
                }
                await new Promise(r => setTimeout(r, 800));
            }
        }

        document.getElementById("playerSearch").addEventListener("input", (e) => {
            searchQuery = e.target.value.trim();
            currentPage = 1;

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetchTopPlayers();
            }, 300);
        });

        document.getElementById("prevPageBtn").addEventListener("click", (e) => {
            e.preventDefault();
            if (currentPage > 1) {
                currentPage--;
                fetchTopPlayers();
            }
        });

        document.getElementById("nextPageBtn").addEventListener("click", (e) => {
            e.preventDefault();
            if (currentPage < totalPages) {
                currentPage++;
                fetchTopPlayers();
            }
        });

        const footer = document.getElementById('leaderboardFooter');
        document.getElementById('prevPageBtn').addEventListener('mouseenter', () => footer.classList.add('hover-left'));
        document.getElementById('prevPageBtn').addEventListener('mouseleave', () => footer.classList.remove('hover-left'));
        document.getElementById('nextPageBtn').addEventListener('mouseenter', () => footer.classList.add('hover-right'));
        document.getElementById('nextPageBtn').addEventListener('mouseleave', () => footer.classList.remove('hover-right'));

        function autoFitScreen() {
            const scaler = document.getElementById("appScaler");
            if (!scaler) return;

            const winW = window.innerWidth;
            const winH = window.innerHeight;

            if (winW >= 1150) {
                document.body.classList.remove("is-mobile");
                scaler.style.transform = "none";
                return;
            }

            document.body.classList.add("is-mobile");
            const requiredW = 1120;
            const requiredH = 960; 

            const scaleX = winW / requiredW;
            const scaleY = winH / requiredH;

            const scale = Math.min(scaleX, scaleY) * 0.92;
            scaler.style.transform = `scale(${scale})`;
        }

        window.addEventListener("resize", autoFitScreen);
        window.addEventListener('DOMContentLoaded', autoFitScreen);
        window.addEventListener('DOMContentLoaded', fetchTopPlayers);
    </script>
