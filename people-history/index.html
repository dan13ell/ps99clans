<body>

    <div class="app-scaler" id="appScaler">
        <div class="game-window">
            <img class="menu-bg" src="/images/main-menu.png" draggable="false">

        <div class="menu-btn btn-topclans" onclick="location.href='/topclans/'"></div>

        <div class="menu-btn btn-search is-active" onclick="location.href='/people/'"></div>
        
        <img class="menu-text text-clans" src="/images/text-Clans.png" draggable="false">
        <img class="menu-text text-topclans" src="/images/text-Top-Clans.png" draggable="false">
        <img class="menu-text text-people" src="/images/leagues-text.png" draggable="false">
        <img class="menu-text text-search" src="/images/text-People.png" draggable="false">

            <div class="tab-content">
                <div class="custom-back-btn" id="backBtn" onclick="history.back()">
                    <img class="custom-back-text" src="/images/Back-text.png" draggable="false">
                </div>

                <div class="pd-center-msg" id="centerMsg">Loading war history...</div>

                <div class="ph-wrap" id="phContent">
                    <img class="ph-avatar" id="phAvatar" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="" draggable="false">
                    <div class="ph-name" id="phName" data-text="">&nbsp;</div>
                    <div class="ph-sub" id="phSub"></div>

                    <div class="ph-sum ph-sum-1 pd-card"><div class="ph-sum-label">BEST FINISH</div><div class="ph-sum-value pd-outline" id="sumBestV">N/A</div><div class="ph-sum-sub" id="sumBestS"></div></div>
                    <div class="ph-sum ph-sum-2 pd-card"><div class="ph-sum-label">LAST 5 WARS</div><div class="ph-sum-value pd-outline" id="sumRecentV">N/A</div><div class="ph-sum-sub" id="sumRecentS"></div></div>

                    <div class="ph-scroll" id="phScroll"></div>
                </div>

    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const $ = id => document.getElementById(id);
        const userId = parseInt(new URLSearchParams(location.search).get("id"), 10);

        function fullNumber(n) { return Number(n || 0).toLocaleString("en-US"); }
        function short2(v) {
            const f = (x, s) => x.toFixed(2).replace(/\.?0+$/, "") + s;
            if (v >= 1e9) return f(v / 1e9, "b");
            if (v >= 1e6) return f(v / 1e6, "m");
            if (v >= 1e3) return f(v / 1e3, "k");
            return String(Math.round(v));
        }
        function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
        // "HatchWarBattle2026" -> "Hatch War Battle 2026"
        function prettyBattle(n) { return String(n || "").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/([A-Za-z])(\d)/g, "$1 $2"); }
        const topPct = better => Math.max(0, 100 - better);
        const fmtPct = v => (v < 10 ? v.toFixed(2) : v.toFixed(1)).replace(/\.?0+$/, "");

        function showCenter(text, isError) {
            $("phContent").classList.remove("is-visible");
            const el = $("centerMsg");
            el.textContent = text;
            el.classList.toggle("is-error", !!isError);
            el.style.display = "block";
        }

        function fitWidth(el, maxPx, startPx, minPx, strokeRatio) {
            let size = startPx;
            const apply = () => {
                el.style.fontSize = size + "px";
                if (strokeRatio) el.style.webkitTextStroke = Math.max(3, Math.round(size * strokeRatio)) + "px #000000";
            };
            apply();
            while (el.offsetWidth > maxPx && size > minPx) { size -= 1; apply(); }
        }

        let currentName = "";
        function setName(name) {
            currentName = name;
            const el = $("phName");
            el.textContent = name;
            el.setAttribute("data-text", name);
            document.title = `${name} - War History - PS99 Clans`;
            fitWidth(el, 276, 38, 18, 0.15);
        }

        async function fetchAvatar(id) {
            try {
                const res = await fetch(`${WORKER_URL}/roblox/avatars?userIds=${id}&size=420x420&format=Png&isCircular=false`);
                const json = await res.json();
                const x = (json.data || []).find(v => v && Number(v.targetId) === id && v.imageUrl);
                if (x) $("phAvatar").src = x.imageUrl;
            } catch (e) { console.warn("Avatar se nepodařilo načíst:", e.message); }
        }

        async function loadMissingName(id) {
            try {
                const res = await fetch(`${WORKER_URL}/roblox/users`, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userIds: [id] }),
                });
                const json = await res.json();
                const u = (json.data || []).find(x => x && Number(x.id) === id && x.name);
                if (u) setName(u.name);
            } catch (e) { console.warn("Jméno se nepodařilo načíst:", e.message); }
        }

        function setSum(idV, idS, value, sub) {
            const v = $(idV);
            v.textContent = value == null ? "N/A" : value;
            v.classList.toggle("is-na", value == null);
            $(idS).textContent = sub || "";
        }

        function fillSummary(stats) {
            const b = stats.best, r = stats.last5;
            setSum("sumBestV", "sumBestS", b ? `#${fullNumber(b.rank)}` : null,
                b ? `${prettyBattle(b.battle)}` : "No finished war yet");
            setSum("sumRecentV", "sumRecentS", r && r.wars ? `#${fullNumber(Math.round(r.avgRank))}` : null,
                r && r.wars ? `avg place · top ${fmtPct(topPct(r.avgBetterThan))}%` : "");
        }

        function tierOf(b) {
            if (b.betterThan == null) return "";
            const top = topPct(b.betterThan);
            return top <= 1 ? "t1" : top <= 5 ? "t2" : top <= 25 ? "t3" : "";
        }

        function renderWars(battles) {
            const box = $("phScroll");
            box.innerHTML = battles.map(b => {
                const better = b.betterThan == null ? 0 : Math.min(100, b.betterThan);
                const flag = b.live ? "LIVE" : (b.current ? "LATEST" : "");
                return `<div class="ph-war${b.live ? " is-live" : ""}">
                    <div class="ph-medal ${tierOf(b)}">
                        <div class="ph-medal-num pd-outline" data-fit="90">#${fullNumber(b.rank)}</div>
                        <div class="ph-medal-of">${b.total ? "of " + fullNumber(b.total) : "&nbsp;"}</div>
                    </div>
                    <div class="ph-battle pd-outline" data-fit="330">${esc(prettyBattle(b.battle))}</div>
                    <div class="ph-clan">${esc(b.clan || "-")}</div>
                    ${flag ? `<div class="ph-flag${b.live ? "" : " is-latest"}" data-flag="1">${flag}</div>` : ""}
                    <div class="ph-pts"><img src="/images/stars.png" alt="" draggable="false"><span class="ph-pts-num pd-outline">${fullNumber(b.points)}</span></div>
                    <div class="ph-stand">
                        <div class="ph-stand-top pd-outline">${b.betterThan == null ? "-" : "Top " + fmtPct(topPct(better)) + "%"}</div>
                        <div class="ph-stand-label">${b.live ? "STANDING SO FAR" : "STANDING"}</div>
                        <div class="ph-stand-bar"><i style="width:${better.toFixed(1)}%"></i><b style="left:${better.toFixed(1)}%"></b></div>
                    </div>
                </div>`;
            }).join("");
            box.querySelectorAll("[data-fit]").forEach(el => fitWidth(el, +el.dataset.fit, parseFloat(getComputedStyle(el).fontSize), 12, 0.24));
            // štítek LIVE / LATEST hned za klanem
            box.querySelectorAll(".ph-war").forEach(row => {
                const clan = row.querySelector(".ph-clan"), flag = row.querySelector("[data-flag]");
                if (clan && flag) flag.style.left = (136 + clan.offsetWidth + 8) + "px";
            });
        }

        let allBattles = [];
        async function loadHistory() {
            if (!userId) { showCenter("Player not found."); return; }
            $("backBtn").onclick = () => { location.href = `/people-detail/?id=${encodeURIComponent(userId)}`; };
            try {
                const res = await fetch(`${WORKER_URL}/api/player/${userId}/history`);
                const json = await res.json();
                if (!json || json.status !== "ok") { showCenter("API Error.", true); return; }
                if (!json.found || !json.battles.length) {
                    showCenter("No war history for this player yet.");
                    return;
                }
                $("centerMsg").style.display = "none";
                $("phContent").classList.add("is-visible");

                const p = json.player;
                setName(p.username || `User ${p.userId}`);
                if (!p.username) loadMissingName(p.userId);
                fetchAvatar(p.userId);
                const n = json.stats.wars;
                $("phSub").innerHTML = `<b>${n}</b> ${n === 1 ? "war" : "wars"} &middot; ID ${esc(p.userId)}`;
                fillSummary(json.stats);
                allBattles = json.battles;
                renderWars(allBattles);
            } catch (err) {
                console.error(err);
                showCenter("API Error.", true);
            }
        }

        function autoFitScreen() {
            const scaler = $("appScaler");
            if (!scaler) return;
            const winW = window.innerWidth, winH = window.innerHeight;
            if (winW >= 1150) { document.body.classList.remove("is-mobile"); scaler.style.transform = "none"; return; }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 960) * 0.92})`;
        }

        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);
        window.addEventListener("DOMContentLoaded", autoFitScreen);
        window.addEventListener("DOMContentLoaded", loadHistory);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (currentName) setName(currentName); if (allBattles.length) renderWars(allBattles); });
    </script>
