    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==";
        const PER_PAGE = 5;
        const $ = id => document.getElementById(id);
        const userId = parseInt(new URLSearchParams(location.search).get("id"), 10);

        function fullNumber(n) { return Number(n || 0).toLocaleString("en-US"); }
        function short2(v) {
            const f = (x, s) => x.toFixed(2).replace(/\.?0+$/, "") + s;
            if (v >= 1e9) return f(v / 1e9, "b");
            if (v >= 1e6) return f(v / 1e6, "m");
            if (v >= 1e3) return f(v / 1e3, "k");
            return String(Math.round(v));
        }
        function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
        // "HatchWarBattle2026" -> "Hatch War Battle 2026"
        function prettyBattle(n) { return String(n || "").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/([A-Za-z])(\d)/g, "$1 $2"); }
        const topPct = better => Math.max(0, 100 - better);

        function showCenter(text, isError) {
            $("phContent").classList.remove("is-visible");
            const el = $("centerMsg");
            el.textContent = text;
            el.classList.toggle("is-error", !!isError);
            el.style.display = "block";
        }

        function fitWidth(el, maxPx, startPx, minPx, strokeRatio) {
            let size = startPx;
            const apply = () => {
                el.style.fontSize = size + "px";
                if (strokeRatio) el.style.webkitTextStroke = Math.max(3, Math.round(size * strokeRatio)) + "px #000000";
            };
            apply();
            while (el.offsetWidth > maxPx && size > minPx) { size -= 1; apply(); }
        }

        let currentName = "";
        function setName(name) {
            currentName = name;
            const el = $("phName");
            el.textContent = name;
            el.setAttribute("data-text", name);
            document.title = `${name} - War History - PS99 Clans`;
            fitWidth(el, 440, 38, 20, 0.15);
        }

        async function fetchAvatar(id) {
            try {
                const res = await fetch(`${WORKER_URL}/roblox/avatars?userIds=${id}&size=420x420&format=Png&isCircular=false`);
                const json = await res.json();
                const x = (json.data || []).find(v => v && Number(v.targetId) === id && v.imageUrl);
                if (x) $("phAvatar").src = x.imageUrl;
            } catch (e) { console.warn("Avatar se nepodařilo načíst:", e.message); }
        }

        async function loadMissingName(id) {
            try {
                const res = await fetch(`${WORKER_URL}/roblox/users`, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userIds: [id] }),
                });
                const json = await res.json();
                const u = (json.data || []).find(x => x && Number(x.id) === id && x.name);
                if (u) setName(u.name);
            } catch (e) { console.warn("Jméno se nepodařilo načíst:", e.message); }
        }

        function setStat(idV, idS, value, sub) {
            const v = $(idV);
            v.textContent = value == null ? "N/A" : value;
            v.classList.toggle("is-na", value == null);
            $(idS).textContent = sub || "";
        }

        function fillStats(stats) {
            const b = stats.best;
            setStat("stBestV", "stBestS", b ? `#${fullNumber(b.rank)}` : null,
                b ? `of ${fullNumber(b.total)} · ${prettyBattle(b.battle)}` : "No finished war yet");
            const r = stats.last5, a = stats.overall;
            setStat("stRecentV", "stRecentS", r.wars ? `#${fullNumber(Math.round(r.avgRank))}` : null,
                r.wars ? `avg place · top ${topPct(r.avgBetterThan).toFixed(1)}%` : "");
            setStat("stAllV", "stAllS", a.wars ? `#${fullNumber(Math.round(a.avgRank))}` : null,
                a.wars ? `avg place · top ${topPct(a.avgBetterThan).toFixed(1)}%` : "");
        }

        let battles = [], page = 1;

        function renderPage() {
            const pages = Math.max(1, Math.ceil(battles.length / PER_PAGE));
            page = Math.min(Math.max(1, page), pages);
            const slice = battles.slice((page - 1) * PER_PAGE, page * PER_PAGE);
            $("phRows").innerHTML = slice.map(b => {
                const better = b.betterThan == null ? 0 : b.betterThan;
                const flag = b.live ? `<div class="ph-flag">LIVE</div>` : (b.current ? `<div class="ph-flag is-latest">LATEST</div>` : "");
                return `<div class="ph-row${b.live ? " is-live" : ""}">
                    <div class="ph-battle pd-outline" data-fit="1">${esc(prettyBattle(b.battle))}</div>
                    <div class="ph-clan">${esc(b.clan || "-")}</div>${flag}
                    <div class="ph-pts"><img src="/images/stars.png" alt="" draggable="false"><span class="ph-pts-num pd-outline">${short2(b.points)}</span></div>
                    <div class="ph-rank"><div class="ph-rank-num">#${fullNumber(b.rank)}</div><div class="ph-rank-total">${b.total ? "of " + fullNumber(b.total) : ""}</div></div>
                    <div class="ph-bar"><i style="width:${Math.min(100, better).toFixed(1)}%"></i></div>
                    <div class="ph-top"><div class="ph-top-num">${b.betterThan == null ? "-" : "Top " + topPct(better).toFixed(1) + "%"}</div><div class="ph-top-sub">${b.live ? "so far" : ""}</div></div>
                </div>`;
            }).join("");
            document.querySelectorAll("#phRows [data-fit]").forEach(el => fitWidth(el, 214, 19, 11, 0.26));
            $("pgText").textContent = `PAGE ${page} / ${pages}`;
            $("pgPrev").classList.toggle("is-off", page <= 1);
            $("pgNext").classList.toggle("is-off", page >= pages);
        }

        async function loadHistory() {
            if (!userId) { showCenter("Player not found."); return; }
            $("backBtn").onclick = () => { location.href = `/people-detail/?id=${encodeURIComponent(userId)}`; };
            try {
                const res = await fetch(`${WORKER_URL}/api/player/${userId}/history`);
                const json = await res.json();
                if (!json || json.status !== "ok") { showCenter("API Error.", true); return; }
                if (!json.found || !json.battles.length) {
                    showCenter("No war history for this player yet. Results appear here once a clan war has finished.");
                    return;
                }
                $("centerMsg").style.display = "none";
                $("phContent").classList.add("is-visible");

                const p = json.player;
                setName(p.username || `User ${p.userId}`);
                if (!p.username) loadMissingName(p.userId);
                fetchAvatar(p.userId);
                $("phSub").innerHTML = `Clan war results &middot; ID <b>${esc(p.userId)}</b>`;
                $("phCount").textContent = String(json.stats.wars);
                fillStats(json.stats);
                battles = json.battles;
                renderPage();
            } catch (err) {
                console.error(err);
                showCenter("API Error.", true);
            }
        }

        $("pgPrev").onclick = () => { page--; renderPage(); };
        $("pgNext").onclick = () => { page++; renderPage(); };

        function autoFitScreen() {
            const scaler = $("appScaler");
            if (!scaler) return;
            const winW = window.innerWidth, winH = window.innerHeight;
            if (winW >= 1150) { document.body.classList.remove("is-mobile"); scaler.style.transform = "none"; return; }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 960) * 0.92})`;
        }

        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);
        window.addEventListener("DOMContentLoaded", autoFitScreen);
        window.addEventListener("DOMContentLoaded", loadHistory);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (currentName) setName(currentName); if (battles.length) renderPage(); });
    </script>
