<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>PS99 Clans - OBS Overlay</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <script>
        // odometer.js stejně jako live stránka (2.5 s, slide); instance si stránka vytváří sama
        window.odometerOptions = { auto: false, duration: 2500, animation: 'slide' };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Roboto:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.7/themes/odometer-theme-minimal.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.7/odometer.min.js"></script>

    <style>
        /* =====================================================================
           PS99 Clans – OBS overlay. Pozadí je průhledné, vše se nastavuje v URL.
           Generátor odkazu a návod: /overlays/
           Pozn.: OBS používá starší Chromium -> žádné color-mix(), barvy přes rgba(var(--acc-rgb), a)
           ===================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: transparent !important; overflow: hidden; }
        body { font-family: 'Fredoka', sans-serif; font-weight: 600; -webkit-font-smoothing: antialiased; user-select: none; }

        :root {
            --accent: #48D2F7; --acc-rgb: 72, 210, 247;
            --accent2: #FF4F86; --acc2-rgb: 255, 79, 134;
            --card-bg: #FFFFFF;
            --card-border: #000000;
            --border-w: 4px;
            --radius: 18px;
            --text: #1C2130;
            --muted: #8E9099;
            --soft: #F1F4FA;
            --shadow: 0 6px 0 rgba(0, 0, 0, 0.18), 0 10px 24px rgba(0, 0, 0, 0.25);
            --num-filter: none;
            --track: #E6E9F0;
            --star-filter: none;
        }

        /* ---------- DARK: plná černá, bez přechodu ---------- */
        body.t-dark {
            --card-bg: #0D0E12;
            --card-border: #000000;
            --text: #FFFFFF;
            --muted: #8B93A7;
            --soft: #1A1C23;
            --track: #23262F;
            --shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.45);
            --star-filter: brightness(0) invert(1);
        }
        body.t-dark .card { box-shadow: var(--shadow), inset 0 0 0 2px #22252E; }

        /* ---------- GLASS (původní vzhled) ---------- */
        body.t-glass {
            --card-bg: rgba(255, 255, 255, 0.14);
            --card-border: rgba(255, 255, 255, 0.45);
            --border-w: 2px;
            --text: #FFFFFF;
            --muted: rgba(255, 255, 255, 0.80);
            --soft: rgba(255, 255, 255, 0.14);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
            --num-filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
            --track: rgba(255, 255, 255, 0.22);
            --star-filter: brightness(0) invert(1) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
        }
        body.t-glass .card { -webkit-backdrop-filter: blur(5px) saturate(1.2); backdrop-filter: blur(5px) saturate(1.2); }
        body.t-glass .name, body.t-glass .label, body.t-glass .top-title, body.t-glass .top-sub, body.t-glass .goal-title,
        body.t-glass .timer-name, body.t-glass .vs-lead, body.t-glass .of { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.55)); }

        /* ---------- NEON: čistá záře v barvě akcentu ---------- */
        body.t-neon {
            --card-bg: rgba(6, 8, 18, 0.92);
            --card-border: var(--accent);
            --border-w: 2px;
            --text: #FFFFFF;
            --muted: #A9B3CC;
            --soft: rgba(255, 255, 255, 0.06);
            --track: rgba(255, 255, 255, 0.10);
            --num-filter: drop-shadow(0 0 6px rgba(var(--acc-rgb), 0.85));
            --star-filter: brightness(0) invert(1) drop-shadow(0 0 4px rgba(var(--acc-rgb), 0.9));
        }
        body.t-neon .card {
            box-shadow: 0 0 0 1px rgba(var(--acc-rgb), 0.35), 0 0 14px rgba(var(--acc-rgb), 0.55), 0 0 36px rgba(var(--acc-rgb), 0.22), inset 0 0 22px rgba(var(--acc-rgb), 0.14);
        }
        body.t-neon .name, body.t-neon .top-title, body.t-neon .goal-title, body.t-neon .timer-name { color: #FFFFFF; filter: drop-shadow(0 0 5px rgba(var(--acc-rgb), 0.7)); }

        /* ---------- TEXT ONLY: jen text s černým obrysem jako ve hře ---------- */
        body.t-minimal {
            --card-bg: transparent;
            --card-border: transparent;
            --border-w: 0px;
            --text: #FFFFFF;
            --muted: #FFFFFF;
            --soft: rgba(0, 0, 0, 0.28);
            --shadow: none;
            --track: rgba(0, 0, 0, 0.35);
            --star-filter: brightness(0) invert(1) drop-shadow(1.5px 0 0 #000) drop-shadow(-1.5px 0 0 #000) drop-shadow(0 1.5px 0 #000) drop-shadow(0 -1.5px 0 #000);
        }
        /* obrys celého textu najednou (filter) -> u odometru se neusekne za každou číslicí */
        body.t-minimal .card { box-shadow: none; }
        body.t-minimal .name, body.t-minimal .num, body.t-minimal .label, body.t-minimal .top-title, body.t-minimal .top-sub,
        body.t-minimal .goal-title, body.t-minimal .of, body.t-minimal .vs-lead, body.t-minimal .timer-name, body.t-minimal .timer-val,
        body.t-minimal .timer-foot, body.t-minimal .goal-pct, body.t-minimal .err-card {
            filter: drop-shadow(2.5px 0 0 #000) drop-shadow(-2.5px 0 0 #000) drop-shadow(0 2.5px 0 #000) drop-shadow(0 -2.5px 0 #000) drop-shadow(0 3px 2px rgba(0, 0, 0, 0.35));
        }
        body.t-minimal .label, body.t-minimal .top-sub, body.t-minimal .timer-foot, body.t-minimal .of {
            filter: drop-shadow(1.6px 0 0 #000) drop-shadow(-1.6px 0 0 #000) drop-shadow(0 1.6px 0 #000) drop-shadow(0 -1.6px 0 #000);
        }
        body.t-minimal .row .name { padding: 3px 0; }
        body.t-minimal { --star-filter: brightness(0) invert(1); }

        /* ---------- kotva + zvětšení ---------- */
        #stage { position: absolute; top: 0; left: 0; padding: 54px 16px 16px; transform-origin: top left; }
        body.a-center #stage { left: 50%; transform-origin: top center; }
        body.a-right #stage { left: auto; right: 0; transform-origin: top right; }

        .card {
            position: relative;
            background: var(--card-bg);
            border: var(--border-w) solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            color: var(--text);
        }

        .num, .num * { font-family: 'Roboto', sans-serif !important; font-weight: 600 !important; }
        .num { color: var(--text); white-space: nowrap; line-height: 1.15; filter: var(--num-filter); }
        .num .odometer { vertical-align: top; }
        .name { font-weight: 700; white-space: nowrap; line-height: 1.1; }
        .label { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; color: var(--muted); white-space: nowrap; }
        .star { width: 20px; height: 20px; filter: var(--star-filter); }

        .clan-icon { display: block; border-radius: 50%; border: 3px solid #000; background: #FFFFFF; object-fit: cover; }
        .flag { position: absolute; right: -2px; bottom: -2px; border-radius: 50%; border: 3px solid #000; background: #FFF; object-fit: cover; }
        .rank-pill {
            display: inline-flex; align-items: center; padding: 1px 11px; border-radius: 13px; border: 3px solid #000;
            background: #FFFFFF; color: #1C2130; font-size: 18px; font-weight: 800; white-space: nowrap; line-height: 1.25;
        }
        .rank-pill.gold   { background: linear-gradient(#FFE873, #FFB21E); }
        .rank-pill.silver { background: linear-gradient(#F4F6FA, #BFC6D4); }
        .rank-pill.bronze { background: linear-gradient(#FFC48A, #E4893A); }
        .rank-pill.bump { animation: bump 0.9s cubic-bezier(0.2, 1.4, 0.4, 1); }
        @keyframes bump { 0% { transform: scale(1); } 25% { transform: scale(1.28); } 100% { transform: scale(1); } }

        /* ---------- vyskakující +body: každá bublina je samostatná, nic se neusekne ---------- */
        .gain-layer { position: absolute; z-index: 6; pointer-events: none; width: 0; height: 0; }
        .gain {
            position: absolute; left: 0; bottom: 0;
            font-size: 28px;
            font-weight: 800;
            color: #7CFF5B;
            -webkit-text-stroke: 6px #000;
            paint-order: stroke fill;
            stroke-linejoin: round;
            white-space: nowrap;
            letter-spacing: 0.5px;
            transform-origin: 50% 100%;
            filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.35));
            animation: gainUp 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity;
        }
        .gain::after {                 /* lesk na textu */
            content: attr(data-t);
            position: absolute; left: 0; top: 0;
            -webkit-text-stroke: 0;
            background: linear-gradient(180deg, #E4FFD6 0%, #9BFF73 45%, #3FD12F 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        @keyframes gainUp {
            0%   { opacity: 0; transform: translate(-50%, 14px) scale(0.3) rotate(-8deg); }
            14%  { opacity: 1; transform: translate(-50%, -4px) scale(1.22) rotate(3deg); }
            24%  { transform: translate(-50%, -2px) scale(1) rotate(0deg); }
            70%  { opacity: 1; transform: translate(-50%, -22px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -34px) scale(0.85); }
        }

        body.anim .card { animation: popIn 0.55s cubic-bezier(0.2, 1.3, 0.4, 1) both; }
        @keyframes popIn { 0% { opacity: 0; transform: translateY(14px) scale(0.92); } 100% { opacity: 1; transform: none; } }

        .hidden { display: none !important; }

        /* ================= CLAN ================= */
        .w-clan { display: flex; align-items: center; gap: 18px; padding: 16px 26px 16px 18px; min-width: 440px; }
        .icon-wrap { position: relative; flex: 0 0 auto; }
        .w-clan .clan-icon { width: 104px; height: 104px; }
        .w-clan .flag { width: 34px; height: 34px; }
        .info { display: flex; flex-direction: column; min-width: 0; }
        .top-row { display: flex; align-items: center; gap: 10px; }
        .w-clan .name { font-size: 32px; }
        .w-clan .num { font-size: 54px; margin-top: 2px; }
        .sub { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
        .rate { color: #2DB84B; font-weight: 800; }
        body.t-dark .rate, body.t-glass .rate, body.t-neon .rate, body.t-minimal .rate { color: #7CFF5B; }
        .w-clan .gain-layer { right: 70px; top: 12px; }

        /* ================= PLAYER ================= */
        .w-player { display: flex; align-items: center; gap: 18px; padding: 16px 26px 16px 18px; min-width: 440px; }
        .avatar { width: 104px; height: 104px; border-radius: 50%; border: 3px solid #000; background: #E9EDF5; object-fit: cover; display: block; }
        .w-player .name { font-size: 30px; }
        .w-player .num { font-size: 54px; margin-top: 2px; }
        .p-clan {
            display: inline-flex; align-items: center; padding: 1px 10px; border-radius: 12px; border: 3px solid #000;
            background: var(--accent); color: #FFF; font-size: 16px; font-weight: 800; white-space: nowrap;
            -webkit-text-stroke: 4px #000; paint-order: stroke fill;
        }
        .w-player .gain-layer { right: 70px; top: 12px; }

        /* ================= VERSUS ================= */
        .w-vs { width: 860px; padding: 16px 20px 16px; }
        .vs-row { display: flex; align-items: center; gap: 12px; }
        .vs-side { flex: 1 1 0; display: flex; align-items: center; gap: 14px; min-width: 0; position: relative; }
        .vs-side.b { flex-direction: row-reverse; text-align: right; }
        .vs-side .clan-icon { width: 78px; height: 78px; }
        .vs-side .flag { width: 28px; height: 28px; }
        .vs-side .txt { display: flex; flex-direction: column; min-width: 0; }
        .vs-side.b .txt { align-items: flex-end; }
        .vs-side .name { font-size: 26px; display: flex; align-items: center; gap: 8px; }
        .vs-side.b .name { flex-direction: row-reverse; }
        .vs-side .num { font-size: 36px; }
        .vs-side.a .gain-layer { left: 190px; top: 4px; }
        .vs-side.b .gain-layer { right: 190px; top: 4px; }
        .vs-mid { flex: 0 0 auto; width: 70px; height: 70px; border-radius: 50%; border: 4px solid #000; background: #FFF; display: flex; align-items: center; justify-content: center; -webkit-text-stroke: 0 !important; }
        .vs-mid span { position: relative; font-size: 30px; font-weight: 800; color: #000; -webkit-text-stroke: 5px #000; paint-order: stroke fill; }
        .vs-mid span::after {
            content: "VS"; position: absolute; left: 0; top: 0; -webkit-text-stroke: 0;
            background: linear-gradient(#FFE873, #FFB21E); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .tug { position: relative; height: 26px; margin-top: 14px; border-radius: 13px; border: 3px solid #000; background: var(--accent2); overflow: hidden; }
        .tug-a { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: var(--accent); border-right: 3px solid #000; transition: width 1.4s cubic-bezier(0.2, 0.9, 0.2, 1); }
        .tug-l { position: absolute; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: 800; color: #FFF; -webkit-text-stroke: 4px #000; paint-order: stroke fill; }
        .tug-l.a { left: 10px; } .tug-l.b { right: 10px; }
        .vs-foot { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
        .vs-diff { font-size: 26px; }
        .vs-lead { font-size: 18px; font-weight: 700; color: var(--muted); white-space: nowrap; }
        .vs-lead b { font-weight: 800; }

        /* ================= TOP ================= */
        .w-top { width: 460px; padding: 12px 12px 10px; }
        .top-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 6px 8px; }
        .top-title { font-size: 22px; font-weight: 800; color: var(--text); white-space: nowrap; }
        .top-sub { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-list { position: relative; transition: height 0.6s ease; }
        .row {
            position: absolute; left: 0; right: 0; height: 52px;
            display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px;
            border-radius: 12px; background: var(--soft);
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.3, 1), opacity 0.45s, background 0.4s, box-shadow 0.4s;
        }
        .row.off { opacity: 0 !important; visibility: hidden; }
        .row.me { box-shadow: inset 0 0 0 3px var(--accent); background: rgba(var(--acc-rgb), 0.18); }
        body.t-neon .row.me { box-shadow: inset 0 0 0 2px var(--accent), 0 0 12px rgba(var(--acc-rgb), 0.5); }
        .row.lift { z-index: 5; box-shadow: 0 12px 22px rgba(0, 0, 0, 0.35), inset 0 0 0 3px #6BF06B; }
        .row.sink { z-index: 1; opacity: 0.8; }
        .row.up { animation: rowUp 1.4s ease-out; }
        @keyframes rowUp { 0% { background: rgba(107, 240, 107, 0.6); } 100% { } }
        .row-rank {
            flex: 0 0 auto; min-width: 42px; height: 34px; padding: 0 7px; border-radius: 10px; border: 3px solid #000;
            background: #FFF; color: #1C2130; font-size: 17px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
        }
        .row-rank.gold   { background: linear-gradient(#FFE873, #FFB21E); }
        .row-rank.silver { background: linear-gradient(#F4F6FA, #BFC6D4); }
        .row-rank.bronze { background: linear-gradient(#FFC48A, #E4893A); }
        .row .clan-icon { width: 38px; height: 38px; border-width: 2px; }
        .row .flag { width: 18px; height: 18px; border-width: 2px; right: -4px; bottom: -3px; }
        .row .name { font-size: 20px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .row .num { font-size: 22px; }

        /* ================= TIMER ================= */
        .w-timer { width: 460px; padding: 14px 22px 16px; text-align: center; }
        .timer-head { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .live-dot { width: 12px; height: 12px; border-radius: 50%; background: #2ECC40; border: 2px solid #000; animation: pulse 1.4s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .timer-name { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .timer-val { font-size: 50px; margin-top: 2px; }
        .timer-val .u { font-size: 0.5em; color: var(--muted); margin: 0 6px 0 1px; font-family: 'Fredoka', sans-serif !important; font-weight: 700 !important; }
        .timer-foot { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; }

        .bar { position: relative; height: 22px; margin-top: 8px; border-radius: 11px; border: 3px solid #000; background: var(--track); overflow: hidden; }
        .bar-fill {
            position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
            background: var(--accent);
            border-right: 3px solid #000;
            transition: width 1.2s cubic-bezier(0.2, 0.9, 0.2, 1);
            overflow: hidden;
        }
        .bar-fill.full { border-right: none; }
        .bar-stripes {
            position: absolute; top: 0; bottom: 0; left: -28px; right: 0;
            background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.25) 0 10px, transparent 10px 20px);
            animation: stripes 1s linear infinite;
        }
        @keyframes stripes { from { transform: translateX(0); } to { transform: translateX(28.28px); } }

        /* ================= GOAL ================= */
        .w-goal { width: 600px; padding: 14px 20px 16px; }
        .goal-top { display: flex; align-items: center; gap: 14px; }
        .goal-top .clan-icon { width: 66px; height: 66px; }
        .goal-top .flag { width: 24px; height: 24px; }
        .goal-txt { flex: 1 1 auto; min-width: 0; }
        .goal-title { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .goal-nums { display: flex; align-items: baseline; gap: 8px; }
        .goal-nums .num { font-size: 34px; }
        .goal-nums .of { font-size: 20px; font-weight: 700; color: var(--muted); white-space: nowrap; }
        .goal-pct { flex: 0 0 auto; font-size: 34px; }
        .w-goal .bar { height: 28px; border-radius: 14px; margin-top: 10px; }
        .w-goal .gain-layer { right: 150px; top: 12px; }
        /* splněný cíl: zlatý pruh s odleskem, konfety a odznak */
        .w-goal.done .bar-fill { background: linear-gradient(180deg, #FFE873 0%, #FFB21E 100%); }
        .w-goal.done .bar-fill::after {
            content: ""; position: absolute; top: 0; bottom: 0; width: 60px; left: -80px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
            animation: sweep 2.4s ease-in-out infinite;
        }
        @keyframes sweep { 0% { left: -80px; } 60%, 100% { left: 100%; } }
        .w-goal.done .goal-pct { color: #FFB21E; }
        .goal-done {
            position: absolute; right: 18px; top: -20px; z-index: 5;
            padding: 3px 14px; border-radius: 14px; border: 3px solid #000;
            background: linear-gradient(#FFE873, #FFB21E);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.5);
            font-size: 17px; font-weight: 800; color: #FFF; -webkit-text-stroke: 4px #000; paint-order: stroke fill;
            animation: badgeIn 0.9s cubic-bezier(0.2, 1.5, 0.4, 1) both, badgeFloat 2.6s ease-in-out 0.9s infinite;
        }
        @keyframes badgeIn { 0% { transform: scale(0) rotate(-25deg); } 60% { transform: scale(1.25) rotate(6deg); } 100% { transform: scale(1) rotate(-3deg); } }
        @keyframes badgeFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
        .w-goal.celebrate { animation: celebrate 0.9s ease-out; }
        @keyframes celebrate { 0% { transform: scale(1); } 30% { transform: scale(1.045); } 100% { transform: scale(1); } }
        .confetti { position: absolute; left: 50%; top: 50%; width: 10px; height: 14px; border: 2px solid #000; border-radius: 3px; z-index: 7; pointer-events: none; animation: confetti 1.6s cubic-bezier(0.15, 0.7, 0.3, 1) forwards; }
        @keyframes confetti {
            0% { transform: translate(-50%, -50%) rotate(0); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); opacity: 0; }
        }

        .err-card { padding: 12px 18px; font-size: 18px; font-weight: 700; color: #FF4A4A; }
    </style>
</head>
<body class="t-ps99">
    <div id="stage"></div>

    <script>
    (function () {
        "use strict";
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const P = new URLSearchParams(location.search);

        // ---------- nastavení z URL ----------
        const W = (P.get("w") || "clan").toLowerCase();                 // clan | player | versus | top | goal | timer
        const TAG = (P.get("clan") || "").trim().toUpperCase().slice(0, 4);
        const TAG2 = (P.get("vs") || "").trim().toUpperCase().slice(0, 4);
        const PLAYER = parseInt(P.get("player"), 10) || 0;
        const PNAME = (P.get("pname") || "").replace(/[^A-Za-z0-9_]/g, "").slice(0, 20);
        const THEME = (P.get("theme") || "ps99").toLowerCase();
        const hex = (v, d) => /^[0-9a-f]{6}$/i.test(v || "") ? "#" + v.toUpperCase() : d;
        const ROWS = Math.max(3, Math.min(10, parseInt(P.get("rows"), 10) || 5));
        const HIDE = new Set((P.get("hide") || "").toLowerCase().split(",").filter(Boolean));   // icon,flag,rank,gain,rate,title,anim
        const LABEL = (P.get("label") || "").slice(0, 40);
        const GOAL = parseAmount(P.get("goal"));
        const DEMO = P.has("demo");

        // ---------- časování (stejný princip jako live stránka) ----------
        const POLL_MS = DEMO ? 4000 : 15000;
        const STEP_MS = DEMO ? 3500 : 15000;
        const STEPS = 4;
        const TOP_POLL_MS = DEMO ? 4000 : 20000;
        const BATTLE_MS = 300000;

        const stage = document.getElementById("stage");
        // vzhled se dá změnit i bez znovunačtení (používá náhled na /overlays/)
        function applyStyle(o) {
            const theme = ["ps99", "dark", "glass", "neon", "minimal"].includes(o.theme) ? o.theme : "ps99";
            const align = o.align === "center" || o.align === "right" ? o.align : "left";
            document.body.className = "t-" + theme + (align !== "left" ? " a-" + align : "") + (o.anim === false ? "" : " anim");
            const a = hex(o.accent, "#48D2F7"), b = hex(o.accent2, "#FF4F86");
            const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(", ");
            const r = document.documentElement.style;
            r.setProperty("--accent", a); r.setProperty("--acc-rgb", rgb(a));
            r.setProperty("--accent2", b); r.setProperty("--acc2-rgb", rgb(b));
            const sc = Math.max(0.3, Math.min(3, parseFloat(o.scale) || 1));
            stage.style.transform = (align === "center" ? "translateX(-50%) " : "") + `scale(${sc})`;
        }
        window.applyStyle = applyStyle;
        applyStyle({ theme: THEME, align: (P.get("align") || "left").toLowerCase(), anim: !HIDE.has("anim"), accent: P.get("accent"), accent2: P.get("accent2"), scale: P.get("scale") });
        let firstAnimDone = false;
        setTimeout(() => { firstAnimDone = true; }, 1200);

        // ---------- pomocné ----------
        function parseAmount(v) {
            if (!v) return 0;
            const m = String(v).trim().toLowerCase().replace(/,/g, "").match(/^([\d.]+)\s*([kmbt]?)$/);
            if (!m) return 0;
            return Math.round(parseFloat(m[1]) * { "": 1, k: 1e3, m: 1e6, b: 1e9, t: 1e12 }[m[2]]) || 0;
        }
        function short(v) {
            const a = Math.abs(v), f = (x, s) => parseFloat(x.toFixed(x >= 100 ? 0 : x >= 10 ? 1 : 2)) + s;
            if (a >= 1e12) return f(v / 1e12, "t");
            if (a >= 1e9) return f(v / 1e9, "b");
            if (a >= 1e6) return f(v / 1e6, "m");
            if (a >= 1e3) return f(v / 1e3, "k");
            return String(Math.round(v));
        }
        const full = (v) => Math.round(v).toLocaleString("en-US");
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        function flagUrl(cc) {
            if (!cc || cc.length !== 2) return "";
            const cp = cc.toUpperCase().split("").map((c) => 0x1F1E6 + c.charCodeAt(0) - 65);
            return `https://twemoji.maxcdn.com/v/14.0.2/svg/${cp[0].toString(16)}-${cp[1].toString(16)}.svg`;
        }
        function iconUrl(icon) {
            const id = (icon || "").replace("rbxassetid://", "").trim();
            return id ? `https://ps99.biggamesapi.io/image/${id}` : "";
        }
        const FALLBACK_ICON = "/images/hotbar/clans.png";
        const prettyBattle = (n) => (n || "").replace(/([a-z])([A-Z0-9])/g, "$1 $2").replace(/([0-9])([A-Z])/g, "$1 $2").trim();
        const rankClass = (p) => (p === 1 ? "gold" : p === 2 ? "silver" : p === 3 ? "bronze" : "");
        function iconHtml(d) {
            const ic = HIDE.has("icon") ? "" : `<img class="clan-icon" src="${esc(d && d.icon ? d.icon : FALLBACK_ICON)}" onerror="this.onerror=null;this.src='${FALLBACK_ICON}'" alt="">`;
            const fl = HIDE.has("flag") || !d || !d.flag ? "" : `<img class="flag" src="${esc(d.flag)}" onerror="this.remove()" alt="">`;
            return ic ? `<div class="icon-wrap">${ic}${fl}</div>` : "";
        }
        function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
        // nová samostatná bublina (víc bublin se může překrývat, žádná se neusekne)
        function popGain(layer, delta) {
            if (!layer || delta <= 0 || !firstAnimDone) return;
            const g = document.createElement("div");
            g.className = "gain";
            g.textContent = "+" + short(delta);
            g.dataset.t = g.textContent;
            layer.appendChild(g);
            g.addEventListener("animationend", () => g.remove());
            while (layer.children.length > 3) layer.firstChild.remove();
        }

        // ---------- odometer (odometer.js jako live stránka, jinak jen text) ----------
        class Odo {
            constructor(el) { this.el = el; this.inst = null; this.value = null; }
            set(v, animate = true) {
                v = Math.max(0, Math.round(v || 0));
                if (typeof window.Odometer !== "function") { this.el.textContent = full(v); this.value = v; return; }
                if (!this.inst || !animate) {
                    if (this.inst && this.value === v) return;
                    const fresh = document.createElement("span");
                    this.el.replaceWith(fresh);
                    this.el = fresh;
                    this.inst = new window.Odometer({ el: fresh, value: v, format: "(,ddd)", theme: "minimal", duration: 2500, animation: "slide" });
                    this.value = v;
                    return;
                }
                if (v !== this.value) { this.value = v; this.inst.update(v); }
            }
        }

        // ---------- plynulé body: přírůstek se rozloží na 4 kroky (jako live stránka) ----------
        class Smooth {
            constructor(onStep) { this.shown = null; this.lastApi = null; this.timer = null; this.onStep = onStep; this.hist = []; }
            feed(pts) {
                pts = Math.max(0, Math.round(pts || 0));
                const now = Date.now();
                if (this.lastApi === null) { this.shown = this.lastApi = pts; this.hist = [{ t: now, v: pts }]; this.onStep(0, true); return; }
                if (pts === this.lastApi) return;
                if (pts < this.lastApi * 0.5) {                          // nová bitva -> hned bez animace
                    clearInterval(this.timer); this.timer = null;
                    this.shown = this.lastApi = pts; this.hist = [{ t: now, v: pts }];
                    this.onStep(0, true); return;
                }
                if (pts < this.lastApi) return;                            // starší data z API -> ignorovat
                this.lastApi = pts;
                this.hist.push({ t: now, v: pts });
                while (this.hist.length > 2 && now - this.hist[1].t > 3600000) this.hist.shift();
                clearInterval(this.timer); this.timer = null;
                const target = pts, chunk = (target - this.shown) / STEPS;
                let n = 0;
                const step = () => {
                    n++;
                    const before = this.shown;
                    this.shown = n >= STEPS ? target : Math.round(this.shown + chunk);
                    if (n >= STEPS) { clearInterval(this.timer); this.timer = null; }
                    this.onStep(this.shown - before, false);
                };
                step();
                if (n < STEPS) this.timer = setInterval(step, STEP_MS);
            }
            rate() {
                const h = this.hist;
                if (h.length < 2) return 0;
                const a = h[0], b = h[h.length - 1], dt = (b.t - a.t) / 3600000;
                return dt > (DEMO ? 0.002 : 0.03) ? (b.v - a.v) / dt : 0;
            }
        }

        // ---------- data ----------
        let battle = null, battleAt = 0;
        async function loadBattle() {
            if (DEMO) { if (!battle) battle = { configName: "HatchWarBattle2026", StartTime: Date.now() / 1000 - 3 * 86400, FinishTime: Date.now() / 1000 + 2 * 86400 + 5 * 3600 }; return battle; }
            if (battle && Date.now() - battleAt < BATTLE_MS) return battle;
            try {
                const j = await (await fetch(`${WORKER_URL}/activeClanBattle`, { cache: "no-store" })).json();
                if (j && j.status === "ok" && j.data) { battle = j.data; battleAt = Date.now(); }
            } catch (e) {}
            return battle;
        }

        const demo = {};
        function demoClan(tag) {
            if (!demo[tag]) {
                let h = 0; for (const c of tag) h = (h * 31 + c.charCodeAt(0)) >>> 0;
                demo[tag] = { name: tag, icon: "", flag: flagUrl(["GB", "CZ", "US", "DE", "PL", "JP", "SK"][h % 7]), members: 40 + (h % 10), points: 40e9 + (h % 90) * 1e9, place: 4 + (h % 40) };
            }
            const d = demo[tag];
            if (Math.random() < 0.85) d.points += Math.round(d.points * (0.002 + Math.random() * 0.01));
            return { ...d };
        }

        async function fetchClan(tag) {
            if (DEMO) return demoClan(tag);
            const j = await (await fetch(`${WORKER_URL}/clan/${encodeURIComponent(tag)}`, { cache: "no-store" })).json();
            if (!j || j.status !== "ok" || !j.data) return null;
            const c = j.data, id = battle && battle.configName;
            const bs = c.Battles || {};
            const list = Array.isArray(bs) ? bs : Object.values(bs);
            const active = id ? ((!Array.isArray(bs) && bs[id]) || list.find((b) => b.BattleID === id) || null) : null;
            const raw = Array.isArray(c.Members) ? c.Members.length : 0;
            return {
                name: c.Name,
                icon: iconUrl(c.Icon),
                flag: flagUrl(c.CountryCode),
                members: raw ? raw + 1 : 0,
                points: active ? (active.Points || 0) : 0,
                place: active && active.Place ? active.Place : null
            };
        }

        let demoTop = null;
        async function fetchTop(n) {
            if (DEMO) {
                if (!demoTop) {
                    const ccs = ["GB", "XK", "JP", "CZ", "US", "DE", "PL", "BR", "FR", "SE", "SK", "CA"];
                    const base = ["UN0", "SOPU", "C0LD", "HROT", "MDKT", "RSNK", "NOVA", "ZERO", "PETS", "LUCK", "FIRE", "GG"];
                    demoTop = Array.from({ length: 60 }, (_, i) => ({ Name: base[i] || ("C" + String(i).padStart(2, "0")), Points: Math.round(160e9 * Math.pow(0.95, i)), CountryCode: ccs[i % ccs.length], Icon: "" }));
                    if (TAG && !demoTop.some((d) => d.Name === TAG)) demoTop[14].Name = TAG;
                } else demoTop.forEach((d) => { if (Math.random() < 0.7) d.Points += Math.round(d.Points * Math.random() * (Math.random() < 0.15 ? 0.05 : 0.006)); });
                return demoTop.map((d) => ({ ...d })).sort((a, b) => b.Points - a.Points).slice(0, n);
            }
            const j = await (await fetch(`${WORKER_URL}/clans?page=1&pageSize=${n}&sort=Points&sortOrder=desc`, { cache: "no-store" })).json();
            if (!j || j.status !== "ok" || !Array.isArray(j.data)) throw new Error("bad data");
            return j.data;
        }

        // hráč: /v1/clans/players/{id} -> ActiveBattlePoints (přes worker kvůli CORS)
        function findKey(o, key, depth = 0) {
            if (!o || typeof o !== "object" || depth > 4) return undefined;
            if (key in o) return o[key];
            for (const k of Object.keys(o)) { const v = findKey(o[k], key, depth + 1); if (v !== undefined) return v; }
            return undefined;
        }
        let demoP = null;
        async function fetchPlayer(id) {
            if (DEMO) {
                if (!demoP) demoP = { name: "Player" + String(id).slice(-4), clan: TAG || "UN0", points: 1.8e9 };
                demoP.points += Math.round(demoP.points * Math.random() * 0.01);
                return { ...demoP };
            }
            let j = null;
            try { j = await (await fetch(`${WORKER_URL}/v1/clans/players/${id}`, { cache: "no-store" })).json(); } catch (e) {}
            let pts = j ? findKey(j, "ActiveBattlePoints") : undefined;
            let clan = j ? (findKey(j, "ClanName") || findKey(j, "Clan") || "") : "";
            let name = "";
            // záloha: stejný zdroj jako stránka People
            if (pts === undefined || !clan) {
                try {
                    const a = await (await fetch(`${WORKER_URL}/api/player/${id}`, { cache: "no-store" })).json();
                    if (a && a.found && a.player) {
                        if (pts === undefined) pts = a.player.points;
                        if (!clan && a.player.inClan !== false) clan = a.player.clan || "";
                        name = a.player.username || "";
                    }
                } catch (e) {}
            }
            if (pts === undefined) return j ? null : undefined;
            return { points: Number(pts) || 0, clan: typeof clan === "string" ? clan : "", name };
        }
        async function fetchRoblox(id) {
            const out = { name: "", avatar: "" };
            if (DEMO) return out;
            await Promise.all([
                fetch(`${WORKER_URL}/roblox/users/${id}`).then((r) => r.json()).then((d) => { out.name = (d && (d.name || d.displayName)) || ""; }).catch(() => {}),
                fetch(`${WORKER_URL}/roblox/avatars?userIds=${id}&size=150x150&format=Png&isCircular=true`).then((r) => r.json()).then((d) => { out.avatar = (d && d.data && d.data[0] && d.data[0].imageUrl) || ""; }).catch(() => {})
            ]);
            return out;
        }

        function showError(text) { stage.innerHTML = `<div class="card err-card">${esc(text)}</div>`; }
        function showLoading() { if (!stage.firstElementChild) stage.innerHTML = `<div class="card err-card" style="color:var(--muted)">Loading…</div>`; }
        const starImg = `<img class="star" src="/images/hvezda.png" alt="">`;

        // =========================================================

        async function widgetClan() {
            if (!TAG) return showError("Overlay: add ?clan=TAG to the URL");

        // =========================================================

        async function widgetVersus() {

            };
            const mk = (k, odo) => {

        // =========================================================
        // TOP – žebříček; se zadaným klanem okolí kolem něj (skutečné pozice)
        // =========================================================
        async function widgetTop() {
            await loadBattle();
            const ROW_H = 52, GAP = 6, MAX_FETCH = 1000;
            const me = TAG;
            const title = LABEL || (me ? `AROUND [${me}]` : `TOP ${ROWS} CLANS`);
            stage.innerHTML = `
                <div class="card w-top">
                    ${HIDE.has("title") ? "" : `<div class="top-head"><span class="top-title">${esc(title)}</span><span class="top-sub" id="topSub"></span></div>`}
                    <div class="top-list" id="list"></div>
                </div>`;
            const list = document.getElementById("list");
            const rows = new Map();          // name -> { el, odo, smooth, rank, apiRank }
            let need = Math.max(ROWS, 10);   // kolik klanů stáhnout (s klanem = jeho pozice + rezerva)

            const ensureRow = (d) => {
                let r = rows.get(d.Name);
                if (r) return r;
                const el = document.createElement("div");
                el.className = "row off" + (d.Name.toUpperCase() === me ? " me" : "");
                el.innerHTML = `<span class="row-rank"></span>${iconHtml({ icon: iconUrl(d.Icon), flag: flagUrl(d.CountryCode) })}<span class="name">[${esc(d.Name)}]</span><span class="num"><span></span></span>`;
                list.appendChild(el);
                const odo = new Odo(el.querySelector(".num span"));
                r = { el, odo, rank: null, apiRank: 0 };
                r.smooth = new Smooth((delta, instant) => { odo.set(r.smooth.shown, !instant); if (!instant) scheduleSort(); });
                rows.set(d.Name, r);
                return r;
            };

            let sortT = null;
            const scheduleSort = () => { clearTimeout(sortT); sortT = setTimeout(layout, 2600); };   // přeřadit až po dotočení čísla
            let windowNames = [];

            // zvednout -> přesunout -> položit (předbíhající se zvedne nad ostatní)
            const moveRow = (r, y, dir) => {
                clearTimeout(r.t1); clearTimeout(r.t2); clearTimeout(r.t3);
                const el = r.el;
                if (r.y === undefined || r.y === y || !dir) {
                    el.style.transition = r.y === undefined ? "none" : "";
                    el.style.transform = `translateY(${y}px)`;
                    r.y = y;
                    return;
                }
                const sc = dir < 0 ? 1.05 : 0.97, from = r.y;
                r.y = y;
                el.classList.remove("lift", "sink");
                el.classList.add(dir < 0 ? "lift" : "sink");
                el.style.transition = "transform 0.25s cubic-bezier(0.2, 1.2, 0.4, 1), box-shadow 0.25s, opacity 0.25s";
                el.style.transform = `translateY(${from}px) scale(${sc})`;
                r.t1 = setTimeout(() => {
                    el.style.transition = "transform 1s cubic-bezier(0.45, 0, 0.2, 1), box-shadow 0.3s, opacity 0.3s";
                    el.style.transform = `translateY(${y}px) scale(${sc})`;
                }, dir < 0 ? 260 : 120);
                r.t2 = setTimeout(() => {
                    el.style.transition = "transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1), box-shadow 0.35s, opacity 0.35s";
                    el.style.transform = `translateY(${y}px)`;
                    el.classList.remove("lift", "sink");
                }, (dir < 0 ? 260 : 120) + 1000);
                r.t3 = setTimeout(() => { el.style.transition = ""; }, (dir < 0 ? 260 : 120) + 1400);
            };

            const layout = () => {
                // pořadí v okně podle zobrazených bodů; skutečné pozice = začátek okna + index
                const vis = windowNames.map((n) => [n, rows.get(n)]).filter(([, r]) => r);
                const startRank = Math.min(...vis.map(([, r]) => r.apiRank).filter(Boolean), Infinity);
                vis.sort((x, y) => (y[1].smooth.shown || 0) - (x[1].smooth.shown || 0));
                const visible = new Set(vis.map(([n]) => n));
                rows.forEach((r, n) => { if (!visible.has(n)) r.el.classList.add("off"); });
                let y = 0;
                vis.forEach(([, r], i) => {
                    const rank = (isFinite(startRank) ? startRank : 1) + i;
                    const rk = r.el.querySelector(".row-rank");
                    rk.textContent = rank;
                    rk.className = "row-rank " + rankClass(rank);
                    const dir = r.rank ? Math.sign(rank - r.rank) : 0;
                    if (dir < 0) restart(r.el, "up");
                    r.rank = rank;
                    const wasOff = r.el.classList.contains("off");
                    r.el.classList.remove("off");
                    moveRow(r, y, wasOff ? 0 : dir);
                    y += ROW_H + GAP;
                });
                list.style.height = Math.max(0, y - GAP) + "px";
            };

            const refresh = async (first) => {
                try {
                    if (me && first) {
                        const c = await fetchClan(me).catch(() => null);
                        if (c && c.place) need = Math.min(MAX_FETCH, Math.max(need, c.place + ROWS + 5));
                        else need = DEMO ? 60 : 500;
                    }
                    const data = await fetchTop(need);
                    let start = 0;
                    if (me) {
                        const idx = data.findIndex((d) => (d.Name || "").toUpperCase() === me);
                        if (idx >= 0) {
                            start = Math.max(0, Math.min(data.length - ROWS, idx - Math.floor(ROWS / 2)));
                            need = Math.min(MAX_FETCH, Math.max(ROWS + 5, idx + ROWS + 5));       // příště stáhnout jen potřebné
                        } else if (first) {
                            const sub = document.getElementById("topSub"); if (sub) sub.textContent = `[${me}] not in top ${data.length}`;
                        }
                    }
                    const slice = data.slice(start, start + ROWS);
                    windowNames = slice.map((d) => d.Name);
                    slice.forEach((d, i) => { const r = ensureRow(d); r.apiRank = start + i + 1; r.smooth.feed(d.Points); });
                    // řádky mimo okno uklidit
                    rows.forEach((r, n) => { if (!windowNames.includes(n) && r.el.classList.contains("off")) { r.el.remove(); rows.delete(n); } });
                    const sub = document.getElementById("topSub");
                    if (sub && battle && (!me || data.some((d) => (d.Name || "").toUpperCase() === me))) sub.textContent = prettyBattle(battle.configName);
                    if (first) layout(); else scheduleSort();
                } catch (e) {
                    if (first) { list.innerHTML = `<div class="label" style="padding:10px">Loading...</div>`; setTimeout(() => { list.innerHTML = ""; refresh(true); }, 5000); }
                }
            };
            await refresh(true);
            setInterval(() => { if (!document.hidden || DEMO) { loadBattle(); refresh(false); } }, TOP_POLL_MS);
        }

        // =========================================================
        // TIMER – odpočet do konce bitvy (zůstává pro staré odkazy)
        // =========================================================
        async function widgetTimer() {
            await loadBattle();
            stage.innerHTML = `
                <div class="card w-timer">
                    ${HIDE.has("title") ? "" : `<div class="timer-head"><span class="live-dot"></span><span class="timer-name" id="tName"></span></div>`}
                    <div class="num timer-val" id="tVal"></div>
                    <div class="bar"><div class="bar-fill" id="tBar"><div class="bar-stripes"></div></div></div>
                    <div class="timer-foot label"><span id="tStart"></span><span id="tEnd"></span></div>
                </div>`;
            const p = (x) => String(x).padStart(2, "0");
            const unit = (v, u) => `${p(v)}<span class="u">${u}</span>`;
            const tick = () => {
                const n = document.getElementById("tName");
                if (!battle || !battle.configName) { if (n) n.textContent = "No active battle"; return; }
                if (n) n.textContent = LABEL || prettyBattle(battle.configName);
                const now = Date.now() / 1000, left = Math.max(0, (battle.FinishTime || 0) - now);
                const d = Math.floor(left / 86400), h = Math.floor((left % 86400) / 3600), m = Math.floor((left % 3600) / 60), s = Math.floor(left % 60);
                document.getElementById("tVal").innerHTML = left <= 0 ? "ENDED" : (d ? unit(d, "d") : "") + unit(h, "h") + unit(m, "m") + unit(s, "s");
                const tot = (battle.FinishTime || 0) - (battle.StartTime || 0);
                const pct = tot > 0 ? Math.max(0, Math.min(1, (now - battle.StartTime) / tot)) : 0;
                const bar = document.getElementById("tBar");
                bar.style.width = (pct * 100).toFixed(2) + "%";
                bar.classList.toggle("full", pct >= 0.999);
                const fmt = (t) => new Date(t * 1000).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
                document.getElementById("tStart").textContent = battle.StartTime ? fmt(battle.StartTime) : "";
                document.getElementById("tEnd").textContent = (pct * 100).toFixed(0) + "% · " + (battle.FinishTime ? fmt(battle.FinishTime) : "");
            };
            tick();
            setInterval(tick, 1000);
            setInterval(loadBattle, 60000);
        }

        // =========================================================
        // GOAL – cíl bodů pro klan
        // =========================================================
        async function widgetGoal() {
            if (!TAG) return showError("Overlay: add ?clan=TAG&goal=200b to the URL");
            if (!GOAL) return showError("Overlay: add a goal, e.g. &goal=200b");
            await loadBattle();
            const d = await fetchClan(TAG).catch(() => undefined);
            if (d === null) return showError(`Clan [${TAG}] not found`);
            if (!d) return (showLoading(), setTimeout(widgetGoal, 5000));
            stage.innerHTML = `
                <div class="card w-goal" id="goal">
                    <div class="goal-top">
                        ${iconHtml(d)}
                        <div class="goal-txt">
                            <div class="goal-title">${esc(LABEL || `[${d.name}] GOAL`)}</div>
                            <div class="goal-nums"><span class="num" id="gPts"><span></span></span><span class="of">/ ${short(GOAL)}</span></div>
                        </div>
                        <span class="num goal-pct" id="gPct">0%</span>
                    </div>
                    <div class="bar"><div class="bar-fill" id="gBar"><div class="bar-stripes"></div></div></div>
                    ${HIDE.has("gain") ? "" : `<div class="gain-layer" id="gain"></div>`}
                </div>`;
            const odo = new Odo(document.querySelector("#gPts span"));
            const gain = document.getElementById("gain"), card = document.getElementById("goal");
            let doneShown = false;
            const celebrate = (big) => {
                card.classList.add("done");
                if (!card.querySelector(".goal-done")) card.insertAdjacentHTML("beforeend", `<div class="goal-done">GOAL REACHED!</div>`);
                if (!big) return;
                restart(card, "celebrate");
                const cols = ["#FFE873", "#FF4F86", "#48D2F7", "#6BF06B", "#8F55F2", "#FFFFFF"];
                for (let i = 0; i < 26; i++) {
                    const c = document.createElement("i");
                    c.className = "confetti";
                    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 170;
                    c.style.setProperty("--dx", (Math.cos(ang) * dist * 1.6).toFixed(0) + "px");
                    c.style.setProperty("--dy", (Math.sin(ang) * dist * 0.7 - 30).toFixed(0) + "px");
                    c.style.setProperty("--rot", (Math.random() * 720 - 360).toFixed(0) + "deg");
                    c.style.background = cols[i % cols.length];
                    c.style.animationDelay = (Math.random() * 0.15).toFixed(2) + "s";
                    card.appendChild(c);
                    c.addEventListener("animationend", () => c.remove());
                }
            };
            const sm = new Smooth((delta, instant) => {
                odo.set(sm.shown, !instant);
                const pct = Math.min(1, sm.shown / GOAL);
                const bar = document.getElementById("gBar");
                bar.style.width = (pct * 100).toFixed(2) + "%";
                bar.classList.toggle("full", pct >= 1);
                document.getElementById("gPct").textContent = pct >= 1 ? "100%" : (Math.floor(pct * 1000) / 10).toFixed(1) + "%";
                popGain(gain, delta);
                if (pct >= 1 && !doneShown) { doneShown = true; celebrate(!instant); }
            });
            sm.feed(d.points);
            setInterval(async () => {
                if (document.hidden && !DEMO) return;
                await loadBattle();
                const x = await fetchClan(TAG).catch(() => null);
                if (x) sm.feed(x.points);
            }, POLL_MS);
        }

        const widgets = { clan: widgetClan, player: widgetPlayer, versus: widgetVersus, top: widgetTop, timer: widgetTimer, goal: widgetGoal };
        (widgets[W] || widgetClan)();
    })();
    </script>
