<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M5T889PLGJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-M5T889PLGJ');
    </script>

    <link rel="icon" href="/images/favicon.png" type="image/png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PS99 Clans - Live Top 100</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Roboto:wght@800&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/images/page-select.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif !important;
            font-weight: 600;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden !important;
            position: fixed;
            inset: 0;
            overscroll-behavior: none !important;
            touch-action: none;
            background-color: #89b3f9;
        }

        /* ---------- MŘÍŽKA KARET (celá obrazovka) ----------
           --u = 1 "designový pixel" (karta je navržená na výšku 72 u), dopočítává se v JS */
        .lp-grid {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            --u: 1px;
        }

        .lp-card {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--cw);
            height: var(--ch);
            cursor: pointer;
            contain: layout style;
        }
        .lp-card.is-hidden { visibility: hidden; pointer-events: none; }

        /* stín při zvednutí – animuje se jen průhlednost (levné) */
        .lp-lift-shadow {
            position: absolute;
            inset: 0;
            border-radius: calc(12 * var(--u));
            box-shadow: 0 calc(22 * var(--u)) calc(30 * var(--u)) rgba(0, 0, 0, 0.32);
            opacity: 0;
            pointer-events: none;
        }

        .lp-inner {
            position: absolute;
            inset: 0;
            background-color: #F7FFFE;
            border: calc(3.5 * var(--u)) solid #000000;
            border-radius: calc(12 * var(--u));
            box-shadow: 0 calc(3 * var(--u)) 0 rgba(0, 0, 0, 0.18);
            transform-origin: center center;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .lp-card:hover .lp-inner { transform: scale(1.02); }
        .lp-card:active .lp-inner { transform: scale(0.96); }

        /* zelené zbarvení karty při přičtení – jen opacity */
        .lp-glow {
            position: absolute;
            inset: 0;
            border-radius: calc(8.5 * var(--u));
            background: radial-gradient(ellipse at 40% 50%, rgba(140, 245, 160, 0.55) 0%, rgba(110, 235, 140, 0.38) 60%, rgba(70, 220, 110, 0.45) 100%);
            opacity: 0;
            transition: opacity 2.4s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: none;
        }
        .lp-inner.is-gain .lp-glow { opacity: 1; transition: opacity 0.3s ease-out; }

        .lp-rank {
            position: absolute;
            left: calc(-8 * var(--u));
            top: calc(-13 * var(--u));
            font-size: calc(25 * var(--u));
            line-height: 1;
            color: #FFFFFF;
            -webkit-text-stroke: calc(6 * var(--u)) #000000;
            paint-order: stroke fill;
            font-weight: 800 !important;
            pointer-events: none;
            z-index: 5;
            transform-origin: 30% 60%;
        }
        .lp-rank.is-first { color: #8AFCED; }
        .lp-rank.pop { animation: rankPop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes rankPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        .lp-icon {
            position: absolute;
            left: calc(7 * var(--u));
            top: calc(6.5 * var(--u));
            width: calc(52 * var(--u));
            height: calc(52 * var(--u));
            border-radius: calc(8 * var(--u));
            background-color: #FFFFFF;
            object-fit: contain;
            box-shadow: 0 0 0 calc(2 * var(--u)) rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }

        .lp-flag {
            position: absolute;
            left: calc(68 * var(--u));
            top: calc(4 * var(--u));
            width: calc(24 * var(--u));
            height: calc(24 * var(--u));
            pointer-events: none;
        }

        .lp-name {
            position: absolute;
            left: calc(97 * var(--u));
            top: calc(1 * var(--u));
            font-size: calc(23 * var(--u));
            line-height: 1.1;
            color: #FEFEFE;
            -webkit-text-stroke: calc(6 * var(--u)) #000000;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ---------- VLASTNÍ LEHKÝ ODOMETR ----------
           každá číslice = jeden text "0..9 0..9 0..9" posouvaný přes transform (běží na GPU) */
        .lp-pts {
            position: absolute;
            left: calc(67 * var(--u));
            top: calc(29 * var(--u));
            height: calc(36 * var(--u));
            display: flex;
            align-items: center;
            color: #262C2D;
            transition: color 2.4s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: none;
        }
        .lp-inner.is-gain .lp-pts { color: #17A63E; transition: color 0.3s ease-out; }

        .num {
            display: inline-flex;
            font-family: 'Roboto', sans-serif !important;
            font-weight: 800 !important;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            white-space: nowrap;
        }
        .num * { font-family: inherit !important; font-weight: inherit !important; }
        .num .d {
            display: inline-block;
            height: 1em;
            overflow: hidden;
        }
        .num .s {
            display: block;
            white-space: pre;
            line-height: 1em;
            transform: translateY(0);
        }
        .num .s.roll { transition: transform 2s cubic-bezier(0.22, 0.8, 0.28, 1); }
        .num .c { display: inline-block; }

        .lp-delta {
            position: absolute;
            right: calc(10 * var(--u));
            top: calc(36 * var(--u));
            font-size: calc(22 * var(--u));
            line-height: 1;
            color: #3BE15C;
            -webkit-text-stroke: calc(5 * var(--u)) #000000;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform-origin: right center;
        }
        .lp-delta.show { animation: deltaPop 3.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes deltaPop {
            0%   { opacity: 0; transform: translateY(-50%) scale(0.5); }
            9%   { opacity: 1; transform: translateY(-50%) scale(1.15); }
            17%  { opacity: 1; transform: translateY(-50%) scale(1); }
            72%  { opacity: 1; transform: translateY(-50%) scale(1); }
            100% { opacity: 0; transform: translateY(-110%) scale(0.95); }
        }

        /* ---------- SPODNÍ LIŠTA ---------- */
        .lp-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--bottom-h, 150px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 700;
        }

        .ps-hotbar-host { display: flex; justify-content: center; }

        .lp-side {
            position: absolute;
            bottom: 34px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .lp-side-left { left: 22px; }
        .lp-side-right { right: 22px; }

        .live-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 7px 14px;
            min-width: 170px;
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 12px;
            box-shadow: 0 3px 0 #000000;
            font-size: 18px;
            font-weight: 700 !important;
            color: #262C2D;
        }
        .live-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2ECC40;
            border: 2px solid #000000;
            animation: livePulse 1.4s infinite ease-in-out;
        }
        .live-badge.is-stale .live-dot { background: #FF4A4A; animation: none; }
        @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .page-select-bg {
            position: relative;
            width: 227px;
            height: 56px;
            background: url("/images/page-select.png") no-repeat center center;
            background-size: 100% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page-number-text {
            font-size: 28px !important;
            font-weight: 800 !important;
            color: #FFFFFF;
            -webkit-text-stroke: 6px #2A2B31;
            paint-order: stroke fill;
            padding-bottom: 3px;
        }
        .page-arrow {
            position: absolute;
            top: 8px;
            width: 27px;
            height: 39px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: transform 0.06s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s ease;
        }
        .page-arrow:hover:not(:active) { transform: scale(1.08); }
        .page-arrow:active { transform: scale(0.92); }
        .page-arrow.is-disabled { opacity: 0.35; pointer-events: none; }
        .arrow-left { left: 22px; background-image: url("/images/sipka-leva.png"); }
        .arrow-right { right: 22px; background-image: url("/images/sipka-prava.png"); }

        .lp-status {
            position: absolute;
            left: 0;
            right: 0;
            top: 42%;
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            color: #FFFFFF;
            -webkit-text-stroke: 6px #000000;
            paint-order: stroke fill;
            z-index: 600;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* na úzkých obrazovkách boční prvky pod sebe nad hotbar */
        @media (max-width: 1100px) {
            .lp-side { bottom: auto; top: 6px; }
        }
    </style>
</head>
<body>

    <div class="lp-grid" id="grid"></div>
    <div class="lp-status" id="statusText">Loading clans...</div>

    <div class="lp-bottom" id="bottomBar">
        <div class="lp-side lp-side-left">
            <div class="live-badge" id="liveBadge">
                <span class="live-dot"></span>
                <span id="liveBadgeText">LIVE</span>
            </div>
        </div>

        <div class="ps-hotbar-host"></div>

        <div class="lp-side lp-side-right">
            <div class="page-select-bg">
                <div class="page-arrow arrow-left is-disabled" id="prevPageBtn"></div>
                <span class="page-number-text" id="pageText">#1-50</span>
                <div class="page-arrow arrow-right" id="nextPageBtn"></div>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const params = new URLSearchParams(location.search);
        const DEMO = params.has("demo");   // ?demo=1 → vymyšlená data (na zkoušení animací), ?tick=4 → rychlejší

        // ---------- NASTAVENÍ ----------
        const TICK_MS = DEMO ? Math.max(2, Number(params.get("tick")) || 15) * 1000 : 15000; // aktualizace každých 15 s
        const SMOOTH_STEPS = 4;          // jako live.html: rozdíl se přičte ve 4 krocích
        const STEP_SPREAD = 0.85;        // kroky klanů se rozprostřou do 85 % intervalu → pořád se něco přičítá
        const ROLL_MS = 2000;            // jak dlouho se točí číslo
        const REORDER_DELAY_MS = 1900;   // předběhnutí až po dotočení čísla
        const MOVE_MS = 1500;            // zvednout → přesunout → položit

        const COLS = 5, ROWS = 10, PER_PAGE = COLS * ROWS, MAX_CLANS = 100;
        const PAD_X = 14, PAD_TOP = 16, GAP_X = 12, GAP_Y_RATIO = 0.125; // mezera mezi řadami = 12,5 % výšky karty
        const BOTTOM_H = 150;            // místo na hotbar dole

        const ICON_FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><rect width="52" height="52" fill="#fff"/><text x="26" y="34" font-family="Arial" font-weight="bold" font-size="22" text-anchor="middle" fill="#B1B1B1">?</text></svg>'
        );
        const STRIP_TEXT = "0123456789".repeat(3).split("").join("\n"); // 30 řádků

        const grid = document.getElementById("grid");
        const clans = new Map();   // jméno → stav karty
        let order = [];
        let page = 1;
        let lastOkAt = 0;
        let nextTickAt = 0;
        let firstLoad = true;

        // rozměry (dopočítávají se podle okna)
        let CW = 352, CH = 72, U = 1, GAP_Y = 9, PTS_W = 200;

        // ---------- ROZMĚRY PODLE OKNA ----------
        function computeLayout() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const gridH = h - BOTTOM_H - PAD_TOP;
            CW = (w - PAD_X * 2 - GAP_X * (COLS - 1)) / COLS;
            CH = gridH / (ROWS + GAP_Y_RATIO * (ROWS - 1));
            GAP_Y = CH * GAP_Y_RATIO;
            // obsah karty roste s výškou, ale nesmí přetéct na šířku
            U = Math.min(CH / 72, CW / 300);
            PTS_W = CW - 67 * U - 78 * U;

            grid.style.top = PAD_TOP + "px";
            grid.style.height = gridH + "px";
            grid.style.setProperty("--u", U + "px");
            grid.style.setProperty("--cw", CW + "px");
            grid.style.setProperty("--ch", CH + "px");
            document.getElementById("bottomBar").style.setProperty("--bottom-h", BOTTOM_H + "px");
        }

        let resizeRaf = 0;
        window.addEventListener("resize", () => {
            cancelAnimationFrame(resizeRaf);
            resizeRaf = requestAnimationFrame(() => {
                computeLayout();
                clans.forEach(c => {
                    if (c.rank < 0) return;
                    stopAnim(c);
                    const to = slotOf(c.rank);
                    c.el.style.transform = `translate(${to.x}px, ${to.y}px)`;
                    c.x = to.x; c.y = to.y;
                    fitNumber(c, true);
                });
            });
        });

        // ---------- POMOCNÉ FUNKCE ----------
        function getTwemojiUrl(countryCode) {
            if (!countryCode || countryCode.length !== 2) return "https://twemoji.maxcdn.com/v/14.0.2/svg/1f1fa-1f1f8.svg";
            const cp = countryCode.toUpperCase().split("").map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65);
            return `https://twemoji.maxcdn.com/v/14.0.2/svg/${cp[0].toString(16)}-${cp[1].toString(16)}.svg`;
        }

        function getClanIconUrl(iconAsset) {
            if (!iconAsset) return ICON_FALLBACK;
            const m = String(iconAsset).match(/\d+/);
            return m ? `https://ps99.biggamesapi.io/image/${m[0]}` : ICON_FALLBACK;
        }

        function formatDelta(n) {
            if (n < 10000) return "+" + n.toLocaleString("en-US");
            const f = (v, s) => "+" + (v < 10 ? parseFloat(v.toFixed(2)) : v < 100 ? parseFloat(v.toFixed(1)) : Math.floor(v)) + s;
            if (n >= 1e9) return f(n / 1e9, "b");
            if (n >= 1e6) return f(n / 1e6, "m");
            return f(n / 1e3, "k");
        }

        // velikost písma čísla podle šířky (měří se jednou na počet číslic, ne pokaždé)
        const measurer = document.createElement("span");
        measurer.style.cssText = "position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-size:100px;font-family:'Roboto',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;";
        document.body.appendChild(measurer);
        const widthCache = new Map();

        function textWidth100(str) {
            const key = str.replace(/\d/g, "0");
            let w = widthCache.get(key);
            if (w === undefined) {
                measurer.textContent = key;
                w = measurer.offsetWidth || 1;
                widthCache.set(key, w);
            }
            return w;
        }

        function fitNumber(c, force) {
            const str = c.shown.toLocaleString("en-US");
            if (!force && c.fitLen === str.length) return;
            c.fitLen = str.length;
            const size = Math.max(14 * U, Math.min(34 * U, (100 * PTS_W * 0.97) / textWidth100(str)));
            c.numEl.style.fontSize = size.toFixed(2) + "px";
        }

        function slotOf(rank) {
            const i = rank % PER_PAGE;
            const col = Math.floor(i / ROWS);
            const row = i % ROWS;
            return { x: PAD_X + col * (CW + GAP_X), y: row * (CH + GAP_Y) };
        }

        function pageOf(rank) { return Math.floor(rank / PER_PAGE) + 1; }

        // nižší karta musí být nad vyšší, aby přes ni přečuhovalo "#x"
        function baseZ(rank) { return 10 + (rank % PER_PAGE); }

        // ---------- ODOMETR ----------
        function buildNumber(c, value) {
            const str = value.toLocaleString("en-US");
            const frag = document.createDocumentFragment();
            c.digits = [];
            for (const ch of str) {
                if (ch >= "0" && ch <= "9") {
                    const d = document.createElement("span");
                    d.className = "d";
                    const s = document.createElement("span");
                    s.className = "s";
                    s.textContent = STRIP_TEXT;
                    s.style.transform = `translateY(${-Number(ch)}em)`;
                    d.appendChild(s);
                    frag.appendChild(d);
                    c.digits.push({ s, pos: Number(ch) });
                } else {
                    const sep = document.createElement("span");
                    sep.className = "c";
                    sep.textContent = ch;
                    frag.appendChild(sep);
                }
            }
            c.numEl.replaceChildren(frag);
            c.numStr = str;
        }

        function setNumber(c, from, to, animate) {
            const str = to.toLocaleString("en-US");
            if (str.length !== c.numStr.length) {
                // změnil se počet číslic → postavit znovu (výchozí stav = staré číslo zarovnané doprava)
                buildNumber(c, to);
                if (!animate) return;
                const oldDigits = String(from).padStart(c.digits.length, "0");
                c.digits.forEach((dg, i) => { dg.pos = Number(oldDigits[i]); dg.s.style.transform = `translateY(${-dg.pos}em)`; });
                void c.numEl.offsetWidth;
            }
            const newDigits = String(to);
            const n = c.digits.length;
            for (let i = 0; i < n; i++) {
                const dg = c.digits[i];
                const place = n - 1 - i;                       // řád číslice (0 = jednotky)
                const target = Number(newDigits[i]);
                if (!animate || to < from) {
                    dg.s.classList.remove("roll");
                    dg.pos = target;
                    dg.s.style.transform = `translateY(${-target}em)`;
                    continue;
                }
                const p = Math.pow(10, place);
                const passed = Math.floor(to / p) - Math.floor(from / p); // kolikrát se číslice "přetočí"
                if (passed <= 0) continue;
                const steps = (passed % 10) + (passed >= 10 ? 10 : 0);    // max. jedna otáčka navíc
                if (dg.pos + steps > 29) {
                    // předchozí otáčka ještě nedoběhla a pás by nestačil → srovnat na 0–9
                    dg.s.classList.remove("roll");
                    dg.pos %= 10;
                    dg.s.style.transform = `translateY(${-dg.pos}em)`;
                    void dg.s.offsetHeight;
                }
                dg.pos += steps;
                dg.s.classList.add("roll");
                dg.s.style.transform = `translateY(${-dg.pos}em)`;
            }
        }

        // po dotočení vrátit pás na 0–9 (jeden posluchač pro celou mřížku)
        grid.addEventListener("transitionend", e => {
            const s = e.target;
            if (!s.classList || !s.classList.contains("s") || e.propertyName !== "transform") return;
            const m = /translateY\((-?[\d.]+)em\)/.exec(s.style.transform);
            if (!m) return;
            const pos = -Number(m[1]);
            s.classList.remove("roll");
            if (pos >= 10) {
                s.style.transform = `translateY(${-(pos % 10)}em)`;
                const card = s.closest(".lp-card");
                const c = card && card._c;
                if (c) { const dg = c.digits.find(d => d.s === s); if (dg) dg.pos = pos % 10; }
            }
        });

        // ---------- KARTA ----------
        function createCard(c, d) {
            const el = document.createElement("div");
            el.className = "lp-card is-hidden";
            el.innerHTML = `
                <div class="lp-lift-shadow"></div>
                <div class="lp-inner">
                    <div class="lp-glow"></div>
                    <img class="lp-icon" draggable="false" decoding="async">
                    <img class="lp-flag" draggable="false" decoding="async">
                    <div class="lp-name"></div>
                    <div class="lp-pts"><span class="num"></span></div>
                    <div class="lp-delta"></div>
                    <div class="lp-rank"></div>
                </div>`;
            el._c = c;
            c.el = el;
            c.inner = el.querySelector(".lp-inner");
            c.shadowEl = el.querySelector(".lp-lift-shadow");
            c.rankEl = el.querySelector(".lp-rank");
            c.iconEl = el.querySelector(".lp-icon");
            c.flagEl = el.querySelector(".lp-flag");
            c.nameEl = el.querySelector(".lp-name");
            c.numEl = el.querySelector(".num");
            c.deltaEl = el.querySelector(".lp-delta");
            c.iconEl.onerror = () => { c.iconEl.onerror = null; c.iconEl.src = ICON_FALLBACK; };
            el.onclick = () => { location.href = `/clan-detail/?name=${encodeURIComponent(c.name)}`; };

            buildNumber(c, c.shown);
            fitNumber(c, true);
            c.renderedPts = c.shown;

            updateStatic(c, d);
            grid.appendChild(el);
        }

        function updateStatic(c, d) {
            const key = [d.Name, d.Icon, d.CountryCode].join("|");
            if (key === c.staticKey) return;
            c.staticKey = key;
            c.nameEl.textContent = `[${d.Name}]`;
            c.iconEl.src = getClanIconUrl(d.Icon);
            c.flagEl.src = getTwemojiUrl(d.CountryCode);
        }

        function renderPoints(c) {
            if (c.renderedPts === c.shown) return;
            const from = c.renderedPts;
            c.renderedPts = c.shown;
            // neviditelné karty (druhá stránka / skrytý panel) se jen přepíšou bez animace
            setNumber(c, from, c.shown, c.visible && !document.hidden);
            fitNumber(c, false);
        }

        function flashGain(c, delta) {
            if (!c.visible || document.hidden) return;
            c.inner.classList.remove("is-gain");
            void c.inner.offsetWidth;
            c.inner.classList.add("is-gain");
            clearTimeout(c.gainTimer);
            c.gainTimer = setTimeout(() => c.inner.classList.remove("is-gain"), 1300);

            c.deltaEl.textContent = formatDelta(delta);
            c.deltaEl.classList.remove("show");
            void c.deltaEl.offsetWidth;
            c.deltaEl.classList.add("show");
        }

        function setRankText(c, rank, pop) {
            const txt = `#${rank + 1}`;
            if (c.rankEl.textContent === txt) return;
            c.rankEl.textContent = txt;
            c.rankEl.classList.toggle("is-first", rank === 0);
            if (pop) {
                c.rankEl.classList.remove("pop");
                void c.rankEl.offsetWidth;
                c.rankEl.classList.add("pop");
            }
        }

        // ---------- POHYB KARET ----------
        // Karty se pozicují přes transform (žádný přepočet layoutu stránky).
        function placeAt(c, to) {
            c.x = to.x; c.y = to.y;
            c.el.style.transform = `translate(${to.x}px, ${to.y}px)`;
        }

        // aktuální (i rozpracovaná) pozice karty bez čtení layoutu
        function currentPos(c) {
            if (c.anim && c.animFrom && c.anim.effect) {
                const t = Math.min(1, Math.max(0, (c.anim.currentTime || 0) / MOVE_MS));
                const k = t < 0.2 ? 0 : t > 0.76 ? 1 : (t - 0.2) / 0.56;
                const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
                return { x: c.animFrom.x + (c.x - c.animFrom.x) * e, y: c.animFrom.y + (c.y - c.animFrom.y) * e };
            }
            return { x: c.x, y: c.y };
        }

        function stopAnim(c) {
            if (c.anim) { c.anim.cancel(); c.anim = null; }
            if (c.shadowAnim) { c.shadowAnim.cancel(); c.shadowAnim = null; }
            c.animFrom = null;
            clearTimeout(c.rankTimer);
        }

        function animateMove(c, to, kind) {
            const from = currentPos(c);
            stopAnim(c);
            placeAt(c, to);
            c.animFrom = from;
            const T = (x, y, s) => `translate(${x}px, ${y}px) scale(${s})`;
            const L = 7 * U;   // o kolik se karta zvedne

            let frames;
            if (kind === "lift") {
                c.el.style.zIndex = 400;
                frames = [
                    { offset: 0,    transform: T(from.x, from.y, 1),          easing: "cubic-bezier(0.3, 0.7, 0.4, 1)" },
                    { offset: 0.2,  transform: T(from.x, from.y - L, 1.09),   easing: "cubic-bezier(0.65, 0, 0.35, 1)" },
                    { offset: 0.76, transform: T(to.x, to.y - L, 1.09),       easing: "cubic-bezier(0.55, 0, 0.8, 0.3)" },
                    { offset: 0.88, transform: T(to.x, to.y + U, 0.98),       easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" },
                    { offset: 1,    transform: T(to.x, to.y, 1) }
                ];
                c.shadowAnim = c.shadowEl.animate(
                    [{ opacity: 0, offset: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 1, offset: 0.76 }, { opacity: 0, offset: 0.88 }, { opacity: 0, offset: 1 }],
                    { duration: MOVE_MS }
                );
            } else {
                c.el.style.zIndex = 300;
                frames = [
                    { offset: 0,    transform: T(from.x, from.y, 1),    easing: "cubic-bezier(0.4, 0, 0.6, 1)" },
                    { offset: 0.2,  transform: T(from.x, from.y, 0.97), easing: "cubic-bezier(0.65, 0, 0.35, 1)" },
                    { offset: 0.76, transform: T(to.x, to.y, 0.97),     easing: "cubic-bezier(0.3, 0.7, 0.4, 1)" },
                    { offset: 1,    transform: T(to.x, to.y, 1) }
                ];
            }

            const anim = c.el.animate(frames, { duration: MOVE_MS });
            c.anim = anim;
            c.rankTimer = setTimeout(() => setRankText(c, c.rank, true), MOVE_MS * 0.8);
            anim.onfinish = () => {
                if (c.anim !== anim) return;
                c.anim = null;
                c.animFrom = null;
                c.el.style.zIndex = baseZ(c.rank);
            };
        }

        function animateIn(c, to, delay, lifted) {
            stopAnim(c);
            placeAt(c, to);
            c.el.style.zIndex = lifted ? 400 : baseZ(c.rank);
            c.el.classList.remove("is-hidden");
            setRankText(c, c.rank, false);
            const T = (dy, s) => `translate(${to.x}px, ${to.y + dy}px) scale(${s})`;
            const frames = lifted
                ? [
                    { offset: 0,    opacity: 0, transform: T(-14 * U, 1.12) },
                    { offset: 0.55, opacity: 1, transform: T(-7 * U, 1.09), easing: "cubic-bezier(0.55, 0, 0.8, 0.3)" },
                    { offset: 0.8,  opacity: 1, transform: T(U, 0.98),       easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" },
                    { offset: 1,    opacity: 1, transform: T(0, 1) }
                  ]
                : [
                    { opacity: 0, transform: T(10 * U, 0.92) },
                    { opacity: 1, transform: T(0, 1) }
                  ];
            const anim = c.el.animate(frames, {
                duration: lifted ? MOVE_MS * 0.8 : 480,
                delay: delay || 0,
                easing: lifted ? "linear" : "cubic-bezier(0.2, 0.8, 0.2, 1)",
                fill: "backwards"
            });
            c.anim = anim;
            anim.onfinish = () => {
                if (c.anim !== anim) return;
                c.anim = null;
                c.el.style.zIndex = baseZ(c.rank);
            };
        }

        function animateOut(c, done) {
            stopAnim(c);
            const anim = c.el.animate(
                [{ opacity: 1 }, { opacity: 0, transform: `translate(${c.x}px, ${c.y}px) scale(0.92)` }],
                { duration: 240, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" }
            );
            c.anim = anim;
            anim.onfinish = () => {
                if (c.anim !== anim) return;
                c.el.classList.add("is-hidden");
                anim.cancel();
                c.anim = null;
                if (done) done();
            };
        }

        // ---------- ŘAZENÍ ----------
        function sortOrder() {
            order = [...clans.values()]
                .filter(c => !c.removed)
                .sort((a, b) => (b.shown - a.shown) || (b.lastApi - a.lastApi) || a.name.localeCompare(b.name))
                .slice(0, MAX_CLANS);
        }

        // víc změn během jednoho snímku → jen jedno přeskládání
        let relayoutQueued = false;
        function queueRelayout() {
            if (relayoutQueued) return;
            relayoutQueued = true;
            requestAnimationFrame(() => { relayoutQueued = false; relayout(true); });
        }

        function relayout(animate) {
            sortOrder();
            const anim = animate && !document.hidden;

            order.forEach((c, rank) => {
                const oldRank = c.rank;
                const wasVisible = c.visible;
                const nowVisible = pageOf(rank) === page;
                if (oldRank === rank && wasVisible === nowVisible && !c.fresh) return;

                const to = slotOf(rank);
                const isFresh = c.fresh;
                c.fresh = false;
                c.rank = rank;
                c.visible = nowVisible;

                if (!nowVisible) {
                    const finish = () => { placeAt(c, to); c.el.style.zIndex = baseZ(rank); setRankText(c, rank, false); };
                    if (wasVisible && anim) animateOut(c, finish);
                    else { stopAnim(c); c.el.classList.add("is-hidden"); finish(); }
                    return;
                }

                if (!anim) {
                    stopAnim(c);
                    placeAt(c, to);
                    c.el.style.zIndex = baseZ(rank);
                    c.el.classList.remove("is-hidden");
                    setRankText(c, rank, false);
                    return;
                }

                if (!wasVisible) {
                    // přišla z druhé stránky (#51 → #50) nebo je nově v top 100
                    animateIn(c, to, 0, !isFresh && oldRank > rank);
                    return;
                }

                animateMove(c, to, rank < oldRank ? "lift" : "slide");
            });

            // klany, které vypadly z top 100
            clans.forEach(c => {
                if (!c.removed || c.gone || order.includes(c)) return;
                c.gone = true;
                const kill = () => { c.el.remove(); clans.delete(c.name); };
                if (c.visible && anim) animateOut(c, kill); else kill();
            });
        }

        // ---------- STRÁNKY (#1-50 / #51-100) ----------
        function showPage(p) {
            if (p === page || p < 1 || p > 2) return;
            page = p;
            document.getElementById("pageText").textContent = p === 1 ? "#1-50" : "#51-100";
            document.getElementById("prevPageBtn").classList.toggle("is-disabled", p === 1);
            document.getElementById("nextPageBtn").classList.toggle("is-disabled", p === 2);

            order.forEach(c => { if (c.visible && pageOf(c.rank) !== page) animateOut(c); });
            setTimeout(() => {
                order.forEach((c, rank) => {
                    c.rank = rank;
                    c.visible = pageOf(rank) === page;
                    if (!c.visible) return;
                    // čísla na nové stránce rovnou na aktuální hodnotu
                    setNumber(c, c.renderedPts, c.shown, false);
                    c.renderedPts = c.shown;
                    fitNumber(c, false);
                    const i = rank % PER_PAGE;
                    animateIn(c, slotOf(rank), (Math.floor(i / ROWS) * 3 + (i % ROWS)) * 20, false);
                });
            }, 250);
        }

        document.getElementById("prevPageBtn").onclick = () => showPage(page - 1);
        document.getElementById("nextPageBtn").onclick = () => showPage(page + 1);
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft") showPage(page - 1);
            if (e.key === "ArrowRight") showPage(page + 1);
        });

        // ---------- PLYNULÉ PŘIČÍTÁNÍ (stejný princip jako live.html) ----------
        // Nová hodnota z API se rozdělí na 4 kusy; každých 15 s se přičte jeden.
        // Kroky jednotlivých klanů jsou rozházené v rámci intervalu, takže se pořád něco děje.
        function applyStep(c) {
            c.stepTimer = null;
            if (c.removed || c.steps <= 0) return;
            const before = c.shown;
            c.steps--;
            c.shown = c.steps === 0 ? c.target : Math.min(c.target, Math.round(c.shown + c.chunk));
            const delta = c.shown - before;
            renderPoints(c);
            if (delta > 0) flashGain(c, delta);
            // nejdřív se dotočí číslo, pak teprve karta předběhne
            setTimeout(queueRelayout, c.visible ? REORDER_DELAY_MS : 0);
        }

        function scheduleSteps() {
            clans.forEach(c => {
                if (c.removed || c.steps <= 0 || c.stepTimer) return;
                c.stepTimer = setTimeout(() => applyStep(c), Math.random() * TICK_MS * STEP_SPREAD);
            });
        }

        function ingest(list) {
            const seen = new Set();
            list.slice(0, MAX_CLANS).forEach(d => {
                if (!d || !d.Name) return;
                const pts = Math.max(0, Math.round(Number(d.Points) || 0));
                seen.add(d.Name);
                let c = clans.get(d.Name);

                if (!c || c.removed) {
                    if (c) { stopAnim(c); c.el.remove(); clans.delete(d.Name); }
                    c = { name: d.Name, shown: pts, target: pts, lastApi: pts, chunk: 0, steps: 0, rank: -1, visible: false, fresh: true, x: 0, y: 0 };
                    clans.set(d.Name, c);
                    createCard(c, d);
                    return;
                }

                updateStatic(c, d);
                if (pts !== c.lastApi) {
                    c.lastApi = pts;
                    if (pts > c.shown) {
                        c.target = pts;
                        c.steps = SMOOTH_STEPS;
                        c.chunk = (pts - c.shown) / SMOOTH_STEPS;
                    } else {
                        // body klesly (nová bitva apod.) → hned bez animace
                        c.steps = 0;
                        c.target = c.shown = pts;
                        renderPoints(c);
                    }
                }
            });

            clans.forEach(c => { if (!seen.has(c.name)) c.removed = true; });
        }

        // ---------- DATA ----------
        let demoData = null;
        function demoFetch() {
            const countries = ["US", "CZ", "SK", "PL", "DE", "GB", "FR", "CA", "AU", "BR", "JP", "KR", "NL", "SE", "ES", "IT", "UA", "MX"];
            if (!demoData) {
                const used = new Set();
                demoData = [];
                for (let i = 0; i < 100; i++) {
                    let n;
                    do { n = Array.from({ length: 3 + (i % 2) }, () => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join(""); } while (used.has(n));
                    used.add(n);
                    demoData.push({ Name: n, Points: Math.round(18000000000 * Math.pow(0.965, i) + Math.random() * 3e7), CountryCode: countries[i % countries.length], Icon: "" });
                }
            } else {
                demoData.forEach(d => {
                    if (Math.random() < 0.6) {
                        const big = Math.random() < 0.08;
                        d.Points += Math.round((big ? 0.04 : 0.004) * d.Points * Math.random()) + Math.floor(Math.random() * 120);
                    }
                });
            }
            return Promise.resolve(demoData.map(d => ({ ...d })).sort((a, b) => b.Points - a.Points));
        }

        async function fetchTop() {
            if (DEMO) return demoFetch();
            const res = await fetch(`${WORKER_URL}/clans?page=1&pageSize=${MAX_CLANS}&sort=Points&sortOrder=desc`);
            const json = await res.json();
            if (!json || json.status !== "ok" || !Array.isArray(json.data)) throw new Error("bad data");
            return json.data;
        }

        function showStatus(text) {
            const el = document.getElementById("statusText");
            el.textContent = text || "";
            el.style.opacity = text ? "1" : "0";
        }

        async function tick() {
            nextTickAt = Date.now() + TICK_MS;
            if (document.hidden && !firstLoad) return;
            try {
                const list = await fetchTop();
                ingest(list);
                if (firstLoad) {
                    firstLoad = false;
                    sortOrder();
                    // první načtení: kaskádový nástup karet
                    order.forEach((c, rank) => {
                        c.rank = rank;
                        c.fresh = false;
                        c.visible = pageOf(rank) === page;
                        placeAt(c, slotOf(rank));
                        c.el.style.zIndex = baseZ(rank);
                        setRankText(c, rank, false);
                        if (c.visible) {
                            const i = rank % PER_PAGE;
                            animateIn(c, slotOf(rank), (Math.floor(i / ROWS) * 3 + (i % ROWS)) * 25, false);
                        }
                    });
                } else {
                    queueRelayout();
                }
                scheduleSteps();
                lastOkAt = Date.now();
                showStatus("");
            } catch (e) {
                console.warn(e);
                if (firstLoad) showStatus("Could not load data. Retrying...");
            }
        }

        function loop() {
            tick().finally(() => setTimeout(loop, Math.max(500, nextTickAt - Date.now())));
        }

        function updateBadge() {
            if (!lastOkAt) return;
            const s = Math.floor((Date.now() - lastOkAt) / 1000);
            const text = s < 60 ? `LIVE · ${s}s ago` : `LIVE · ${Math.floor(s / 60)}m ago`;
            const t = document.getElementById("liveBadgeText");
            if (t.textContent !== text) t.textContent = text;
            document.getElementById("liveBadge").classList.toggle("is-stale", s > 60);
        }

        // po návratu na záložku: srovnat čísla a pozice bez animací, pak zase normálně
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) return;
            clans.forEach(c => {
                if (c.renderedPts !== c.shown) { setNumber(c, c.renderedPts, c.shown, false); c.renderedPts = c.shown; fitNumber(c, false); }
            });
            relayout(false);
            if (Date.now() - lastOkAt > TICK_MS) tick();
        });

        computeLayout();
        loop();
        setInterval(updateBadge, 1000);

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                widthCache.clear();
                clans.forEach(c => fitNumber(c, true));
            });
        }
    </script>

    <script src="/hotbar.js"></script>
</body>
</html>
