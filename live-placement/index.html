<!DOCTYPE html>
<html lang="en">
<head>

    <title>PS99 Clans - Live Top 100</title>
    <script>

        window.odometerOptions = { auto: false };

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700;800&family=Roboto:wght@800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif !important;
            font-weight: 600;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overscroll-behavior: none !important;
            touch-action: none;
        }

        body {
            background-color: #89b3f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---------- ŠKÁLOVÁNÍ (celá scéna se vejde do okna) ---------- */
        .app-scaler {
            position: relative;
            transform-origin: center center;
            flex-shrink: 0;
        }

        .stage {
            position: relative;
            width: 1852px;
            height: 903px;
        }

        .board {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #FFFFFF 0%, #F6F7F9 100%);
            border: 6px solid #2A2B31;
            border-radius: 24px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.35);
        }

        .clans-logo {
            position: absolute;
            left: -36px;
            top: -69px;
            width: 315px;
            height: 117px;
            background: url("/images/clans-logo.png") no-repeat center center;
            background-size: 100% 100%;
            z-index: 998;
            cursor: pointer;
        }

        .close-btn {
            position: absolute;
            right: -34px;
            top: -30px;
            width: 72px;
            height: 73px;
            background: url("/images/X.png") no-repeat center center;
            background-size: 100% 100%;
            cursor: pointer;
            z-index: 999;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.35));
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .close-btn:hover:not(:active) { transform: scale(1.05); }
        .close-btn:active { background-image: url("/images/X-clicked.png"); transform: scale(0.92); }

        /* ---------- HLAVIČKA ---------- */
        .lp-header {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 74px;
            z-index: 500;
        }

        .stroke-text {
            color: #FFFFFF;
            -webkit-text-stroke: 7px #000000;
            stroke-linejoin: round;
            -webkit-stroke-linejoin: round;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
        }

        .lp-title {
            position: absolute;
            left: 50%;
            top: 8px;
            transform: translateX(-50%);
            font-size: 44px;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .lp-title-live { color: #FF3B3B; }

        .lp-battle {
            position: absolute;
            left: 292px;
            top: 11px;
            display: flex;
            flex-direction: column;
            line-height: 1;
        }
        .lp-battle-name {
            font-size: 24px;
            -webkit-text-stroke: 6px #000000;
        }
        .lp-battle-timer {
            font-size: 26px;
            color: #FF2B2B;
            -webkit-text-stroke: 6px #000000;
            margin-top: 2px;
        }

        .lp-right {
            position: absolute;
            right: 20px;
            top: 9px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 12px;
            box-shadow: 0 3px 0 #000000;
            font-size: 18px;
            font-weight: 700 !important;
            color: #262C2D;
            min-width: 168px;
            justify-content: center;
        }
        .live-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2ECC40;
            border: 2px solid #000000;
            animation: livePulse 1.4s infinite ease-in-out;
        }
        .live-badge.is-stale .live-dot { background: #FF4A4A; animation: none; }
        @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .page-select-bg {
            position: relative;
            width: 227px;
            height: 56px;
            background: url("/images/page-select.png") no-repeat center center;
            background-size: 100% 100%;
            image-rendering: pixelated;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page-number-text {
            font-size: 30px !important;
            font-weight: 800 !important;
            color: #FFFFFF;
            -webkit-text-stroke: 6px #2A2B31;
            stroke-linejoin: round;
            paint-order: stroke fill;
            padding-bottom: 3px;
            transition: opacity 0.18s ease;
        }
        .page-arrow {
            position: absolute;
            top: 8px;
            width: 27px;
            height: 39px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            transform-origin: center center;
            transition: transform 0.06s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s ease;
        }
        .page-arrow:hover:not(:active) { transform: scale(1.08); }
        .page-arrow:active { transform: scale(0.92); }
        .page-arrow.is-disabled { opacity: 0.35; pointer-events: none; }
        .arrow-left { left: 22px; background-image: url("/images/sipka-leva.png"); }
        .arrow-right { right: 22px; background-image: url("/images/sipka-prava.png"); }

        /* tenký pruh: odpočet do další aktualizace */
        .lp-progress {
            position: absolute;
            left: 22px;
            right: 22px;
            top: 66px;
            height: 5px;
            border-radius: 3px;
            background: rgba(42, 43, 49, 0.08);
            overflow: hidden;
        }
        .lp-progress-fill {
            height: 100%;
            width: 100%;
            border-radius: 3px;
            background: linear-gradient(to right, #6DB0E0, #92F0EB);
            transform-origin: left center;
            transform: scaleX(0);
        }

        .lp-status {
            position: absolute;
            left: 0;
            top: 420px;
            width: 100%;
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #B1B1B1;
            z-index: 600;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* ---------- MŘÍŽKA KARET ---------- */
        .lp-grid {
            position: absolute;
            left: 16px;
            top: 80px;
            width: 1808px;
            height: 801px;
        }

        .lp-card {
            position: absolute;
            left: 0;
            top: 0;
            width: 352px;
            height: 72px;
            border-radius: 12px;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
            cursor: pointer;
            will-change: transform;
        }
        .lp-card.is-hidden { visibility: hidden; pointer-events: none; }

        .lp-inner {
            position: absolute;
            inset: 0;
            background-color: #F7FFFE;
            border: 3.5px solid #000000;
            border-radius: 12px;
            box-shadow: inset 0 0 0 0 rgba(59, 225, 92, 0);
            transform-origin: center center;
            transition: background-color 2.6s cubic-bezier(0.25, 0.1, 0.25, 1),
                        box-shadow 2.6s cubic-bezier(0.25, 0.1, 0.25, 1),
                        transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .lp-card:hover .lp-inner { transform: scale(1.02); }
        .lp-card:active .lp-inner { transform: scale(0.96); }

        .lp-inner.is-gain {
            background-color: #DDFBE3;
            box-shadow: inset 0 0 18px 0 rgba(59, 225, 92, 0.45);
            transition: background-color 0.35s ease-out,
                        box-shadow 0.35s ease-out,
                        transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .lp-rank {
            position: absolute;
            left: -8px;
            top: -13px;
            font-size: 25px;
            line-height: 1;
            color: #FFFFFF;
            -webkit-text-stroke: 6px #000000;
            stroke-linejoin: round;
            -webkit-stroke-linejoin: round;
            paint-order: stroke fill;
            font-weight: 800 !important;
            pointer-events: none;
            z-index: 5;
            transform-origin: 30% 60%;
        }
        .lp-rank.is-first { color: #8AFCED; }
        .lp-rank.pop { animation: rankPop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes rankPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        .lp-icon {
            position: absolute;
            left: 7px;
            top: 6.5px;
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background-color: #FFFFFF;
            object-fit: contain;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }

        .lp-flag {
            position: absolute;
            left: 68px;
            top: 4px;
            width: 24px;
            height: 24px;
            pointer-events: none;
        }

        .lp-name {
            position: absolute;
            left: 97px;
            top: 1px;
            font-size: 23px;
            line-height: 1.1;
            color: #FEFEFE;
            -webkit-text-stroke: 6px #000000;
            stroke-linejoin: round;
            -webkit-stroke-linejoin: round;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
            pointer-events: none;
        }

        .lp-pts {
            position: absolute;
            left: 67px;
            top: 29px;
            height: 34px;
            display: flex;
            align-items: center;
            color: #262C2D;
            transition: color 2.6s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: none;
            line-height: 1;
        }
        .lp-inner.is-gain .lp-pts {
            color: #17A63E;
            transition: color 0.35s ease-out;
        }
        .lp-pts .odometer,
        .lp-pts .odometer * {
            font-family: 'Roboto', sans-serif !important;
            font-weight: 800 !important;
            color: inherit !important;
            line-height: 1 !important;
        }

        .lp-delta {
            position: absolute;
            right: 10px;
            top: 36px;
            font-size: 22px;
            line-height: 1;
            color: #3BE15C;
            -webkit-text-stroke: 5px #000000;
            stroke-linejoin: round;
            -webkit-stroke-linejoin: round;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform-origin: right center;
        }
        .lp-delta.show { animation: deltaPop 3.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes deltaPop {
            0%   { opacity: 0; transform: translateY(-50%) scale(0.5); }
            9%   { opacity: 1; transform: translateY(-50%) scale(1.15); }
            17%  { opacity: 1; transform: translateY(-50%) scale(1); }
            72%  { opacity: 1; transform: translateY(-50%) scale(1); }
            100% { opacity: 0; transform: translateY(-110%) scale(0.95); }
        }

        .ps99-feedback-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 13px;
            background: #FFFFFF;
            border: 2.5px solid #000000;
            border-radius: 9px;
            color: #000000;
            font-size: 13.5px;
            font-weight: 600 !important;
            text-decoration: none;
            box-shadow: 0 3px 0 #000000, 0 5px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1), box-shadow 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .ps99-feedback-btn:hover:not(:active) { transform: translateY(-1.5px) scale(1.02); box-shadow: 0 4.5px 0 #000000, 0 7px 12px rgba(0, 0, 0, 0.25); }
        .ps99-feedback-btn:active { transform: translateY(2px) scale(0.96); box-shadow: 0 1px 0 #000000, 0 2px 4px rgba(0, 0, 0, 0.2); }

        @media (prefers-reduced-motion: reduce) {
            .live-dot { animation: none; }
        }
    </style>
</head>
<body>

    <div class="app-scaler" id="appScaler">
        <div class="stage" id="stage">
            <div class="board">
                <div class="lp-header">
                    <div class="lp-battle">
                        <div class="lp-battle-name stroke-text" id="battleName">Loading...</div>
                        <div class="lp-battle-timer stroke-text" id="battleTimer">--h:--m:--s</div>
                    </div>

                    <div class="lp-title stroke-text">
                        <span>TOP 100 CLANS</span><span class="lp-title-live">LIVE</span>
                    </div>

                    <div class="lp-right">
                        <div class="page-select-bg">
                            <div class="page-arrow arrow-left" id="prevPageBtn"></div>
                            <span class="page-number-text" id="pageText">#1-50</span>
                            <div class="page-arrow arrow-right" id="nextPageBtn"></div>
                        </div>
                        <div class="live-badge" id="liveBadge">
                            <span class="live-dot"></span>
                            <span id="liveBadgeText">LIVE</span>
                        </div>
                    </div>

                    <div class="lp-progress"><div class="lp-progress-fill" id="progressFill"></div></div>
                </div>

                <div class="lp-status" id="statusText">Loading clans...</div>
                <div class="lp-grid" id="grid"></div>
            </div>

            <div class="clans-logo" onclick="location.href='/'"></div>
            <div class="close-btn" onclick="location.href='/'"></div>
        </div>
    </div>

    <a href="https://forms.gle/2DWB7Hzcv2XZ1PVCA" target="_blank" class="ps99-feedback-btn">FEEDBACK</a>

    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const params = new URLSearchParams(location.search);
        const DEMO = params.has("demo");   // ?demo=1 → vymyšlená data (na zkoušení animací)

        // ---------- NASTAVENÍ ----------
        const TICK_MS = DEMO ? Math.max(2, Number(params.get("tick")) || 15) * 1000 : 15000; // aktualizace každých 15 s
        const SMOOTH_STEPS = 4;          // jako live.html: rozdíl se přičte ve 4 krocích
        const STEP_SPREAD = 0.85;        // kroky jednotlivých klanů se rozprostřou do 85 % intervalu → pořád se něco přičítá
        const BATTLE_MS = 300000;        // info o bitvě jednou za 5 minut

        const COLS = 5, ROWS = 10, PER_PAGE = COLS * ROWS, MAX_CLANS = 100;
        const CARD_W = 352, CARD_H = 72, GAP_X = 12, GAP_Y = 9;
        const STAGE_W = 1852, STAGE_H = 903;
        const PTS_FIT = { width: 200, max: 34, min: 14 };

        // Animace předběhnutí: zvednout → přesunout → položit
        const MOVE_MS = 1500;
        const SHADOW_REST = "0 3px 0 rgba(0,0,0,0.18)";
        const SHADOW_LIFT = "0 22px 30px rgba(0,0,0,0.30)";

        const ICON_FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><rect width="52" height="52" fill="#fff"/><text x="26" y="34" font-family="Arial" font-weight="bold" font-size="22" text-anchor="middle" fill="#B1B1B1">?</text></svg>'
        );

        const grid = document.getElementById("grid");
        const clans = new Map();   // jméno → stav karty
        let order = [];            // seřazené klany (podle zobrazených bodů)
        let page = 1;
        let stageScale = 1;
        let lastOkAt = 0;
        let nextTickAt = 0;
        let firstLoad = true;

        // ---------- ŠKÁLOVÁNÍ ----------
        function autoFitScreen() {
            const scaler = document.getElementById("appScaler");
            const needW = STAGE_W + 110;   // místo na X tlačítko a logo
            const needH = STAGE_H + 130;
            stageScale = Math.min(window.innerWidth / needW, window.innerHeight / needH);
            scaler.style.transform = `scale(${stageScale})`;
            scaler.style.marginTop = (40 * stageScale) + "px";
        }
        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);

        // ---------- POMOCNÉ FUNKCE ----------
        function getTwemojiUrl(countryCode) {
            if (!countryCode || countryCode.length !== 2) return "https://twemoji.maxcdn.com/v/14.0.2/svg/1f1fa-1f1f8.svg";
            const cp = countryCode.toUpperCase().split("").map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65);
            return `https://twemoji.maxcdn.com/v/14.0.2/svg/${cp[0].toString(16)}-${cp[1].toString(16)}.svg`;
        }

        function getClanIconUrl(iconAsset) {
            if (!iconAsset) return ICON_FALLBACK;
            const m = String(iconAsset).match(/\d+/);
            return m ? `https://ps99.biggamesapi.io/image/${m[0]}` : ICON_FALLBACK;
        }

        function formatDelta(n) {
            if (n < 10000) return "+" + n.toLocaleString("en-US");
            const f = (v, s) => "+" + (v < 10 ? parseFloat(v.toFixed(2)) : v < 100 ? parseFloat(v.toFixed(1)) : Math.floor(v)) + s;
            if (n >= 1e9) return f(n / 1e9, "b");
            if (n >= 1e6) return f(n / 1e6, "m");
            return f(n / 1e3, "k");
        }

        // přesné měření šířky čísla v písmu Roboto (stejně jako live.html)
        const measurer = document.createElement("span");
        measurer.style.cssText = "position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-size:100px !important;font-family:'Roboto',sans-serif !important;font-weight:800 !important;";
        document.body.appendChild(measurer);

        function fitFontSize(value) {
            measurer.textContent = Number(value).toLocaleString("en-US");
            const w = measurer.offsetWidth || 1;
            const size = (100 * PTS_FIT.width * 0.97) / w;
            return Math.max(PTS_FIT.min, Math.min(PTS_FIT.max, size));
        }

        function slotOf(rank) {
            const i = rank % PER_PAGE;
            const col = Math.floor(i / ROWS);
            const row = i % ROWS;
            return { x: col * (CARD_W + GAP_X), y: row * (CARD_H + GAP_Y) };
        }

        function pageOf(rank) { return Math.floor(rank / PER_PAGE) + 1; }

        // ---------- KARTA ----------
        function createCard(c, d) {
            const el = document.createElement("div");
            el.className = "lp-card is-hidden";
            el.innerHTML = `
                <div class="lp-inner">
                    <img class="lp-icon" draggable="false">
                    <img class="lp-flag" draggable="false">
                    <div class="lp-name"></div>
                    <div class="lp-pts"><div class="odometer"></div></div>
                    <div class="lp-delta"></div>
                    <div class="lp-rank"></div>
                </div>`;
            c.el = el;
            c.inner = el.querySelector(".lp-inner");
            c.rankEl = el.querySelector(".lp-rank");
            c.iconEl = el.querySelector(".lp-icon");
            c.flagEl = el.querySelector(".lp-flag");
            c.nameEl = el.querySelector(".lp-name");
            c.odoEl = el.querySelector(".odometer");
            c.deltaEl = el.querySelector(".lp-delta");
            c.iconEl.onerror = () => { c.iconEl.onerror = null; c.iconEl.src = ICON_FALLBACK; };
            el.onclick = () => { location.href = `/clan-detail/?name=${encodeURIComponent(c.name)}`; };

            if (typeof Odometer !== "undefined") {
                c.odo = new Odometer({ el: c.odoEl, value: c.shown, format: "(,ddd)", theme: "minimal", duration: 2500 });
            } else {
                c.odoEl.textContent = c.shown.toLocaleString("en-US");
            }
            c.odoEl.style.fontSize = fitFontSize(c.shown).toFixed(1) + "px";
            c.renderedPts = c.shown;

            updateStatic(c, d);
            grid.appendChild(el);
        }

        function updateStatic(c, d) {
            const key = [d.Name, d.Icon, d.CountryCode].join("|");
            if (key === c.staticKey) return;
            c.staticKey = key;
            c.nameEl.textContent = `[${d.Name}]`;
            c.iconEl.src = getClanIconUrl(d.Icon);
            c.flagEl.src = getTwemojiUrl(d.CountryCode);
        }

        function renderPoints(c) {
            if (c.renderedPts === c.shown) return;
            c.renderedPts = c.shown;
            c.odoEl.style.fontSize = fitFontSize(c.shown).toFixed(1) + "px";
            if (c.odo) c.odo.update(c.shown);
            else c.odoEl.textContent = c.shown.toLocaleString("en-US");
        }

        function flashGain(c, delta) {
            // zbarvení celé karty + čísla
            c.inner.classList.remove("is-gain");
            void c.inner.offsetWidth;
            c.inner.classList.add("is-gain");
            clearTimeout(c.gainTimer);
            c.gainTimer = setTimeout(() => c.inner.classList.remove("is-gain"), 1400);

            // zelené "+x" vpravo
            c.deltaEl.textContent = formatDelta(delta);
            c.deltaEl.classList.remove("show");
            void c.deltaEl.offsetWidth;
            c.deltaEl.classList.add("show");
        }

        function setRankText(c, rank, pop) {
            const txt = `#${rank + 1}`;
            if (c.rankEl.textContent === txt) return;
            c.rankEl.textContent = txt;
            c.rankEl.classList.toggle("is-first", rank === 0);
            if (pop) {
                c.rankEl.classList.remove("pop");
                void c.rankEl.offsetWidth;
                c.rankEl.classList.add("pop");
            }
        }

        // ---------- ROZMÍSTĚNÍ + ANIMACE ----------
        // vrací aktuální viditelnou pozici středu karty v souřadnicích mřížky (i uprostřed animace)
        function visualCenter(c, gridRect) {
            const r = c.el.getBoundingClientRect();
            return {
                x: (r.left + r.width / 2 - gridRect.left) / stageScale,
                y: (r.top + r.height / 2 - gridRect.top) / stageScale,
                s: r.width / (CARD_W * stageScale) || 1
            };
        }

        function stopAnim(c) {
            if (c.anim) { c.anim.cancel(); c.anim = null; }
            clearTimeout(c.rankTimer);
        }

        function animateMove(c, from, to, kind) {
            const dx = from.x - (to.x + CARD_W / 2);
            const dy = from.y - (to.y + CARD_H / 2);
            const s0 = from.s;
            stopAnim(c);
            c.el.style.left = to.x + "px";
            c.el.style.top = to.y + "px";

            let frames;
            if (kind === "lift") {
                // zvednout → přenést o příčku výš → položit (s lehkým dosednutím)
                c.el.style.zIndex = 400;
                frames = [
                    { offset: 0,    transform: `translate(${dx}px, ${dy}px) scale(${s0})`,      boxShadow: SHADOW_REST, easing: "cubic-bezier(0.3, 0.7, 0.4, 1)" },
                    { offset: 0.2,  transform: `translate(${dx}px, ${dy - 7}px) scale(1.09)`,   boxShadow: SHADOW_LIFT, easing: "cubic-bezier(0.65, 0, 0.35, 1)" },
                    { offset: 0.76, transform: `translate(0px, -7px) scale(1.09)`,              boxShadow: SHADOW_LIFT, easing: "cubic-bezier(0.55, 0, 0.8, 0.3)" },
                    { offset: 0.88, transform: `translate(0px, 1px) scale(0.98)`,               boxShadow: SHADOW_REST, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" },
                    { offset: 1,    transform: `translate(0px, 0px) scale(1)`,                  boxShadow: SHADOW_REST }
                ];
            } else {
                // předběhnutá karta se plynule "podsune" o příčku níž
                c.el.style.zIndex = 300;
                frames = [
                    { offset: 0,    transform: `translate(${dx}px, ${dy}px) scale(${s0})`, easing: "cubic-bezier(0.4, 0, 0.6, 1)" },
                    { offset: 0.2,  transform: `translate(${dx}px, ${dy}px) scale(0.97)`, easing: "cubic-bezier(0.65, 0, 0.35, 1)" },
                    { offset: 0.76, transform: `translate(0px, 0px) scale(0.97)`, easing: "cubic-bezier(0.3, 0.7, 0.4, 1)" },
                    { offset: 1,    transform: `translate(0px, 0px) scale(1)` }
                ];
            }

            const anim = c.el.animate(frames, { duration: MOVE_MS, fill: "none" });
            c.anim = anim;
            c.rankTimer = setTimeout(() => setRankText(c, c.rank, true), MOVE_MS * 0.8);
            anim.onfinish = () => {
                if (c.anim !== anim) return;
                c.anim = null;
                c.el.style.zIndex = baseZ(c.rank);
            };
        }

        function animateIn(c, to, delay, lifted) {
            stopAnim(c);
            c.el.style.left = to.x + "px";
            c.el.style.top = to.y + "px";
            c.el.style.zIndex = lifted ? 400 : baseZ(c.rank);
            c.el.classList.remove("is-hidden");
            setRankText(c, c.rank, false);
            const frames = lifted
                ? [
                    { offset: 0,    opacity: 0, transform: "translateY(-14px) scale(1.12)", boxShadow: SHADOW_LIFT },
                    { offset: 0.55, opacity: 1, transform: "translateY(-7px) scale(1.09)",  boxShadow: SHADOW_LIFT, easing: "cubic-bezier(0.55, 0, 0.8, 0.3)" },
                    { offset: 0.8,  opacity: 1, transform: "translateY(1px) scale(0.98)",   boxShadow: SHADOW_REST, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" },
                    { offset: 1,    opacity: 1, transform: "translateY(0) scale(1)",        boxShadow: SHADOW_REST }
                  ]
                : [
                    { opacity: 0, transform: "translateY(10px) scale(0.92)" },
                    { opacity: 1, transform: "translateY(0) scale(1)" }
                  ];
            const anim = c.el.animate(frames, {
                duration: lifted ? MOVE_MS * 0.8 : 520,
                delay: delay || 0,
                easing: lifted ? "linear" : "cubic-bezier(0.2, 0.8, 0.2, 1)",
                fill: "backwards"
            });
            c.anim = anim;
            anim.onfinish = () => {
                if (c.anim !== anim) return;
                c.anim = null;
                c.el.style.zIndex = baseZ(c.rank);
            };
        }

        function animateOut(c, delay) {
            stopAnim(c);
            const anim = c.el.animate(
                [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(0.92)" }],
                { duration: 260, delay: delay || 0, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" }
            );
            c.anim = anim;
            anim.onfinish = () => {
                if (c.anim !== anim) return;
                c.el.classList.add("is-hidden");
                anim.cancel();
                c.anim = null;
                if (c.removed) c.el.remove();
            };
        }

        // nižší karta musí být nad vyšší, aby přes ni přečuhovalo pořadí "#x"
        function baseZ(rank) { return 10 + (rank % PER_PAGE); }

        function sortOrder() {
            order = [...clans.values()]
                .filter(c => !c.removed)
                .sort((a, b) => (b.shown - a.shown) || (b.lastApi - a.lastApi) || a.name.localeCompare(b.name))
                .slice(0, MAX_CLANS);
        }

        function relayout(animate) {
            const prev = new Map();
            order.forEach((c, i) => prev.set(c, i));
            sortOrder();

            const gridRect = grid.getBoundingClientRect();
            const jobs = [];

            // nejdřív jen čteme pozice (bez zápisů → žádné zbytečné přepočty layoutu)
            order.forEach((c, rank) => {
                const oldRank = c.rank;
                const wasVisible = !c.el.classList.contains("is-hidden") && c.visible;
                const nowVisible = pageOf(rank) === page;
                if (oldRank === rank && wasVisible === nowVisible && !c.fresh) return;
                const from = (animate && wasVisible && nowVisible) ? visualCenter(c, gridRect) : null;
                jobs.push({ c, rank, oldRank, wasVisible, nowVisible, from });
            });

            jobs.forEach(({ c, rank, oldRank, wasVisible, nowVisible, from }) => {
                const to = slotOf(rank);
                c.rank = rank;
                c.visible = nowVisible;
                const isFresh = c.fresh;
                c.fresh = false;

                if (!nowVisible) {
                    if (wasVisible && animate) animateOut(c, 0);
                    else { stopAnim(c); c.el.classList.add("is-hidden"); }
                    c.el.style.left = to.x + "px";
                    c.el.style.top = to.y + "px";
                    c.el.style.zIndex = baseZ(rank);
                    setRankText(c, rank, false);
                    return;
                }

                if (!animate) {
                    stopAnim(c);
                    c.el.style.left = to.x + "px";
                    c.el.style.top = to.y + "px";
                    c.el.style.zIndex = baseZ(rank);
                    c.el.classList.remove("is-hidden");
                    setRankText(c, rank, false);
                    return;
                }

                if (!wasVisible) {
                    // přišla z jiné stránky (#51 → #50) nebo je nově v top 100
                    const climbed = !isFresh && oldRank > rank;
                    animateIn(c, to, 0, climbed);
                    return;
                }

                animateMove(c, from, to, rank < oldRank ? "lift" : "slide");
            });

            // klany, které vypadly z top 100
            clans.forEach(c => {
                if (c.removed && !order.includes(c) && !c.gone) {
                    c.gone = true;
                    if (c.visible) animateOut(c, 0); else c.el.remove();
                    setTimeout(() => clans.delete(c.name), 400);
                }
            });
        }

        // přepnutí stránky (#1-50 / #51-100) – kaskádový nástup karet
        function showPage(p) {
            if (p === page || p < 1 || p > 2) return;
            page = p;
            document.getElementById("pageText").textContent = p === 1 ? "#1-50" : "#51-100";
            document.getElementById("prevPageBtn").classList.toggle("is-disabled", p === 1);
            document.getElementById("nextPageBtn").classList.toggle("is-disabled", p === 2);

            order.forEach((c, rank) => {
                const vis = pageOf(rank) === page;
                if (c.visible && !vis) animateOut(c, 0);
                c.visible = vis;
            });
            setTimeout(() => {
                order.forEach((c, rank) => {
                    if (pageOf(rank) !== page) return;
                    const i = rank % PER_PAGE;
                    const col = Math.floor(i / ROWS), row = i % ROWS;
                    c.rank = rank;
                    animateIn(c, slotOf(rank), (col * 3 + row) * 22, false);
                });
            }, 240);
        }

        document.getElementById("prevPageBtn").onclick = () => showPage(page - 1);
        document.getElementById("nextPageBtn").onclick = () => showPage(page + 1);
        document.getElementById("prevPageBtn").classList.add("is-disabled");
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft") showPage(page - 1);
            if (e.key === "ArrowRight") showPage(page + 1);
        });

        // ---------- PLYNULÉ PŘIČÍTÁNÍ (stejný princip jako live.html) ----------
        // Nová hodnota z API se rozdělí na 4 stejné kusy; každých 15 s se přičte jeden.
        // Kroky jednotlivých klanů jsou rozházené v rámci intervalu, takže se pořád něco děje.
        function applyStep(c) {
            c.stepTimer = null;
            if (c.removed || c.steps <= 0) return;
            const before = c.shown;
            c.steps--;
            c.shown = c.steps === 0 ? c.target : Math.min(c.target, Math.round(c.shown + c.chunk));
            const delta = c.shown - before;
            renderPoints(c);
            if (delta > 0) flashGain(c, delta);
            relayout(true);
        }

        function scheduleSteps() {
            clans.forEach(c => {
                if (c.removed || c.steps <= 0 || c.stepTimer) return;
                const wait = Math.random() * TICK_MS * STEP_SPREAD;
                c.stepTimer = setTimeout(() => applyStep(c), wait);
            });
        }

        function ingest(list) {
            const seen = new Set();
            list.slice(0, MAX_CLANS).forEach(d => {
                if (!d || !d.Name) return;
                const pts = Math.max(0, Math.round(Number(d.Points) || 0));
                seen.add(d.Name);
                let c = clans.get(d.Name);

                if (!c || c.removed) {
                    if (c && c.removed) { c.el.remove(); clans.delete(d.Name); }
                    c = { name: d.Name, shown: pts, target: pts, lastApi: pts, chunk: 0, steps: 0, rank: -1, visible: false, fresh: true };
                    clans.set(d.Name, c);
                    createCard(c, d);
                    return;
                }

                updateStatic(c, d);
                if (pts !== c.lastApi) {
                    c.lastApi = pts;
                    if (pts > c.shown) {
                        c.target = pts;
                        c.steps = SMOOTH_STEPS;
                        c.chunk = (pts - c.shown) / SMOOTH_STEPS;
                    } else {
                        // body klesly (nová bitva apod.) → hned bez animace
                        c.steps = 0;
                        c.target = c.shown = pts;
                        renderPoints(c);
                    }
                }
            });

            clans.forEach(c => { if (!seen.has(c.name)) c.removed = true; });
        }

        // ---------- DATA ----------
        let demoData = null;
        function demoFetch() {
            const countries = ["US", "CZ", "SK", "PL", "DE", "GB", "FR", "CA", "AU", "BR", "JP", "KR", "NL", "SE", "ES", "IT", "UA", "MX"];
            if (!demoData) {
                const used = new Set();
                demoData = [];
                for (let i = 0; i < 100; i++) {
                    let n;
                    do { n = Array.from({ length: 3 + (i % 2) }, () => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join(""); } while (used.has(n));
                    used.add(n);
                    demoData.push({ Name: n, Points: Math.round(180000000 * Math.pow(0.965, i) + Math.random() * 300000), CountryCode: countries[i % countries.length], Icon: "" });
                }
            } else {
                demoData.forEach(d => {
                    if (Math.random() < 0.45) {
                        const big = Math.random() < 0.08;
                        d.Points += Math.round((big ? 0.04 : 0.004) * d.Points * Math.random()) + Math.floor(Math.random() * 120);
                    }
                });
            }
            return Promise.resolve([...demoData].sort((a, b) => b.Points - a.Points).map(d => ({ ...d })));
        }

        async function fetchTop() {
            if (DEMO) return demoFetch();
            const res = await fetch(`${WORKER_URL}/clans?page=1&pageSize=${MAX_CLANS}&sort=Points&sortOrder=desc`);
            const json = await res.json();
            if (!json || json.status !== "ok" || !Array.isArray(json.data)) throw new Error("bad data");
            return json.data;
        }

        function showStatus(text) {
            const el = document.getElementById("statusText");
            el.textContent = text || "";
            el.style.opacity = text ? "1" : "0";
        }

        async function tick() {
            nextTickAt = Date.now() + TICK_MS;
            startProgress();
            if (document.hidden && !firstLoad) return;
            try {
                const list = await fetchTop();
                ingest(list);
                if (firstLoad) {
                    firstLoad = false;
                    sortOrder();
                    // první načtení: kaskádový nástup karet
                    order.forEach((c, rank) => {
                        c.rank = rank;
                        c.fresh = false;
                        c.visible = pageOf(rank) === page;
                        const to = slotOf(rank);
                        c.el.style.left = to.x + "px";
                        c.el.style.top = to.y + "px";
                        setRankText(c, rank, false);
                        if (c.visible) {
                            const i = rank % PER_PAGE;
                            animateIn(c, to, (Math.floor(i / ROWS) * 3 + (i % ROWS)) * 28, false);
                        }
                    });
                } else {
                    relayout(true);
                }
                scheduleSteps();
                lastOkAt = Date.now();
                showStatus("");
            } catch (e) {
                console.warn(e);
                if (firstLoad) showStatus("Could not load data. Retrying...");
            }
        }

        function loop() {
            tick().finally(() => setTimeout(loop, Math.max(500, nextTickAt - Date.now())));
        }

        // pruh s odpočtem do další aktualizace
        function startProgress() {
            const fill = document.getElementById("progressFill");
            fill.getAnimations().forEach(a => a.cancel());
            fill.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: TICK_MS, easing: "linear", fill: "forwards" });
        }

        // ---------- BITVA ----------
        let battleFinish = 0;
        async function fetchBattle() {
            if (DEMO) {
                document.getElementById("battleName").textContent = "Demo Battle";
                battleFinish = Date.now() / 1000 + 3 * 86400 + 4 * 3600;
                return;
            }
            try {
                const res = await fetch(`${WORKER_URL}/activeClanBattle`);
                const json = await res.json();
                if (json && json.status === "ok" && json.data) {
                    const b = json.data;
                    const title = (b.configData && b.configData.Title) || b.Title || b.configName || "Clan Battle";
                    document.getElementById("battleName").textContent = title;
                    battleFinish = (b.configData && b.configData.FinishTime) || b.FinishTime || 0;
                }
            } catch (e) {}
        }

        function updateTimer() {
            const el = document.getElementById("battleTimer");
            if (!battleFinish) { el.textContent = "--h:--m:--s"; return; }
            const diff = battleFinish * 1000 - Date.now();
            if (diff <= 0) { el.textContent = "ENDED!"; return; }
            const s = Math.floor(diff / 1000) % 60, m = Math.floor(diff / 60000) % 60;
            const h = Math.floor(diff / 3600000) % 24, d = Math.floor(diff / 86400000);
            el.textContent = (d > 0 ? `${d}d:` : "") + `${String(h).padStart(2, "0")}h:${String(m).padStart(2, "0")}m:${String(s).padStart(2, "0")}s`;
        }

        function updateBadge() {
            const badge = document.getElementById("liveBadge");
            const text = document.getElementById("liveBadgeText");
            if (!lastOkAt) return;
            const s = Math.floor((Date.now() - lastOkAt) / 1000);
            text.textContent = s < 60 ? `LIVE · ${s}s ago` : `LIVE · ${Math.floor(s / 60)}m ago`;
            badge.classList.toggle("is-stale", s > 60);
        }

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && Date.now() - lastOkAt > TICK_MS) tick();
        });

        window.addEventListener("DOMContentLoaded", () => {
            autoFitScreen();
            loop();
            fetchBattle();
            setInterval(fetchBattle, BATTLE_MS);
            setInterval(() => { updateTimer(); updateBadge(); }, 1000);
            updateTimer();

            if (document.fonts && document.fonts.load) {
                document.fonts.load("800 100px Roboto").then(() => {
                    clans.forEach(c => { c.odoEl.style.fontSize = fitFontSize(c.shown).toFixed(1) + "px"; });
                }).catch(() => {});
            }
        });
    </script>
</body>
