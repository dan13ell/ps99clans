<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M5T889PLGJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-M5T889PLGJ');

    <link rel="icon" href="/images/favicon.png" type="image/png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PS99 Clans - Live Top 500</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Roboto:wght@800&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/images/page-select.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif !important;
            font-weight: 600;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden !important;
            position: fixed;
            inset: 0;
            overscroll-behavior: none !important;
            touch-action: none;
            background-color: #89b3f9;
        }

        /* ---------- SCÉNA ---------- */
        .stage {
            position: fixed;
            inset: 0;
        }

        /* Mřížka je navržená v pevných rozměrech (karta 372×72) a celá se zvětší/zmenší
           podle místa → karty mají vždy stejný poměr stran a nikdy se nezplácnou. */
        .lp-grid {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 0 0;
            --k: 1;                          /* zvětšení obsahu karty */
            --u: calc(var(--k) * 1px);       /* 1 designový pixel */
            --cw: 372px;                     /* šířka karty na obrazovce */
            --ch: 72px;                      /* výška karty na obrazovce */
        }


        .lp-card {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--cw);
            height: var(--ch);
            cursor: pointer;
            contain: layout style;
        }

        /* stín + zlatý okraj při zvednutí – animuje se jen průhlednost (levné) */
        .lp-lift-shadow {
            position: absolute;
            inset: 0;
            border-radius: calc(12 * var(--u));
            box-shadow: 0 calc(24 * var(--u)) calc(34 * var(--u)) rgba(0, 0, 0, 0.34),
                        0 0 0 calc(3 * var(--u)) #FFD84A,
                        0 0 calc(20 * var(--u)) calc(5 * var(--u)) rgba(255, 216, 74, 0.55);
            opacity: 0;
            pointer-events: none;
        }

        /* kroužek, který se rozplyne při položení karty */
        .lp-ring {
            position: absolute;
            inset: 0;
            border-radius: calc(12 * var(--u));
            border: calc(3 * var(--u)) solid #FFD84A;
            opacity: 0;
            pointer-events: none;
        }

        .lp-inner {
            position: absolute;
            inset: 0;
            background-color: #F7FFFE;
            border: calc(3.5 * var(--u)) solid #000000;
            border-radius: calc(12 * var(--u));
            box-shadow: 0 calc(3 * var(--u)) 0 rgba(0, 0, 0, 0.18);
            transform-origin: center center;
            transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .lp-card:hover .lp-inner { transform: scale(1.02); }
        .lp-card:active .lp-inner { transform: scale(0.96); }

        /* zelené zbarvení karty při přičtení – jen opacity */
        .lp-glow {
            position: absolute;
            inset: 0;
            border-radius: calc(8.5 * var(--u));
            background: radial-gradient(ellipse at 40% 50%, rgba(140, 245, 160, 0.55) 0%, rgba(110, 235, 140, 0.38) 60%, rgba(70, 220, 110, 0.45) 100%);
            opacity: 0;
            transition: opacity 2.4s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: none;
        }
        .lp-inner.is-gain .lp-glow { opacity: 1; transition: opacity 0.3s ease-out; }

        /* obsah karty je navržený v jednotkách 365×65 (vnitřek karty 372×72) a zvětšuje se
           o --k; když je karta vyšší, zůstane obsah svisle uprostřed */
        .lp-content {
            position: absolute;
            left: 0;
            top: 50%;
            width: calc((var(--cw) - 7 * var(--u)) / var(--k));
            height: 65px;
            transform-origin: 0 0;
            transform: scale(var(--k)) translateY(-50%);
            pointer-events: none;
        }

        /* pořadí – uvnitř karty úplně vlevo, oddělené jemnou čárou */
        .lp-rank {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .lp-rank-num {
            font-size: 19px;
            line-height: 1;
            color: #FFFFFF;
            -webkit-text-stroke: 4.5px #000000;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
        }
        /* top 3 – zlatá, stříbrná, bronzová */
        .lp-rank.is-gold .lp-rank-num   { color: #FFD43B; }
        .lp-rank.is-silver .lp-rank-num { color: #DCE3EC; }
        .lp-rank.is-bronze .lp-rank-num { color: #F29A4A; }

        /* zelená šipka nahoru po předběhnutí (nad číslem pořadí) */
        .lp-up {
            position: absolute;
            left: calc(50% - 6.5px);
            top: 6px;
            font-size: 13px;
            line-height: 1;
            color: #3BE15C;
            -webkit-text-stroke: 5px #000000;
            paint-order: stroke fill;
            font-weight: 800 !important;
            opacity: 0;
        }

        .lp-icon {
            position: absolute;
            left: 46px;
            top: 9.5px;
            width: 46px;
            height: 46px;
            border-radius: 9px;
            background-color: #FFFFFF;
            object-fit: contain;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.12);
        }

        .lp-flag {
            position: absolute;
            left: 101px;
            top: 6px;
            width: 16px;
            height: 16px;
        }

        .lp-name {
            position: absolute;
            left: 122px;
            top: 4.5px;
            font-size: 15px;
            line-height: 1.2;
            color: #FEFEFE;
            -webkit-text-stroke: 4px #000000;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
        }

        /* číslo (originální odometer) – je zelené a v klidu ho filtr ztmaví na #262C2D;
           při přičtení se filtr plynule uvolní → zezelená (filtr běží na GPU) */
        .lp-pts {
            position: absolute;
            left: 100px;
            top: 22px;
            height: 40px;
            display: flex;
            align-items: center;
            color: #17A63E;
            filter: saturate(0) brightness(0.3);
            transition: filter 2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .lp-inner.is-gain .lp-pts { filter: saturate(1) brightness(1); transition: filter 0.3s ease-out; }

        /* ---------- SLEDOVANÝ KLAN: černá karta, bílé body ---------- */
        .lp-inner { transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1), background-color 0.35s ease; }
        .lp-card.is-followed .lp-inner { background-color: #131A2C; }
        .lp-card.is-followed .lp-pts { filter: saturate(0) brightness(2.4); }
        .lp-card.is-followed .lp-inner.is-gain .lp-pts { filter: saturate(1.1) brightness(1.4); }

        /* kulaté tlačítko s hvězdou – ukáže se při najetí myší (na mobilu po prvním ťuknutí) */
        .lp-follow {
            position: absolute;
            right: 6px;
            top: 3px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 50%;
            box-shadow: 0 2px 0 #000000;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.85);
            transform-origin: right center;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 6;
        }
        /* větší neviditelná plocha pro kliknutí */
        .lp-follow::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; }
        .lp-follow svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #262C2D;
            stroke-width: 2.6;
            stroke-linejoin: round;
            pointer-events: none;
            transition: fill 0.15s ease;
        }
        .lp-card.is-followed .lp-follow { background: #FFD43B; }
        .lp-card.is-followed .lp-follow svg { fill: #FFFFFF; stroke: #000000; }
        .lp-card.show-follow .lp-follow { opacity: 1; transform: scale(1); pointer-events: auto; }
        @media (hover: hover) {
            .lp-card:hover .lp-follow { opacity: 1; transform: scale(1); pointer-events: auto; }
        }
        .lp-follow:hover { transform: scale(1.12) !important; }
        .lp-follow:active { transform: scale(0.9) !important; }
        /* ODOMETR – stejné chování jako odometer.js (theme minimal, "slide"):
           každá číslice má pás hodnot, nižší řády jich mají víc (točí se rychleji),
           celý pás odjede za 2 s s "ease". Rozdíl: pás je jeden textový uzel místo
           desítek elementů s vlastní GPU vrstvou → žádné sekání. */
        .num {
            display: inline-flex;
            font-family: 'Roboto', sans-serif !important;
            font-weight: 800 !important;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            white-space: nowrap;
        }
        .num * { font-family: inherit !important; font-weight: inherit !important; }
        .num .d {
            display: inline-block;
            height: 1.1em;
            overflow: hidden;
            vertical-align: top;
        }
        .num .s {
            display: block;
            white-space: pre;
            line-height: 1.1em;
        }
        .num .s.go { transition: transform 2s ease; }

        .lp-delta {
            position: absolute;
            right: 10px;
            top: 13.5px;
            font-size: 15px;
            line-height: 1;
            color: #3BE15C;
            -webkit-text-stroke: 4px #000000;
            paint-order: stroke fill;
            font-weight: 800 !important;
            white-space: nowrap;
            opacity: 0;
            transform-origin: right center;
        }


        /* ---------- SPODNÍ LIŠTA ---------- */
        /* Neviditelné "hlavní okno" se stejnou velikostí a škálováním jako na ostatních
           stránkách → hotbar.js pod něj dá lištu přesně na stejné místo a ve stejné velikosti. */
        .hb-ghost {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 700;
        }
        .hb-ghost .app-scaler { position: relative; transform-origin: center center; }
        .hb-ghost .game-window { position: relative; width: 1100px; height: 570px; }
        .hb-ghost .menu-bg { width: 1100px; height: 570px; visibility: hidden; }
        .hb-ghost .ps-hotbar { pointer-events: auto; }
        /* schování: odjede jen samotná lišta (hotbar.js měří okno, ne lištu → nic se nerozhodí) */
        .hb-ghost .ps-hotbar {
            transform: translateX(-50%) translateY(var(--hb-hide, 0px));
            transition: transform 0.6s cubic-bezier(0.22, 0.8, 0.25, 1), opacity 0.4s ease;
        }
        body.hb-hidden .hb-ghost .ps-hotbar { opacity: 0; pointer-events: none; }

        /* šipka, která schová / ukáže navigační tlačítka */
        .lp-toggle {
            position: fixed;
            left: 0;
            top: 0;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 12px;
            box-shadow: 0 3px 0 #000000;
            cursor: pointer;
            z-index: 720;
            visibility: hidden;
            transform-origin: center center;
            -webkit-tap-highlight-color: transparent;
        }
        .lp-toggle.is-ready { visibility: visible; }
        .lp-toggle-arrow {
            width: 17px;
            height: 25px;
            background: url("/images/sipka-prava.png") no-repeat center center;
            background-size: 100% 100%;
            transform: rotate(90deg);
            transition: transform 0.45s cubic-bezier(0.22, 0.8, 0.25, 1);
            pointer-events: none;
        }
        body.hb-hidden .lp-toggle-arrow { transform: rotate(-90deg); }
        .lp-toggle-inner { display: flex; transition: transform 0.044s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .lp-toggle:hover .lp-toggle-inner { transform: scale(1.1); }
        .lp-toggle:active .lp-toggle-inner { transform: scale(0.9); }

        .lp-side.is-moving, .lp-toggle.is-moving { transition: transform 0.6s cubic-bezier(0.22, 0.8, 0.25, 1); }

        /* LIVE odznak a přepínač stránek – vlevo a vpravo ve výšce hotbaru */
        .lp-side {
            position: fixed;
            top: 0;
            display: flex;
            align-items: center;
            z-index: 710;
            visibility: hidden;
        }
        .lp-side.is-ready { visibility: visible; }
        .lp-side-left { left: 0; transform-origin: left center; }
        .lp-side-right { right: 0; transform-origin: right center; }

        .live-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 7px 14px;
            min-width: 170px;
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 12px;
            box-shadow: 0 3px 0 #000000;
            font-size: 18px;
            font-weight: 700 !important;
            color: #262C2D;
        }
        .live-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2ECC40;
            border: 2px solid #000000;
            animation: livePulse 1.4s infinite ease-in-out;
        }
        .live-badge.is-stale .live-dot { background: #FF4A4A; animation: none; }
        @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .page-select-bg {
            position: relative;
            width: 227px;
            height: 56px;
            background: url("/images/page-select.png") no-repeat center center;
            background-size: 100% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page-number-text {
            font-size: 24px !important;
            font-weight: 800 !important;
            color: #FFFFFF;
            -webkit-text-stroke: 6px #2A2B31;
            paint-order: stroke fill;
            padding-bottom: 3px;
            white-space: nowrap;
        }
        .page-arrow {
            position: absolute;
            top: 8px;
            width: 27px;
            height: 39px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: transform 0.06s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s ease;
        }
        .page-arrow:hover:not(:active) { transform: scale(1.08); }
        .page-arrow:active { transform: scale(0.92); }
        .page-arrow.is-disabled { opacity: 0.35; pointer-events: none; }
        .arrow-left { left: 18px; background-image: url("/images/sipka-leva.png"); }
        .arrow-right { right: 18px; background-image: url("/images/sipka-prava.png"); }

        .lp-status {
            position: absolute;
            left: 0;
            right: 0;
            top: 42%;
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            color: #FFFFFF;
            -webkit-text-stroke: 6px #000000;
            paint-order: stroke fill;
            z-index: 600;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="stage" id="stage">
        <div class="lp-grid" id="grid"></div>
        <div class="lp-status" id="statusText">Loading clans...</div>

    </div>

    <div class="lp-side lp-side-left" id="sideLeft">
        <div class="live-badge" id="liveBadge">
            <span class="live-dot"></span>
            <span id="liveBadgeText">LIVE</span>
        </div>
    </div>

    <div class="lp-side lp-side-right" id="sideRight">
        <div class="page-select-bg">
            <div class="page-arrow arrow-left is-disabled" id="prevPageBtn"></div>
            <span class="page-number-text" id="pageText">#1-50</span>
            <div class="page-arrow arrow-right" id="nextPageBtn"></div>
        </div>
    </div>

    <div class="lp-toggle" id="hbToggle" role="button" aria-label="Hide navigation">
        <div class="lp-toggle-inner"><div class="lp-toggle-arrow"></div></div>
    </div>

    <!-- neviditelné okno jen kvůli umístění hotbaru (stejně jako na ostatních stránkách) -->
    <div class="hb-ghost">
        <div class="app-scaler" id="appScaler">
            <div class="game-window"><div class="menu-bg"></div></div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const params = new URLSearchParams(location.search);
        const DEMO = params.has("demo");   // ?demo=1 → vymyšlená data, ?tick=4 → rychlejší aktualizace

        // ---------- NASTAVENÍ ----------
        const TICK_MS = DEMO ? Math.max(2, Number(params.get("tick")) || 15) * 1000 : 15000; // stažení dat každých 15 s
        const STEP_MS = TICK_MS;         // jeden krok přičtení každých 15 s
        const SMOOTH_STEPS = 4;          // nový přírůstek = 4 kroky → rozloží se na 1 minutu
        const FETCH_TIMEOUT_MS = 10000;  // déle čekat na odpověď nemá smysl
        const RESET_DROP = 0.5;          // pokles pod 50 % = nová bitva → srovnat hned; menší pokles = starší data → ignorovat
        const ODO_MS = 2500;             // odometer jako v live.html
        const REORDER_DELAY_MS = 2300;   // předběhnutí až po dotočení čísla
        const MOVE_MS = 1700;            // zvednout → přesunout → položit

        const MAX_CLANS = 500;
        const COLS = 5, ROWS = 10, PER_PAGE = COLS * ROWS, PAGES = MAX_CLANS / PER_PAGE;
        // karta 372×72, mřížka 5×10 – navržená v pevných rozměrech, zvětšuje se jako celek
        const CW = 372, CH = 72;
        const GAP_PX_X = 8, GAP_PX_Y = 6;   // mezery mezi kartami na obrazovce (px) – nezávisle na zvětšení
        let CARD_W = 372, CARD_H = 72;       // skutečná velikost karty na obrazovce (dopočítá se)
        const BAR_MARGIN = 10;           // mezera mezi kartami a spodními ovládacími prvky
        const LABEL_SPACE = 26;          // místo na popisek tlačítka (zobrazí se nad ikonou při najetí myší)
        const MOBILE_BREAK = 1150;       // stejná hranice jako na ostatních stránkách

        const ICON_FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><rect width="52" height="52" fill="#fff"/><text x="26" y="34" font-family="Arial" font-weight="bold" font-size="22" text-anchor="middle" fill="#B1B1B1">?</text></svg>'
        );

        const stage = document.getElementById("stage");
        const grid = document.getElementById("grid");
        const clans = new Map();   // jméno → stav (všech až 500 klanů; DOM má jen viditelná stránka)
        const rendered = new Set(); // klany, které mají kartu v DOM
        let order = [];
        let page = 1;
        let lastOkAt = 0;
        let nextTickAt = 0;
        let firstLoad = true;

        let U = 1;                       // zvětšení obsahu karty (k)
        let PTS_W = 365 - 100 - 10;      // šířka pro číslo bodů (v jednotkách obsahu)
        let hbHidden = false;
        try { hbHidden = localStorage.getItem("lpHotbarHidden") === "1"; } catch (e) {}
        document.body.classList.toggle("hb-hidden", hbHidden);

        // ---------- HOTBAR (stejné škálování okna jako hlavní menu) ----------
        function autoFitScreen() {
            const scaler = document.getElementById("appScaler");
            const winW = window.innerWidth, winH = window.innerHeight;
            if (winW >= MOBILE_BREAK) {
                document.body.classList.remove("is-mobile");
                scaler.style.transform = "none";
                return;
            }
            document.body.classList.add("is-mobile");
            scaler.style.transform = `scale(${Math.min(winW / 1120, winH / 960) * 0.92})`;
        }

        // kde je hotbar (ikony) – bez ohledu na to, jestli je zrovna odsunutý dolů
        function hotbarBox() {
            const btns = document.querySelectorAll(".hb-ghost .ps-hb-btn");
            if (!btns.length) return null;
            const bar = document.querySelector(".hb-ghost .ps-hotbar");
            const m0 = /scale\(([\d.]+)\)/.exec(document.getElementById("appScaler").style.transform || "");
            const sc = m0 ? parseFloat(m0[1]) : 1;
            const shift = bar ? (new DOMMatrix(getComputedStyle(bar).transform).m42 || 0) * sc : 0;
            let top = Infinity, bottom = -Infinity, right = -Infinity;
            btns.forEach(b => {
                const r = b.getBoundingClientRect();
                top = Math.min(top, r.top - shift); bottom = Math.max(bottom, r.bottom - shift); right = Math.max(right, r.right);
            });
            const m = /scale\(([\d.]+)\)/.exec(document.getElementById("appScaler").style.transform || "");
            return { top, bottom, right, s: m ? parseFloat(m[1]) : 1 };
        }

        // ---------- ROZMĚRY ----------
        // Spodní řada: buď hotbar (LIVE vlevo, stránky vpravo, šipka vedle hotbaru),
        // nebo po schování jen tenký pruh s LIVE, šipkou a stránkami.
        function computeLayout(animate) {
            const winW = window.innerWidth, winH = window.innerHeight;
            const box = hotbarBox();
            const s = box ? box.s : (winW < MOBILE_BREAK ? Math.min(winW / 1120, winH / 960) * 0.92 : 1);
            const stripCy = winH - 40 * s;                      // střed tenkého pruhu
            const barCy = box ? (box.top + box.bottom) / 2 : stripCy;
            const cy = stripCy;                                 // LIVE a stránky vždy úplně dole
            const togCy = hbHidden ? stripCy : barCy;           // šipka vedle lišty / dole
            const bottomLimit = hbHidden ? winH - 80 * s : (box ? box.top - LABEL_SPACE * s : winH - 160 * s);

            // lišta odjede dolů pod okraj (posun je uvnitř zmenšeného okna → děleno s)
            const bar = document.querySelector(".hb-ghost .ps-hotbar");
            if (bar) bar.style.setProperty("--hb-hide", hbHidden && box ? Math.ceil((winH - box.top + 40) / s) + "px" : "0px");

            // LIVE, stránky a šipka
            const left = document.getElementById("sideLeft"), right = document.getElementById("sideRight");
            const tog = document.getElementById("hbToggle");
            [left, right, tog].forEach(el => el.classList.toggle("is-moving", !!animate));
            const pad = 22 * s;
            left.style.transform = `translate(${pad}px, ${cy}px) translateY(-50%) scale(${s})`;
            right.style.transform = `translate(${-pad}px, ${cy}px) translateY(-50%) scale(${s})`;
            const tx = hbHidden || !box ? winW / 2 : box.right + 26 * s + 23 * s;
            tog.style.transform = `translate(${tx - 23}px, ${togCy - 23}px) scale(${s})`;
            [left, right, tog].forEach(el => el.classList.add("is-ready"));

            // PC: karty přes celou šířku a celou volnou výšku (mezery přesně 8 px a 6 px).
            // Mobil: stejné karty jako na PC (rozlišení 1920 px), jen celá mřížka zmenšená.
            const mobile = winW < MOBILE_BREAK;
            const top = 8 * s;
            const availW = winW - 16 * s;
            const availH = Math.max(60, bottomLimit - BAR_MARGIN * s - top);
            let cw, ch;
            if (mobile) {
                cw = (1920 - 16 - (COLS - 1) * GAP_PX_X) / COLS;
                ch = cw * 0.2;
            } else {
                cw = (availW - (COLS - 1) * GAP_PX_X) / COLS;
                ch = (availH - (ROWS - 1) * GAP_PX_Y) / ROWS;
                if (ch < cw * 0.16) cw = ch / 0.16;       // aby karta nebyla placka → raději užší
                if (ch > cw * 0.28) ch = cw * 0.28;       // a ne zbytečně vysoká
            }
            const k = Math.max(0.05, Math.min(cw / 372, ch / 72));
            const gridW = COLS * cw + (COLS - 1) * GAP_PX_X;
            const gridH = ROWS * ch + (ROWS - 1) * GAP_PX_Y;
            const M = mobile ? Math.min(availW / gridW, availH / gridH) : 1;   // zmenšení celé mřížky
            const gx = (winW - gridW * M) / 2;
            // na mobilu s lištou sedí mřížka hned nad ní (jako hlavní okno na ostatních stránkách)
            const gy = mobile && !hbHidden ? top + availH - gridH * M : top + (availH - gridH * M) / 2;

            // plynulý přechod: karty se hned přestaví na novou velikost a celá mřížka
            // (jedna vrstva na grafické kartě) se dopočítá ze staré polohy/velikosti → žádné sekání
            const old = gridBox;
            gridBox = { x: gx, y: gy, w: gridW * M, h: gridH * M };
            if (gridAnim) { gridAnim.cancel(); gridAnim = null; }
            const finalT = `translate(${gx.toFixed(1)}px, ${gy.toFixed(1)}px) scale(${M.toFixed(4)})`;
            grid.style.transform = finalT;
            if (animate && old && !document.hidden) {
                const sx = old.w / gridBox.w, sy = old.h / gridBox.h;
                gridAnim = grid.animate([
                    { transform: `translate(${old.x.toFixed(1)}px, ${old.y.toFixed(1)}px) scale(${(M * sx).toFixed(4)}, ${(M * sy).toFixed(4)})` },
                    { transform: finalT }
                ], { duration: 600, easing: "cubic-bezier(0.22, 0.8, 0.25, 1)" });
                gridAnim.onfinish = () => { gridAnim = null; };
            }
            grid.style.setProperty("--cw", cw.toFixed(2) + "px");
            grid.style.setProperty("--ch", ch.toFixed(2) + "px");
            grid.style.setProperty("--k", k.toFixed(4));

            const changed = Math.abs(cw - CARD_W) > 0.01 || Math.abs(ch - CARD_H) > 0.01;
            CARD_W = cw; CARD_H = ch; U = k;
            PTS_W = (cw - 7 * k) / k - 100 - 10;
            if (changed) {
                widthCache.clear();
                rendered.forEach(c => {
                    fitNumber(c, true);
                    if (c.leaving || !isFinite(c.rank)) return;
                    stopAnim(c);
                    placeAt(c, slotOf(c.rank));
                    c.el.style.zIndex = baseZ(c.rank);
                });
            }
        }

        let gridBox = null, gridAnim = null;

        function toggleHotbar() {
            hbHidden = !hbHidden;
            document.body.classList.toggle("hb-hidden", hbHidden);
            try { localStorage.setItem("lpHotbarHidden", hbHidden ? "1" : "0"); } catch (e) {}
            computeLayout(true);
        }
        document.getElementById("hbToggle").addEventListener("click", toggleHotbar);

        let resizeRaf = 0;
        let layoutKey = "";
        function onResize() {
            cancelAnimationFrame(resizeRaf);
            resizeRaf = requestAnimationFrame(() => {
                window.autoFitScreen();   // hotbar.js ho obaluje a hned posune lištu
                const box = hotbarBox();
                const key = [window.innerWidth, window.innerHeight, box && Math.round(box.top)].join("x");
                if (key === layoutKey) return;
                layoutKey = key;
                computeLayout(false);
            });
        }
        window.addEventListener("resize", onResize);
        window.addEventListener("orientationchange", onResize);

        // ---------- POMOCNÉ FUNKCE ----------
        function getTwemojiUrl(countryCode) {
            if (!countryCode || countryCode.length !== 2) return "https://twemoji.maxcdn.com/v/14.0.2/svg/1f1fa-1f1f8.svg";
            const cp = countryCode.toUpperCase().split("").map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65);
            return `https://twemoji.maxcdn.com/v/14.0.2/svg/${cp[0].toString(16)}-${cp[1].toString(16)}.svg`;
        }

        function getClanIconUrl(iconAsset) {
            if (!iconAsset) return ICON_FALLBACK;
            const m = String(iconAsset).match(/\d+/);
            return m ? `https://ps99.biggamesapi.io/image/${m[0]}` : ICON_FALLBACK;
        }

        // ---------- SLEDOVANÉ KLANY (pamatují se v prohlížeči) ----------
        const IS_TOUCH = window.matchMedia && matchMedia("(hover: none)").matches;
        let followed = new Set();
        try { followed = new Set(JSON.parse(localStorage.getItem("lpFollowed") || "[]")); } catch (e) {}

        function applyFollow(c) {
            if (!c.el) return;
            const on = followed.has(c.name);
            c.el.classList.toggle("is-followed", on);
            const fb = c.el.querySelector(".lp-follow");
            fb.title = on ? "Unfollow" : "Follow";
            fb.setAttribute("aria-label", fb.title);
        }

        function toggleFollow(c) {
            if (followed.has(c.name)) followed.delete(c.name); else followed.add(c.name);
            try { localStorage.setItem("lpFollowed", JSON.stringify([...followed])); } catch (e) {}
            applyFollow(c);
        }

        // ťuknutí mimo kartu schová tlačítko FOLLOW
        document.addEventListener("click", (e) => {
            if (!e.target.closest || !e.target.closest(".lp-card")) {
                document.querySelectorAll(".lp-card.show-follow").forEach(x => x.classList.remove("show-follow"));
            }
        });

        function formatDelta(n) {
            if (n < 10000) return "+" + n.toLocaleString("en-US");
            const f = (v, s) => "+" + (v < 10 ? parseFloat(v.toFixed(2)) : v < 100 ? parseFloat(v.toFixed(1)) : Math.floor(v)) + s;
            if (n >= 1e9) return f(n / 1e9, "b");
            if (n >= 1e6) return f(n / 1e6, "m");
            return f(n / 1e3, "k");
        }

        // velikost písma čísla podle šířky (měří se jednou pro každý počet číslic)
        const measurer = document.createElement("span");
        measurer.style.cssText = "position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-size:100px;font-family:'Roboto',sans-serif !important;font-weight:800 !important;font-variant-numeric:tabular-nums;";
        document.body.appendChild(measurer);
        const widthCache = new Map();

        function fitNumber(c, force) {
            if (!c.el) return;
            const str = c.shown.toLocaleString("en-US");
            if (!force && c.fitLen === str.length) return;
            c.fitLen = str.length;
            const key = str.replace(/\d/g, "8");
            let w = widthCache.get(key);
            if (w === undefined) {
                measurer.textContent = key;
                w = measurer.offsetWidth || 1;
                widthCache.set(key, w);
            }
            const size = Math.max(16, Math.min(40, (100 * PTS_W * 0.98) / w));
            c.numEl.style.fontSize = size.toFixed(2) + "px";
        }

        function slotOf(rank) {
            const i = rank % PER_PAGE;
            const col = Math.floor(i / ROWS);
            const row = i % ROWS;
            return { x: col * (CARD_W + GAP_PX_X), y: row * (CARD_H + GAP_PX_Y) };
        }

        function pageOf(rank) { return Math.floor(rank / PER_PAGE) + 1; }
        function onPage(rank) { return rank >= 0 && pageOf(rank) === page; }

        // nižší karta musí být nad vyšší, aby přes ni přečuhovalo "#x"
        function baseZ(rank) { return 10 + (rank % PER_PAGE); }

        // ---------- KARTA (jen pro viditelnou stránku) ----------
        function createCard(c) {
            const el = document.createElement("div");
            el.className = "lp-card";
            el.innerHTML = `
                <div class="lp-inner">
                    <div class="lp-glow"></div>
                    <div class="lp-content">
                        <div class="lp-rank"><span class="lp-rank-num"></span><span class="lp-up">▲</span></div>
                        <img class="lp-icon" draggable="false" decoding="async">
                        <img class="lp-flag" draggable="false" decoding="async">
                        <div class="lp-name"></div>
                        <div class="lp-pts"><span class="num"></span></div>
                        <div class="lp-delta"></div>
                        <div class="lp-follow" role="button"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.5.8-4.8 4.5 1.2 6.4L12 17.2l-5.7 3.2 1.2-6.4-4.8-4.5 6.5-.8z"/></svg></div>
                    </div>

                </div>`;
            c.el = el;
            c.inner = el.querySelector(".lp-inner");
            c.rankWrap = el.querySelector(".lp-rank");
            c.rankEl = el.querySelector(".lp-rank-num");
            c.upEl = el.querySelector(".lp-up");
            c.numEl = el.querySelector(".num");
            c.deltaEl = el.querySelector(".lp-delta");
            c.shownRank = -1;
            c.fitLen = 0;

            const icon = el.querySelector(".lp-icon");
            icon.onerror = () => { icon.onerror = null; icon.src = ICON_FALLBACK; };
            icon.src = getClanIconUrl(c.data.Icon);
            el.querySelector(".lp-flag").src = getTwemojiUrl(c.data.CountryCode);
            el.querySelector(".lp-name").textContent = `[${c.name}]`;
            el.onclick = () => {
                // na dotykovém displeji první ťuknutí jen ukáže tlačítko FOLLOW
                if (IS_TOUCH && !el.classList.contains("show-follow")) {
                    document.querySelectorAll(".lp-card.show-follow").forEach(x => x.classList.remove("show-follow"));
                    el.classList.add("show-follow");
                    return;
                }
                location.href = `/clan-detail/?name=${encodeURIComponent(c.name)}`;
            };
            const fb = el.querySelector(".lp-follow");
            fb.onclick = (e) => { e.stopPropagation(); toggleFollow(c); };
            applyFollow(c);

            setNumberStatic(c, c.shown);
            c.renderedPts = c.shown;
            fitNumber(c, true);

            grid.appendChild(el);
            rendered.add(c);
        }

        function destroyCard(c) {
            if (!c.el) return;
            stopAnim(c);
            clearTimeout(c.gainTimer);
            c.el.remove();
            c.el = null;
            c.leaving = false;
            rendered.delete(c);
        }

        function refreshStatic(c, d) {
            const key = [d.Icon, d.CountryCode].join("|");
            if (key === c.staticKey) return;
            c.staticKey = key;
            c.data = d;
            if (!c.el) return;
            c.el.querySelector(".lp-icon").src = getClanIconUrl(d.Icon);
            c.el.querySelector(".lp-flag").src = getTwemojiUrl(d.CountryCode);
        }

        // ---------- ODOMETR ----------
        // MAX_VALUES a DIGIT_SPEEDBOOST přesně jako odometer.js s duration 2500 (live.html)
        const ODO_MAX_VALUES = ((ODO_MS / (1000 / 30)) / 2) | 0;
        const ODO_SPEEDBOOST = 0.5;

        // postaví číslice pro dané číslo (statický stav)
        function setNumberStatic(c, value) {
            const str = value.toLocaleString("en-US");
            const frag = document.createDocumentFragment();
            c.digitEls = [];
            for (const ch of str) {
                if (ch >= "0" && ch <= "9") {
                    const d = document.createElement("span");
                    d.className = "d";
                    const s = document.createElement("span");
                    s.className = "s";
                    s.textContent = ch;
                    s._final = ch;
                    d.appendChild(s);
                    frag.appendChild(d);
                    c.digitEls.push(s);
                } else {
                    const sep = document.createElement("span");
                    sep.className = "c";
                    sep.textContent = ch;
                    frag.appendChild(sep);
                }
            }
            c.numEl.replaceChildren(frag);
            c.numFmtLen = str.length;
        }

        // animace nahoru – stejný výpočet pásů jako odometer.js animateSlide
        function animateNumber(c, from, to) {
            const str = to.toLocaleString("en-US");
            if (str.length !== c.numFmtLen) setNumberStatic(c, to);   // přibyla číslice → nová struktura
            const digitCount = c.digitEls.length;
            const ribbons = [];
            let boosted = 0;
            for (let i = 0; i < digitCount; i++) {
                const p = Math.pow(10, digitCount - i - 1);
                const start = Math.floor(from / p);
                const end = Math.floor(to / p);
                const dist = end - start;
                let frames;
                if (dist > ODO_MAX_VALUES) {
                    frames = [];
                    const incr = dist / (ODO_MAX_VALUES + ODO_MAX_VALUES * boosted * ODO_SPEEDBOOST);
                    for (let cur = start; cur < end; cur += incr) frames.push(Math.round(cur));
                    if (frames[frames.length - 1] !== end) frames.push(end);
                    boosted++;
                } else {
                    frames = [];
                    for (let v = start; v <= end; v++) frames.push(v);
                }
                const s = c.digitEls[i];
                const last = String(end % 10);
                s.classList.remove("go");
                s.style.transform = "";
                s._final = last;
                if (frames.length <= 1) { s.textContent = last; continue; }
                s.textContent = frames.map(f => f % 10).join("\n");
                ribbons.push([s, frames.length - 1]);
            }
            if (!ribbons.length) return;
            // start pásu se vykreslí, další snímek se pustí přechod (bez vynuceného přepočtu layoutu)
            requestAnimationFrame(() => requestAnimationFrame(() => {
                for (const [s, n] of ribbons) {
                    if (!s.isConnected || s.textContent.length < 2) continue;
                    s.classList.add("go");
                    s.style.transform = `translateY(${(-1.1 * n).toFixed(2)}em)`;
                }
            }));
        }

        // po dojetí pásu zůstane jen poslední hodnota
        grid.addEventListener("transitionend", e => {
            const s = e.target;
            if (!s.classList || !s.classList.contains("go")) return;
            s.classList.remove("go");
            s.style.transform = "";
            s.textContent = s._final;
        });

        function renderPoints(c) {
            if (!c.el || c.renderedPts === c.shown) return;
            const from = c.renderedPts;
            c.renderedPts = c.shown;
            fitNumber(c, false);
            if (!document.hidden && c.shown > from) animateNumber(c, from, c.shown);
            else setNumberStatic(c, c.shown);
        }

        // znovuspuštění CSS třídy bez vynuceného přepočtu layoutu
        function restartClass(el, cls) {
            el.classList.remove(cls);
            requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add(cls)));
        }

        function flashGain(c, delta) {
            if (!c.el || document.hidden) return;
            restartClass(c.inner, "is-gain");
            clearTimeout(c.gainTimer);
            c.gainTimer = setTimeout(() => c.inner && c.inner.classList.remove("is-gain"), 1350);

            c.deltaEl.textContent = formatDelta(delta);
            if (c.deltaAnim) c.deltaAnim.cancel();
            c.deltaAnim = c.deltaEl.animate([
                { offset: 0,    opacity: 0, transform: "translateY(-50%) scale(0.5)" },
                { offset: 0.09, opacity: 1, transform: "translateY(-50%) scale(1.15)" },
                { offset: 0.17, opacity: 1, transform: "translateY(-50%) scale(1)" },
                { offset: 0.72, opacity: 1, transform: "translateY(-50%) scale(1)" },
                { offset: 1,    opacity: 0, transform: "translateY(-110%) scale(0.95)" }
            ], { duration: 3400, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" });
        }

        function setRankText(c, rank, pop, up) {
            if (!c.el) return;
            if (c.shownRank !== rank) {
                c.shownRank = rank;
                const txt = `#${rank + 1}`;
                c.rankEl.textContent = txt;
                c.rankEl.style.fontSize = (txt.length <= 2 ? 20 : txt.length === 3 ? 18 : 14.5) + "px";
                c.rankWrap.classList.toggle("is-gold", rank === 0);
                c.rankWrap.classList.toggle("is-silver", rank === 1);
                c.rankWrap.classList.toggle("is-bronze", rank === 2);
            }
            if (pop) {
                c.rankEl.animate([{ transform: "scale(1)" }, { transform: "scale(1.45)", offset: 0.4 }, { transform: "scale(1)" }],
                    { duration: 550, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" });
            }
            if (up) {
                c.upEl.animate([
                    { offset: 0,    opacity: 0, transform: "translateY(40%) scale(0.4)" },
                    { offset: 0.12, opacity: 1, transform: "translateY(-10%) scale(1.25)" },
                    { offset: 0.22, opacity: 1, transform: "translateY(0) scale(1)" },
                    { offset: 0.75, opacity: 1, transform: "translateY(0) scale(1)" },
                    { offset: 1,    opacity: 0, transform: "translateY(-50%) scale(0.9)" }
                ], { duration: 2800, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" });
            }
        }

        // ---------- POHYB KARET ----------
        // Karty se pozicují přes transform (žádný přepočet layoutu).
        function placeAt(c, to) {
            c.x = to.x; c.y = to.y;
            c.el.style.transform = `translate(${to.x}px, ${to.y}px)`;
        }

        // aktuální pozice i uprostřed animace, bez čtení layoutu
        function currentPos(c) {
            if (c.anim && c.animFrom) {
                const t = Math.min(1, Math.max(0, (c.anim.currentTime || 0) / MOVE_MS));
                const k = t < 0.18 ? 0 : t > 0.72 ? 1 : (t - 0.18) / 0.54;
                const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
                return { x: c.animFrom.x + (c.x - c.animFrom.x) * e, y: c.animFrom.y + (c.y - c.animFrom.y) * e };
            }
            return { x: c.x, y: c.y };
        }

        // stín se zlatým okrajem a kroužek existují jen během animace
        // (i neviditelné rozmazané stíny u 50 karet stojí hodně výkonu)
        function addFx(c, cls) {
            const fx = document.createElement("div");
            fx.className = cls;
            c.el.insertBefore(fx, c.inner);
            return fx;
        }

        function clearFx(c) {
            if (c.shadowAnim) { c.shadowAnim.cancel(); c.shadowAnim = null; }
            if (c.ringAnim) { c.ringAnim.cancel(); c.ringAnim = null; }
            if (c.shadowEl) { c.shadowEl.remove(); c.shadowEl = null; }
            if (c.ringEl) { c.ringEl.remove(); c.ringEl = null; }
        }

        function stopAnim(c) {
            if (c.anim) { c.anim.onfinish = null; c.anim.cancel(); c.anim = null; }
            clearFx(c);
            c.animFrom = null;
            clearTimeout(c.rankTimer);
        }

        const T = (x, y, s, r) => `translate(${x}px, ${y}px) scale(${s}) rotate(${r || 0}deg)`;

        // předbíhající karta: zvednout (se zlatým okrajem) → přenést → dopadnout s lehkým odrazem
        function animateMove(c, to, kind) {
            const from = currentPos(c);
            stopAnim(c);
            placeAt(c, to);
            c.animFrom = from;
            const L = 12 * U;   // výška zvednutí
            const dir = to.x === from.x ? 0 : (to.x < from.x ? -1 : 1);

            if (kind === "lift") {
                c.el.style.zIndex = 400;
                c.anim = c.el.animate([
                    { offset: 0,    transform: T(from.x, from.y, 1, 0),                         easing: "cubic-bezier(0.25, 0.8, 0.35, 1)" },
                    { offset: 0.18, transform: T(from.x, from.y - L, 1.13, -1.6),               easing: "cubic-bezier(0.65, 0, 0.35, 1)" },
                    { offset: 0.72, transform: T(to.x, to.y - L, 1.13, dir ? 1.2 * dir : 1.2),   easing: "cubic-bezier(0.55, 0, 0.85, 0.35)" },
                    { offset: 0.84, transform: T(to.x, to.y + 2 * U, 0.96, 0),                  easing: "cubic-bezier(0.25, 0.8, 0.35, 1)" },
                    { offset: 0.93, transform: T(to.x, to.y - U, 1.025, 0),                     easing: "ease-in-out" },
                    { offset: 1,    transform: T(to.x, to.y, 1, 0) }
                ], { duration: MOVE_MS });
                c.shadowEl = addFx(c, "lp-lift-shadow");
                c.shadowAnim = c.shadowEl.animate(
                    [{ opacity: 0, offset: 0 }, { opacity: 1, offset: 0.18 }, { opacity: 1, offset: 0.72 }, { opacity: 0, offset: 0.84 }, { opacity: 0, offset: 1 }],
                    { duration: MOVE_MS }
                );
                c.ringEl = addFx(c, "lp-ring");
                c.ringAnim = c.ringEl.animate(
                    [{ opacity: 0.95, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.12, 1.45)" }],
                    { duration: 600, delay: MOVE_MS * 0.84, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)", fill: "backwards" }
                );
                c.rankTimer = setTimeout(() => setRankText(c, c.rank, true, true), MOVE_MS * 0.84);
            } else {
                // předběhnutá karta se přikrčí a podsune o příčku níž
                c.el.style.zIndex = 300;
                c.anim = c.el.animate([
                    { offset: 0,    transform: T(from.x, from.y, 1),     easing: "cubic-bezier(0.4, 0, 0.6, 1)" },
                    { offset: 0.18, transform: T(from.x, from.y, 0.94),  easing: "cubic-bezier(0.65, 0, 0.35, 1)" },
                    { offset: 0.72, transform: T(to.x, to.y, 0.94),      easing: "cubic-bezier(0.3, 0.7, 0.4, 1)" },
                    { offset: 0.86, transform: T(to.x, to.y, 1.015),     easing: "ease-in-out" },
                    { offset: 1,    transform: T(to.x, to.y, 1) }
                ], { duration: MOVE_MS });
                c.rankTimer = setTimeout(() => setRankText(c, c.rank, true, false), MOVE_MS * 0.8);
            }

            const anim = c.anim;
            anim.onfinish = () => {
                if (c.anim !== anim) return;
                c.anim = null;
                c.animFrom = null;
                if (c.el) { c.el.style.zIndex = baseZ(c.rank); setTimeout(() => { if (!c.anim && c.el) clearFx(c); }, 700); }
            };
        }

        // karta přichází (nová stránka / postup z nižší stránky)
        function animateIn(c, to, delay, climbed) {
            stopAnim(c);
            placeAt(c, to);
            c.el.style.zIndex = climbed ? 400 : baseZ(c.rank);
            c.el.style.opacity = "";
            setRankText(c, c.rank, false, false);
            const D = (dy, s) => `translate(${to.x}px, ${to.y + dy}px) scale(${s})`;
            if (climbed) {
                c.anim = c.el.animate([
                    { offset: 0,    opacity: 0, transform: D(-18 * U, 1.16) },
                    { offset: 0.5,  opacity: 1, transform: D(-12 * U, 1.13), easing: "cubic-bezier(0.55, 0, 0.85, 0.35)" },
                    { offset: 0.72, opacity: 1, transform: D(2 * U, 0.96),   easing: "cubic-bezier(0.25, 0.8, 0.35, 1)" },
                    { offset: 0.86, opacity: 1, transform: D(-U, 1.025),     easing: "ease-in-out" },
                    { offset: 1,    opacity: 1, transform: D(0, 1) }
                ], { duration: MOVE_MS * 0.85, fill: "backwards" });
                c.shadowEl = addFx(c, "lp-lift-shadow");
                c.shadowAnim = c.shadowEl.animate(
                    [{ opacity: 1, offset: 0 }, { opacity: 1, offset: 0.5 }, { opacity: 0, offset: 0.72 }, { opacity: 0, offset: 1 }],
                    { duration: MOVE_MS * 0.85 }
                );
                c.rankTimer = setTimeout(() => setRankText(c, c.rank, true, true), MOVE_MS * 0.85 * 0.72);
            } else {
                c.anim = c.el.animate([
                    { opacity: 0, transform: D(10 * U, 0.92) },
                    { opacity: 1, transform: D(0, 1) }
                ], { duration: 460, delay: delay || 0, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)", fill: "backwards" });
            }
            const anim = c.anim;
            anim.onfinish = () => {
                if (c.anim !== anim) return;
                c.anim = null;
                if (c.el) { c.el.style.zIndex = baseZ(c.rank); clearFx(c); }
            };
        }

        // karta odchází (jiná stránka / vypadla z top 500) → po animaci se smaže z DOM
        function animateOut(c, delay) {
            stopAnim(c);
            c.leaving = true;
            const anim = c.el.animate(
                [{ opacity: 1 }, { opacity: 0, transform: `translate(${c.x}px, ${c.y + 8 * U}px) scale(0.92)` }],
                { duration: 220, delay: delay || 0, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" }
            );
            c.anim = anim;
            anim.onfinish = () => { if (c.anim === anim) destroyCard(c); };
        }

        // ---------- ŘAZENÍ ----------
        function sortOrder() {
            order = [...clans.values()]
                .filter(c => !c.removed)
                .sort((a, b) => (b.shown - a.shown) || (b.lastApi - a.lastApi) || a.name.localeCompare(b.name))
                .slice(0, MAX_CLANS);
            order.forEach((c, i) => { c.newRank = i; });
        }

        let relayoutQueued = false;
        function queueRelayout() {
            if (relayoutQueued) return;
            relayoutQueued = true;
            requestAnimationFrame(() => { relayoutQueued = false; relayout(true); });
        }

        function relayout(animate) {
            sortOrder();
            const anim = animate && !document.hidden;
            const start = (page - 1) * PER_PAGE;

            // karty, které už na stránku nepatří
            rendered.forEach(c => {
                const inOrder = order[c.newRank] === c && !c.removed;
                if (inOrder && onPage(c.newRank)) return;
                if (c.leaving) return;
                if (inOrder) c.rank = c.newRank;
                if (anim) animateOut(c); else destroyCard(c);
            });

            // karty viditelné stránky
            for (let rank = start; rank < Math.min(start + PER_PAGE, order.length); rank++) {
                const c = order[rank];
                const oldRank = c.rank;
                c.rank = rank;
                const to = slotOf(rank);

                if (!c.el || c.leaving) {
                    if (c.el) destroyCard(c);
                    createCard(c);
                    if (anim) animateIn(c, to, 0, oldRank > rank);
                    else { placeAt(c, to); c.el.style.zIndex = baseZ(rank); setRankText(c, rank, false, false); }
                    continue;
                }
                if (oldRank === rank) continue;
                if (!anim) {
                    stopAnim(c);
                    placeAt(c, to);
                    c.el.style.zIndex = baseZ(rank);
                    setRankText(c, rank, false, false);
                    continue;
                }
                animateMove(c, to, rank < oldRank ? "lift" : "slide");
            }

            // pořadí i u klanů mimo stránku
            order.forEach((c, i) => { c.rank = i; });
            clans.forEach(c => { if (c.removed && !c.el) clans.delete(c.name); });
        }

        // ---------- STRÁNKY (#1-50 … #451-500) ----------
        function updatePager() {
            const s = (page - 1) * PER_PAGE + 1;
            document.getElementById("pageText").textContent = `#${s}-${s + PER_PAGE - 1}`;
            document.getElementById("prevPageBtn").classList.toggle("is-disabled", page === 1);
            document.getElementById("nextPageBtn").classList.toggle("is-disabled", page === PAGES);
        }

        function showPage(p) {
            if (p === page || p < 1 || p > PAGES) return;
            page = p;
            updatePager();
            rendered.forEach(c => animateOut(c, 0));
            clearTimeout(showPage.t);
            showPage.t = setTimeout(() => {
                rendered.forEach(c => destroyCard(c));
                sortOrder();
                const start = (page - 1) * PER_PAGE;
                for (let rank = start; rank < Math.min(start + PER_PAGE, order.length); rank++) {
                    const c = order[rank];
                    c.rank = rank;
                    createCard(c);
                    const i = rank - start;
                    animateIn(c, slotOf(rank), (Math.floor(i / ROWS) * 3 + (i % ROWS)) * 18, false);
                }
            }, 230);
        }

        document.getElementById("prevPageBtn").onclick = () => showPage(page - 1);
        document.getElementById("nextPageBtn").onclick = () => showPage(page + 1);
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft") showPage(page - 1);
            if (e.key === "ArrowRight") showPage(page + 1);
        });

        // ---------- PŘIČÍTÁNÍ BODŮ ----------
        // Jednoduchý a předvídatelný model:
        //  • Když API vrátí víc bodů, rozdíl se rozdělí na 4 stejné kroky po 15 s (= 1 minuta).
        //  • Každý klan má pevné "místo" v 15s cyklu (podle jména), takže se kroky klanů
        //    rozprostřou v čase → pořád se něco přičítá, ale každý klan max. 1× za 15 s.
        //  • Jedny hodiny pro všechny klany (žádné stovky časovačů).
        //  • Když je záložka na pozadí, nic neběží; po návratu se čísla tiše srovnají.
        // místo v cyklu: n-tý klan dostane (n × zlatý řez) mod 1 → místa jsou rovnoměrně
        // rozházená a i sousední klany v žebříčku přičítají daleko od sebe
        let phaseCounter = 0;
        function phaseOf() {
            const f = (phaseCounter++ * 0.6180339887498949) % 1;
            return f * STEP_MS * 0.97;
        }
        const MIN_GAP_MS = 150;          // na viditelné stránce nikdy dva klany ve stejný okamžik

        function nextSlot(c, now) {
            const t = Math.floor(now / STEP_MS) * STEP_MS + c.phase;
            return t > now + 150 ? t : t + STEP_MS;
        }

        let reorderTimer = null;
        function scheduleReorder(delay) {
            if (reorderTimer) return;
            reorderTimer = setTimeout(() => { reorderTimer = null; queueRelayout(); }, delay);
        }

        let lastVisibleStepAt = 0;
        function engineTick() {
            if (firstLoad || document.hidden) return;
            const now = Date.now();
            let visibleChange = false, anyChange = false;
            // nejdřív ty, co čekají nejdéle
            const due = [];
            clans.forEach(c => { if (!c.removed && c.steps > 0 && now >= c.nextAt) due.push(c); });
            due.sort((a, b) => a.nextAt - b.nextAt);
            due.forEach(c => {
                const onScreen = c.el && !c.leaving;
                // viditelné karty po jedné: když už teď jedna přičítala, další počká na příští tik
                if (onScreen && now - lastVisibleStepAt < MIN_GAP_MS) return;
                const before = c.shown;
                c.steps--;
                c.shown = c.steps === 0 ? c.target : Math.min(c.target, Math.round(c.shown + c.chunk));
                c.nextAt += STEP_MS;
                if (c.nextAt <= now) c.nextAt = nextSlot(c, now);
                const delta = c.shown - before;
                if (delta <= 0) return;
                anyChange = true;
                if (onScreen) {
                    renderPoints(c);
                    flashGain(c, delta);
                    visibleChange = true;
                    lastVisibleStepAt = now;
                }
            });
            // nejdřív se dotočí číslo, pak teprve karty předběhnou
            if (anyChange) scheduleReorder(visibleChange ? REORDER_DELAY_MS : 0);
        }
        setInterval(engineTick, 50);

        // tiché srovnání: všechno hned na poslední známou hodnotu, bez animací
        function settleAll() {
            clans.forEach(c => {
                c.shown = c.target;
                c.steps = 0;
                if (c.el && c.renderedPts !== c.shown) {
                    c.renderedPts = c.shown;
                    setNumberStatic(c, c.shown);
                    fitNumber(c, false);
                }
            });
            if (reorderTimer) { clearTimeout(reorderTimer); reorderTimer = null; }
            relayout(false);
        }

        function ingest(list) {
            const now = Date.now();
            const seen = new Set();
            list.slice(0, MAX_CLANS).forEach(d => {
                if (!d || !d.Name) return;
                const pts = Math.max(0, Math.round(Number(d.Points) || 0));
                seen.add(d.Name);
                let c = clans.get(d.Name);

                if (!c) {
                    c = { name: d.Name, data: d, shown: pts, target: pts, lastApi: pts, chunk: 0, steps: 0,
                          rank: Infinity, el: null, phase: phaseOf(), nextAt: 0, missing: 0 };
                    c.staticKey = [d.Icon, d.CountryCode].join("|");
                    clans.set(d.Name, c);
                    return;
                }

                c.removed = false;
                c.missing = 0;
                refreshStatic(c, d);
                if (pts === c.lastApi) return;

                if (pts > c.lastApi) {
                    // víc bodů → zbytek do nové hodnoty rozložit na 4 kroky (zachová se místo v cyklu)
                    c.lastApi = pts;
                    c.target = pts;
                    c.chunk = (pts - c.shown) / SMOOTH_STEPS;
                    if (c.steps <= 0 || c.nextAt <= now) c.nextAt = nextSlot(c, now);
                    c.steps = SMOOTH_STEPS;
                } else if (pts < c.lastApi * RESET_DROP) {
                    // velký propad = nová bitva → hned a bez animace
                    c.lastApi = c.target = c.shown = pts;
                    c.steps = 0;
                    if (c.el) { c.renderedPts = pts; setNumberStatic(c, pts); fitNumber(c, false); }
                }
                // menší pokles = API vrátilo starší data → ignorovat (čísla nikdy necukají dolů)
            });

            // klan zmizí z žebříčku až když chybí ve 2 staženích po sobě (ne kvůli jedné vadné odpovědi)
            clans.forEach(c => {
                if (seen.has(c.name)) return;
                c.missing = (c.missing || 0) + 1;
                if (c.missing >= 2) { c.removed = true; c.steps = 0; }
            });
        }

        // ---------- DATA ----------
        let demoData = null;
        function demoFetch() {
            const countries = ["US", "CZ", "SK", "PL", "DE", "GB", "FR", "CA", "AU", "BR", "JP", "KR", "NL", "SE", "ES", "IT", "UA", "MX"];
            if (!demoData) {
                const used = new Set();
                demoData = [];
                for (let i = 0; i < MAX_CLANS; i++) {
                    let n;
                    do { n = Array.from({ length: 3 + (i % 2) }, () => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join(""); } while (used.has(n));
                    used.add(n);
                    demoData.push({ Name: n, Points: Math.round(18000000000 * Math.pow(0.99, i) + Math.random() * 3e7), CountryCode: countries[i % countries.length], Icon: "" });
                }
            } else {
                demoData.forEach(d => {
                    if (Math.random() < 0.6) {
                        const big = Math.random() < 0.08;
                        d.Points += Math.round((big ? 0.04 : 0.004) * d.Points * Math.random()) + Math.floor(Math.random() * 120);
                    }
                });
            }
            return Promise.resolve(demoData.map(d => ({ ...d })).sort((a, b) => b.Points - a.Points));
        }

        async function fetchTop() {
            if (DEMO) return demoFetch();
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
            let json;
            try {
                const res = await fetch(`${WORKER_URL}/clans?page=1&pageSize=${MAX_CLANS}&sort=Points&sortOrder=desc`, { signal: ctrl.signal, cache: "no-store" });
                json = await res.json();
            } finally { clearTimeout(to); }
            if (!json || json.status !== "ok" || !Array.isArray(json.data) || json.data.length < 10) throw new Error("bad data");
            return json.data;
        }

        function showStatus(text) {
            const el = document.getElementById("statusText");
            el.textContent = text || "";
            el.style.opacity = text ? "1" : "0";
        }

        let fetching = false, fetchSeq = 0, appliedSeq = 0;
        async function tick() {
            nextTickAt = Date.now() + TICK_MS;
            if ((document.hidden && !firstLoad) || fetching) return;
            fetching = true;
            const seq = ++fetchSeq;
            try {
                const list = await fetchTop();
                if (seq < appliedSeq) return;          // starší odpověď, která dorazila pozdě
                appliedSeq = seq;
                if (document.hidden && !firstLoad) { ingest(list); settleAll(); lastOkAt = Date.now(); return; }
                ingest(list);
                if (firstLoad) {
                    firstLoad = false;
                    sortOrder();
                    order.forEach((c, i) => { c.rank = i; });
                    // první načtení: kaskádový nástup karet
                    const start = (page - 1) * PER_PAGE;
                    for (let rank = start; rank < Math.min(start + PER_PAGE, order.length); rank++) {
                        const c = order[rank];
                        createCard(c);
                        const i = rank - start;
                        animateIn(c, slotOf(rank), (Math.floor(i / ROWS) * 3 + (i % ROWS)) * 22, false);
                    }
                } else {
                    queueRelayout();
                }
                lastOkAt = Date.now();
                showStatus("");
            } catch (e) {
                console.warn(e);
                if (firstLoad) showStatus("Could not load data. Retrying...");
            } finally {
                fetching = false;
            }
        }

        function loop() {
            tick().finally(() => setTimeout(loop, Math.max(500, nextTickAt - Date.now())));
        }

        function updateBadge() {
            if (!lastOkAt) return;
            const s = Math.floor((Date.now() - lastOkAt) / 1000);
            const text = s < 60 ? `LIVE · ${s}s ago` : `LIVE · ${Math.floor(s / 60)}m ago`;
            const t = document.getElementById("liveBadgeText");
            if (t.textContent !== text) t.textContent = text;
            document.getElementById("liveBadge").classList.toggle("is-stale", s > 60);
        }

        // záložka na pozadí: nic neběží. Po návratu se všechno tiše srovná na poslední
        // hodnoty (žádná lavina přičítání a přeskupování) a hned se stáhnou čerstvá data.
        document.addEventListener("visibilitychange", () => {
            if (document.hidden || firstLoad) return;
            settleAll();
            if (Date.now() - lastOkAt > 3000) tick();
        });

        autoFitScreen();
        computeLayout();
        updatePager();
        loop();
        // jakmile hotbar.js postaví a umístí lištu, karty se přizpůsobí místu nad ní
        document.addEventListener("DOMContentLoaded", () => setTimeout(onResize, 0));
        window.addEventListener("load", () => setTimeout(onResize, 0));
        setInterval(updateBadge, 1000);

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                widthCache.clear();
                rendered.forEach(c => fitNumber(c, true));
            });
        }
    </script>

    <script src="/hotbar.js?v=5"></script>
</body>
