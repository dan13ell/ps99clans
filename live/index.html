    <script>
        const WORKER_URL = "https://rough-pine-d90f.ps99clans.workers.dev";
        const params = new URLSearchParams(window.location.search);
        const clanName = params.get('name') || "";

        // ---------- NASTAVENÍ ----------
        const POLL_MS = 10000;          // jak často se stahuje klan (worker ho drží v cache 10 s)
        const BATTLE_MS = 300000;       // aktivní bitva se obnovuje jednou za 5 minut
        const GEM_RANK_MS = 120000;     // pořadí v gemech jednou za 2 minuty
        const SMOOTH_MS = 15000;        // plynulé dopočítávání bodů mezi aktualizacemi
        const CHART_MAX_POINTS = 240;   // kolik bodů drží graf

        // Velikost čísel: width = do jaké šířky (px) se číslo vejde, max/min = rozsah písma
        const MAIN_FIT = { width: 520, max: 88, min: 26 };   // velké číslo s body
        const STAT_FIT = { width: 190, max: 52, min: 14 };    // gemy / průměr / členové

        const returnUrl = `/clan-detail/?name=${encodeURIComponent(clanName)}`;
        document.getElementById("liveBackBtn").onclick = () => { location.href = returnUrl; };
        document.getElementById("liveCloseBtn").onclick = () => { location.href = returnUrl; };

        let currentPoints = 0;
        let currentGems = 0;
        let currentMembers = 0;

        let lastApiPoints = 0;
        let lastApiGems = 0;
        let lastApiMembers = 0;

        let isFirstLoad = true;
        let isFetching = false;
        let lastOkAt = 0;

        let activeBattleId = "";
        let battleFetchedAt = 0;
        let gemRankAt = 0;
        let gemRankLoading = false;
        let staticKey = "";

        let smoothId = null;
        let smoothStep = 0;
        let smoothChunk = 0;
        let smoothTarget = 0;

        let pointsChart = null;
        let history = [];
        let lastChartAt = 0;

        // ---------- AUTO-FIT OBRAZOVKY ----------
        function autoFitScreen() {
            const scaler = document.getElementById("appScaler");
            if (!scaler) return;

            const winW = window.innerWidth;
            const winH = window.innerHeight;

            if (winW >= 1150) {
                document.body.classList.remove("is-mobile");
                scaler.style.transform = "none";
                return;
            }

            document.body.classList.add("is-mobile");
            const requiredW = 1120;
            const requiredH = 960; 

            const scaleX = winW / requiredW;
            const scaleY = winH / requiredH;

            const scale = Math.min(scaleX, scaleY) * 0.92;
            scaler.style.transform = `scale(${scale})`;
        }

        window.addEventListener("resize", autoFitScreen);
        window.addEventListener("orientationchange", autoFitScreen);

        // ---------- POMOCNÉ FUNKCE ----------
        function getTwemojiUrl(countryCode) {
            if (!countryCode || countryCode.length !== 2) return "https://twemoji.maxcdn.com/v/14.0.2/svg/1f1fa-1f1f8.svg";
            const codePoints = countryCode.toUpperCase().split('').map(char => 0x1F1E6 + char.charCodeAt(0) - 65);
            return `https://twemoji.maxcdn.com/v/14.0.2/svg/${codePoints[0].toString(16)}-${codePoints[1].toString(16)}.svg`;
        }

        function getClanIconUrl(iconString) {
            if (!iconString) return "https://placehold.co/150x150/ffffff/000000?text=No+Icon";
            const cleanId = iconString.replace("rbxassetid://", "").trim();
            if (!cleanId) return "https://placehold.co/150x150/ffffff/000000?text=No+Icon";
            return `https://ps99.biggamesapi.io/image/${cleanId}`;
        }

        function adjustDescSize(el) {
            if (!el) return;
            let currentSize = 22;
            el.style.fontSize = currentSize + "px";
            while (el.scrollHeight > 35 && currentSize > 10) {
                currentSize--;
                el.style.fontSize = currentSize + "px";
            }
        }

        function setRankTextAndScale(el, text) {
            if (!el) return;
            el.textContent = text;
            const len = text.length;
            let size = 20;
            if (len <= 3) size = 20;
            else if (len === 4) size = 17;
            else if (len >= 5) size = 13;
            el.style.fontSize = size + "px";
        }

        // ---------- VELIKOST ČÍSEL (přesné měření podle skutečného písma) ----------
        const measurer = document.createElement("span");
        measurer.style.cssText = "position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-size:100px !important;font-family:'Roboto',sans-serif !important;font-weight:800 !important;";
        document.body.appendChild(measurer);

        function fitFontSize(value, cfg) {
            measurer.textContent = Number(value).toLocaleString("en-US");
            const w = measurer.offsetWidth || 1;
            const size = (100 * cfg.width * 0.97) / w;
            return Math.max(cfg.min, Math.min(cfg.max, size));
        }

        function setOdometer(id, value, cfg) {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.fontSize = fitFontSize(value, cfg).toFixed(1) + "px";
            if (el.dataset.v !== String(value)) {
                el.dataset.v = String(value);
                el.innerHTML = value;
            }
        }

        function renderNumbers() {
            const avg = currentMembers > 0 ? Math.round(currentPoints / currentMembers) : 0;
            setOdometer("liveWarPoints", currentPoints, MAIN_FIT);
            setOdometer("liveStatGems", currentGems, STAT_FIT);
            setOdometer("liveStatAvgPoints", avg, STAT_FIT);
            setOdometer("liveStatMembers", currentMembers, STAT_FIT);
        }

        function updateUI() {
            renderNumbers();
            if (currentPoints > 0) updatePointsChart(currentPoints);
        }

        // ---------- GRAF (historie je jen v paměti stránky) ----------
        function formatShort(value) {
            const abs = Math.abs(value);
            const fmt = (v, s) => parseFloat(v.toFixed(2)) + s;
            if (abs >= 1e12) return fmt(value / 1e12, 'T');
            if (abs >= 1e9) return fmt(value / 1e9, 'B');
            if (abs >= 1e6) return fmt(value / 1e6, 'M');
            if (abs >= 1e3) return fmt(value / 1e3, 'K');
            return String(value);
        }

        function agoLabel(t) {
            const s = Math.max(0, Math.round((Date.now() - t) / 1000));
            if (s < 5) return "now";
            if (s < 60) return `${Math.round(s / 5) * 5}s ago`;
            const m = Math.floor(s / 60);
            if (m < 60) return `${m}m ago`;
            return `${Math.floor(m / 60)}h ago`;
        }

        function refreshChartLabels() {
            if (!pointsChart || document.hidden) return;
            pointsChart.data.labels = history.map(h => agoLabel(h.t));
            pointsChart.update('none');
        }

        function updatePointsChart(pointsValue) {
            if (typeof Chart === "undefined") return;
            const canvas = document.getElementById('livePointsChart');
            if (!canvas) return;

            const nowMs = Date.now();
            const last = history[history.length - 1];
            const changed = !last || last.value !== pointsValue;

            if (changed || nowMs - lastChartAt >= 15000) {
                history.push({ t: nowMs, value: pointsValue });
                if (history.length > CHART_MAX_POINTS) history.shift();
                lastChartAt = nowMs;
            } else {
                return;
            }

            const labels = history.map(h => agoLabel(h.t));
            const data = history.map(h => h.value);

            if (pointsChart) {
                pointsChart.data.labels = labels;
                pointsChart.data.datasets[0].data = data;
                pointsChart.update('none');
                return;
            }

            pointsChart = new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Points',
                        data: data,
                        borderColor: '#FFFFFF',
                        borderWidth: 3,
                        backgroundColor: (context) => {
                            const chart = context.chart;
                            const { ctx, chartArea } = chart;
                            if (!chartArea) return null;
                            const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                            gradient.addColorStop(0, 'rgba(28, 46, 74, 0.8)');
                            gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
                            return gradient;
                        },
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#FFFFFF',
                        pointBorderColor: '#000000',
                        pointBorderWidth: 2,
                        pointRadius: (c) => (c.chart.data.labels.length > 40 ? 0 : 4),
                        pointHoverRadius: 6,
                        pointHitRadius: 18
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#FFFFFF',
                            titleColor: '#262C2D',
                            bodyColor: '#262C2D',
                            titleFont: { family: 'Fredoka', size: 14, weight: 'bold' },
                            bodyFont: { family: 'Roboto', size: 13, weight: 'bold' },
                            borderColor: '#000000',
                            borderWidth: 2,
                            cornerRadius: 6,
                            displayColors: false,
                            callbacks: {
                                label: function (context) {
                                    const val = context.parsed.y;
                                    const idx = context.dataIndex;
                                    let diffText = "";
                                    if (idx > 0) {
                                        const diff = val - context.dataset.data[idx - 1];
                                        diffText = ` (${diff >= 0 ? '+' : ''}${diff.toLocaleString()})`;
                                    }
                                    return ` Points: ${val.toLocaleString()}${diffText}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(0, 0, 0, 0.08)' },
                            ticks: {
                                color: '#262C2D',
                                font: { family: 'Fredoka', size: 11 },
                                maxTicksLimit: 6,
                                maxRotation: 0
                            }
                        },
                        y: {
                            grid: { color: 'rgba(0, 0, 0, 0.08)' },
                            ticks: {
                                color: '#262C2D',
                                font: { family: 'Roboto', size: 11, weight: 'bold' },
                                callback: (value) => formatShort(value)
                            }
                        }
                    }
                }
            });
        }

        // ---------- PLYNULÉ DOPOČÍTÁVÁNÍ BODŮ (4 kroky po 15 s) ----------
        function stopSmoothing() {
            if (smoothId) { clearInterval(smoothId); smoothId = null; }
        }

        function stepSmoothing() {
            smoothStep++;
            if (smoothStep >= 4) {
                currentPoints = smoothTarget;
                stopSmoothing();
            } else {
                currentPoints = Math.round(currentPoints + smoothChunk);
            }
            updateUI();
        }

        function startSmoothing(target) {
            stopSmoothing();
            smoothTarget = target;
            smoothStep = 0;
            smoothChunk = (target - currentPoints) / 4;
            stepSmoothing();
            if (smoothStep < 4) smoothId = setInterval(stepSmoothing, SMOOTH_MS);
        }

        // ---------- POŘADÍ V GEMECH (na pozadí, jednou za pár minut) ----------
        async function refreshGemRank(name) {
            if (gemRankLoading) return;
            gemRankLoading = true;
            let rankText = null;
            try {
                const res = await fetch(`${WORKER_URL}/clans?page=1&pageSize=1000&sort=DepositedDiamonds&sortOrder=desc`);
                const json = await res.json();
                if (json && json.status === "ok" && Array.isArray(json.data)) {
                    const idx = json.data.findIndex(c => c.Name.toLowerCase() === name.toLowerCase());
                    rankText = idx !== -1 ? `#${idx + 1}` : "N/A";
                }
            } catch (e) {}
            if (rankText) {
                setRankTextAndScale(document.getElementById("liveGemsRank"), rankText);
                gemRankAt = Date.now();
            }
            gemRankLoading = false;
        }

        // ---------- HLAVNÍ NAČÍTÁNÍ ----------
        function showStatus(text) {
            const el = document.getElementById("liveStatusText");
            if (!el) return;
            if (text) { el.textContent = text; el.style.display = "block"; }
            else el.style.display = "none";
        }

        function renderStatic(clan) {
            const key = [clan.Name, clan.Desc, clan.Icon, clan.CountryCode].join("|");
            if (key === staticKey) return;
            staticKey = key;

            const titleEl = document.getElementById("liveClanTitle");
            const descEl = document.getElementById("liveClanDesc");
            const iconEl = document.getElementById("liveClanIcon");
            const flagEl = document.getElementById("liveFlag");

            if (titleEl) titleEl.textContent = `[${clan.Name}]`;
            if (descEl) {
                descEl.textContent = clan.Desc || "No description.";
                adjustDescSize(descEl);
            }
            if (iconEl) iconEl.src = getClanIconUrl(clan.Icon);
            if (flagEl && clan.CountryCode) flagEl.src = getTwemojiUrl(clan.CountryCode);
        }

        async function fetchLive() {
            if (isFetching || !clanName) return;
            isFetching = true;

            try {
                const needBattle = !activeBattleId || (Date.now() - battleFetchedAt > BATTLE_MS);

                const [clanRes, battleRes] = await Promise.all([
                    fetch(`${WORKER_URL}/clan/${encodeURIComponent(clanName)}`),
                    needBattle ? fetch(`${WORKER_URL}/activeClanBattle`).catch(() => null) : Promise.resolve(null)
                ]);

                const responseData = await clanRes.json();
                if (!responseData || responseData.status !== "ok" || !responseData.data) {
                    if (isFirstLoad) showStatus("Clan not found!");
                    return;
                }

                if (battleRes) {
                    try {
                        const battleJson = await battleRes.json();
                        if (battleJson && battleJson.status === "ok" && battleJson.data) {
                            activeBattleId = battleJson.data.configName || battleJson.data.id || battleJson.data.Title || activeBattleId;
                            battleFetchedAt = Date.now();
                        }
                    } catch (e) {}
                }

                const clan = responseData.data;
                renderStatic(clan);

                // body a pořadí z aktivní války
                let warPoints = 0;
                let warPlace = null;
                if (clan.Battles && typeof clan.Battles === 'object') {
                    let matched = null;
                    if (activeBattleId && clan.Battles[activeBattleId]) matched = clan.Battles[activeBattleId];
                    else if (Array.isArray(clan.Battles)) matched = clan.Battles.find(b => b.BattleID === activeBattleId);
                    else {
                        const keys = Object.keys(clan.Battles);
                        if (keys.length > 0) matched = clan.Battles[keys[0]];
                    }
                    if (matched) {
                        warPoints = matched.Points || 0;
                        warPlace = matched.Place || null;
                    }
                }
                if (warPoints === 0 && clan.Points) warPoints = clan.Points;

                const incomingPoints = warPoints;
                const incomingGems = clan.DepositedDiamonds || clan.Diamonds || 0;
                const rawMembers = Array.isArray(clan.Members) ? clan.Members.length : 0;
                const incomingMembers = rawMembers > 0 ? rawMembers + 1 : 0;

                setRankTextAndScale(
                    document.getElementById("livePointsRank"),
                    (warPlace !== null && warPlace !== undefined) ? `#${warPlace}` : "N/A"
                );

                if (isFirstLoad) {
                    currentPoints = lastApiPoints = incomingPoints;
                    currentGems = lastApiGems = incomingGems;
                    currentMembers = lastApiMembers = incomingMembers;
                    isFirstLoad = false;
                    updateUI();
                } else {
                    let changed = false;

                    if (incomingPoints !== lastApiPoints) {
                        lastApiPoints = incomingPoints;
                        if (incomingPoints > currentPoints) {
                            startSmoothing(incomingPoints);
                        } else {
                            stopSmoothing();
                            currentPoints = incomingPoints;
                            changed = true;
                        }
                    }
                    if (incomingGems !== lastApiGems) {
                        currentGems = lastApiGems = incomingGems;
                        changed = true;
                    }
                    if (incomingMembers !== lastApiMembers) {
                        currentMembers = lastApiMembers = incomingMembers;
                        changed = true;
                    }

                    if (changed) updateUI();
                    else updatePointsChart(currentPoints);
                }

                if (Date.now() - gemRankAt > GEM_RANK_MS) refreshGemRank(clan.Name);

                lastOkAt = Date.now();
                showStatus("");

            } catch (err) {
                console.warn(err);
                if (isFirstLoad) showStatus("Could not load data. Retrying...");
            } finally {
                isFetching = false;
            }
        }

        // ---------- "LIVE" ZNAČKA ----------
        function updateBadge() {
            const badge = document.getElementById("liveBadge");
            const text = document.getElementById("liveBadgeText");
            if (!badge || !text || !lastOkAt) return;
            const s = Math.floor((Date.now() - lastOkAt) / 1000);
            let ago;
            if (s < 60) ago = `${s}s ago`;
            else ago = `${Math.floor(s / 60)}m ago`;
            text.textContent = `LIVE · ${ago}`;
            badge.classList.toggle("is-stale", s > 60);
        }

        // ---------- SMYČKA ----------
        async function pollLoop() {
            if (!document.hidden) await fetchLive();
            setTimeout(pollLoop, POLL_MS);
        }

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && Date.now() - lastOkAt > POLL_MS) fetchLive();
        });

        window.addEventListener('DOMContentLoaded', () => {
            autoFitScreen();
            pollLoop();
            setInterval(() => { if (!document.hidden) updateBadge(); }, 1000);
            setInterval(refreshChartLabels, 5000);

            if (document.fonts && document.fonts.load) {
                document.fonts.load("800 100px Roboto").then(renderNumbers).catch(() => {});
            }
        });
    </script>
